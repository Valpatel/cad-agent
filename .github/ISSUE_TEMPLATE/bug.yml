name: Bug
description: A cad-agent command crashes or gives a wrong result.
title: "Bug: "
labels: [bug]
body:
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest public input and the exact command.
      render: shell
    validations: {required: true}
  - type: textarea
    id: result
    attributes:
      label: Expected and actual
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: cad-agent version or commit, OS, Python
    validations: {required: true}
