name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast: the package with only its required dependency; every optional-dependency test must skip cleanly.
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: cad-agent --help

  # Full: CAD, FEA and site extras, so the geometry, mesh and solver tests run instead of skipping.
  full:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - name: System libraries for the gmsh and VTK wheels
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1 libgl1 libegl1
      - run: pip install -e ".[cad,fea,site,dev]"
      - run: python -m pytest -q -rs
