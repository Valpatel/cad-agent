name: Supply-chain report
# Weekly online run of tools/resource_audit.py (#117; skills/cad-supply-chain/SKILL.md, docs/supply-chain.md). It reads
# OSV.dev, npm audit, PyPI, the npm registry and its tarballs, deps.dev, the GitHub API and the OpenSSF Scorecard API,
# then opens, updates or closes ONE issue ("Supply-chain report: open findings") when the findings change. It never
# pushes, never opens a PR and never merges. Fixes go through normal PRs.
#
# Two jobs, so the token that can write issues never sits beside untrusted input:
# - report (contents: read) fetches and parses every third-party answer and uploads the report as an artifact;
# - issue (issues: write) downloads that artifact and only runs `issue --post`, which reads our own JSON with the
#   standard library alone (no pip install in this job).
# Third-party text reaches the issue only as data, with @mentions and #references broken (no_mentions in the tool).
#
# The job's GITHUB_TOKEN cannot read repository settings (secret scanning, Dependabot alerts: they need admin), so this
# run leaves --repo out; the owner checks those with their own login (the skill says how). Network answers vary, so
# this workflow never gates anything; CI's supply-chain job runs the offline checks instead.
#
# Reference health (#323 phase 4; research/references/README.md): three more jobs on the same schedule.
# - references (contents: read, actions: read) checks the registry's links on dev with `tools/resource_audit.py
#   references` (one request a second per host, at most 400 records a run, the longest unchecked first), starting from
#   the last run's state (its artifact); lychee checks every link in the published Markdown. It uploads the state and
#   a patch from tools/references_health_apply.py: only evidence-class changes, never the health itself (Q5).
# - references-issue (issues: write) keeps ONE issue, "Reference health: open findings", from that JSON alone.
# - references-pr (contents: write, pull-requests: write) applies the patch on a fresh bot/references-health-* branch
#   from dev and opens one PR into dev, closing last week's. It refuses a patch that touches anything but the shards.
#   A PR the workflow's token opens does not start CI: close and reopen it to run the checks. If the repository does
#   not let Actions open PRs, the branch is pushed and the job says so.
on:
  schedule:
    - cron: "41 6 * * 1"         # Mondays 06:41 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: supply-chain-report
  cancel-in-progress: false

jobs:
  report:
    # This repository only; a dispatch runs the copy on the branch it names, so only the default branch's copy runs.
    if: github.repository == 'Valpatel/cad-agent' && (github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with: {python-version: '3.12'}
      - run: pip install pyyaml        # the tool is stdlib plus pyyaml
      - name: Run the report (online)
        env:
          GH_TOKEN: ${{ github.token }}      # read-only here; it only raises the GitHub API rate limit
        run: |
          mkdir -p build
          python3 tools/resource_audit.py report --online \
            --json build/security-report.json --md build/security-report.md --fail-on none
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: security-report
          path: build/security-report.*
          retention-days: 30

  issue:
    needs: report
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      # No setup-python and no pip: `issue` needs only the standard library (the runner's python3), so the one job that
      # can write issues runs no third-party package code.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with: {name: security-report, path: build}
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/resource_audit.py issue --report build/security-report.json --repo "$GITHUB_REPOSITORY" --post

  references:
    if: github.repository == 'Valpatel/cad-agent' && (github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read        # the last run's references-health artifact (the state this run starts from)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {ref: dev, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with: {python-version: '3.12'}
      - run: pip install pyyaml
      - name: The last run's state
        # Only this repository's own weekly runs seed the state (their streaks drive the bot's edits): scheduled or
        # dispatched runs of the default branch's copy of this workflow, which check out dev. A run of any other branch's
        # copy is never read.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p build/last
          for id in $(gh run list -R "$REPO" --workflow supply-chain.yml --branch "$DEFAULT" --limit 20 \
                        --json databaseId,status,event,headBranch \
                        -q '.[] | select(.status == "completed" and .headBranch == "'"$DEFAULT"'"
                                      and (.event == "schedule" or .event == "workflow_dispatch")) | .databaseId'); do
            if gh run download "$id" -R "$REPO" -n references-health -D build/last 2>/dev/null; then
              echo "state from run $id"; break
            fi
          done
          ls build/last
      - name: Markdown links (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8   # v2.9.0 (lychee v0.24.2)
        with:
          args: >-
            --no-progress --max-concurrency 8 --host-concurrency 1 --host-request-interval 1s --timeout 30
            --max-retries 1 --include-fragments --exclude-all-private
            --exclude '^https?://([a-z0-9-]+\.)*example\.(com|org|net)'
            --exclude-path research/security-report.md
            'README.md' '.github/CONTRIBUTING.md' 'THIRD_PARTY_NOTICES.md' 'docs/*.md' 'research/*.md' 'lessons/**/*.md'
            'skills/*/SKILL.md' 'agents/*.md'
          format: json
          output: build/lychee.json
          fail: false
          failIfEmpty: false
          jobSummary: false
          token: ${{ github.token }}
      - name: Reference records (online)
        env:
          GH_TOKEN: ${{ github.token }}      # read-only here; it only raises the GitHub API rate limit
        run: |
          state=build/last/references-health.json
          python3 tools/resource_audit.py references --online $( [ -f "$state" ] && echo --state "$state" ) \
            --lychee build/lychee.json --json build/references-health.json --md build/references-health.md
      - name: Evidence changes for the bot PR
        continue-on-error: true      # a failure here costs only this week's PR, never the state the next run needs
        run: |
          python3 tools/references_health_apply.py --health build/references-health.json --write \
            --body build/references-health-pr.md
          PYTHONPATH=src python3 -m cadagent.review.references --check > /dev/null
          git diff -- research/references > build/references-health.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: references-health
          path: |
            build/references-health.*
            build/references-health-pr.md
            build/lychee.json
          retention-days: 90      # the next run's state: kept long enough to survive a few missed weeks

  references-issue:
    needs: references
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      # Standard library only (the runner's python3), as in the issue job above.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with: {name: references-health, path: build}
      - name: Open or update the reference health issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/resource_audit.py issue --report build/references-health.json --repo "$GITHUB_REPOSITORY" \
            --title "Reference health: open findings" --post

  references-pr:
    needs: references
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write          # push the bot/references-health-* branch (dev and main are protected by rulesets)
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {ref: dev}
      # No Python here: git applies a patch whose paths are checked first, and gh opens the PR.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with: {name: references-health, path: build}
      - name: Open the weekly bot PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          patch=build/references-health.patch
          branch=
          note="No evidence changes this week: its conditions cleared, or dev has them already."
          if [ -s "$patch" ]; then
            # guard: the bot only ever edits existing shards in place. --summary prints nothing for that and a line for
            # every rename, copy, create, delete or mode change (a symlink included); --numstat names every path.
            if [ -n "$(git apply --summary "$patch")" ]; then
              echo "::error::the patch renames, creates, deletes or changes the mode of a file"; exit 1
            fi
            bad=$(git apply --numstat "$patch" | cut -f3 | grep -Ev '^research/references/[a-z0-9-]+\.yaml$' || true)
            if [ -n "$bad" ]; then echo "::error::the patch touches files outside the shards: $bad"; exit 1; fi
            git apply "$patch"
            bad=$(git status --porcelain --untracked-files=all | grep -Ev '^ M research/references/[a-z0-9-]+\.yaml$' || true)
            if [ -n "$bad" ]; then echo "::error::after the patch, more than shard edits: $bad"; exit 1; fi
            # end guard
            day=$(date -u +%F)
            branch="bot/references-health-$day-$GITHUB_RUN_ID"
            git switch -c "$branch"
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qam "Reference health: evidence changes from the checks of $day (#323)"
            git push -q origin "$branch"
            if url=$(gh pr create -R "$REPO" --base dev --head "$branch" --body-file build/references-health-pr.md \
                       --title "Reference health: evidence changes ($day)"); then
              echo "opened $url"; note="Superseded by $url: the edits are worked out again from dev each week."
            else
              echo "::warning::Actions may not open PRs in this repository; the edits are on branch $branch"
              note="Superseded by branch $branch."
            fi
          else
            echo "$note"
          fi
          # last week's bot PR and branch go, with or without a patch this week
          for old in $(git ls-remote --heads origin 'refs/heads/bot/references-health-*' | cut -f2 | sed 's#refs/heads/##'); do
            [ "$old" = "$branch" ] && continue
            for n in $(gh pr list -R "$REPO" --state open --head "$old" --json number -q '.[].number'); do
              gh pr close "$n" -R "$REPO" --comment "$note"
            done
            git push -q origin --delete "$old"
          done
