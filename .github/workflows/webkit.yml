name: Webkit components
on:
  pull_request:
  push:
    branches: [dev, main]
jobs:
  browser:
    runs-on: ubuntu-24.04
    # Same Playwright release as tools/site/package-lock.json; browsers and Noble system dependencies are baked in.
    # Pin the registry manifest, not a mutable tag. Both prior push attempts spent >10m in apt and hit the
    # unchanged 20m job cap before later suites ran; the image removes that redundant provisioning phase.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      # The hosted checkout is mounted into a root-owned test container; trust this exact CI workspace only.
      - name: Trust the checked-out workspace in the test container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tools/site/package-lock.json
            tools/mermaid/package-lock.json
      - run: npm ci
        working-directory: tools/site
      - run: npm ci --ignore-scripts
        working-directory: tools/mermaid
      # The matching pinned image already contains Chromium, WebKit and their system dependencies.
      # npm ci still installs the exact locked Playwright library; no browser/apt install is needed here.
      # The site's Mermaid diagrams as earlier runs drew them (tools/site/compiler/site-diagrams.mjs: .cache/site-diagrams/, one file per
      # drawing, named by a hash of its source, theme, Mermaid, the kit, the font and the drawing code, so a changed
      # diagram is drawn again and a stale one never used). The key adds what that hash leaves out: the browser that draws
      # and the font packages baked into the matching container (both follow Playwright's version), and
      # the pinned container image with its other fonts (a new image draws everything once). It also names the files in that hash,
      # so a change to them starts an empty cache instead of carrying every old drawing along.
      - name: Key the diagram cache
        id: diagrams
        run: echo "key=site-diagrams-playwright-1.56.1-noble-f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a-${{ hashFiles('tools/site/package-lock.json', 'tools/site/compiler/site-diagrams.mjs', 'tools/site/assets/site.css', 'software/cadagent/webkit/diagrams.*', 'software/cadagent/webkit/vendor/mermaid/**', 'software/cadagent/webkit/vendor/fonts/**') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: .cache/site-diagrams
          key: ${{ steps.diagrams.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.engine }}
          restore-keys: ${{ steps.diagrams.outputs.key }}-
      # One build of HEAD for every site test below: CAD_AGENT_SITE points them at it (tests/site/built-site.mjs).
      - name: Build the site
        id: site
        run: |
          set -o pipefail
          node tools/site/build-site.mjs --out "$RUNNER_TEMP/site" | tee "$RUNNER_TEMP/site.log"
          echo "CAD_AGENT_SITE=$RUNNER_TEMP/site" >> "$GITHUB_ENV"
          grep -q ', 0 drawn' "$RUNNER_TEMP/site.log" || echo "drew=true" >> "$GITHUB_OUTPUT"
      # Ordinary source-only owner maps keep their source namespace; validate their actual diagrams without
      # publishing new catalogue routes. Save these committed-source drawings before fixture tests add their own.
      - name: Check folder map diagrams
        id: maps
        if: matrix.engine == 'chromium'
        run: node --test --test-name-pattern='all owned folder diagrams' tests/site/website-repo-map.test.mjs
        env:
          CAD_AGENT_REPO_MAP_DIAGRAMS: '1'
      # Saved only when the site or actual source maps drew something the cache lacked, before fixture drawings.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        if: steps.site.outputs.drew == 'true' || steps.maps.outputs.drew == 'true'
        with:
          path: .cache/site-diagrams
          key: ${{ steps.diagrams.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.engine }}
      - run: npm run test:webkit-unit
        working-directory: tools/site
      # The build's own tests do not depend on the engine (their diagrams are drawn in Chromium either way), so they run
      # once, in the Chromium job.
      - run: node --test tests/site/website-*.test.mjs
        if: matrix.engine == 'chromium'
      - run: node tests/site/website-browser.mjs
        env:
          PLAYWRIGHT_CHANNEL: chromium
          PLAYWRIGHT_BROWSER: ${{ matrix.engine }}
      - run: node tests/site/website-catalog-browser.mjs
        env:
          PLAYWRIGHT_CHANNEL: chromium
          PLAYWRIGHT_BROWSER: ${{ matrix.engine }}
      - run: npm run test:assembly-guide
        working-directory: tools/site
        env:
          PLAYWRIGHT_CHANNEL: chromium
          PLAYWRIGHT_BROWSER: ${{ matrix.engine }}
      - run: npm run test:stage
        working-directory: tools/site
        env:
          PLAYWRIGHT_CHANNEL: chromium
          PLAYWRIGHT_BROWSER: ${{ matrix.engine }}
          TEST_SOURCE_REVISION: ${{ github.sha }}
      - run: npm run test:part-table
        working-directory: tools/site
        env:
          PLAYWRIGHT_CHANNEL: chromium
          PLAYWRIGHT_BROWSER: ${{ matrix.engine }}
      - run: npm run test:file-viewer
        working-directory: tools/site
        env:
          PLAYWRIGHT_CHANNEL: chromium
          PLAYWRIGHT_BROWSER: ${{ matrix.engine }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: '3.12'
      # Invoke pip through setup-python's interpreter; cached script launchers can contain host-only paths.
      - run: python -m pip install -e ".[site]"
      - run: npm run test:assembly-release
        working-directory: tools/site
        env:
          PLAYWRIGHT_CHANNEL: chromium
          PLAYWRIGHT_BROWSER: ${{ matrix.engine }}
      - run: npm run test:diagrams
        working-directory: tools/site
        env:
          PLAYWRIGHT_CHANNEL: chromium
          PLAYWRIGHT_BROWSER: ${{ matrix.engine }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: always()
        with:
          name: webkit-${{ matrix.engine }}
          path: /tmp/cad-agent-*
