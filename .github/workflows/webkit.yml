name: Webkit components
# DIAGNOSTIC branch only (ci/719-webkit-stress-2, never merged): repeats the failing WebKit checks for #719 and #686 and
# uploads every receipt. The normal browser and scada jobs are left out to save runner minutes.
on:
  pull_request:
jobs:
  stress:
    name: stress (${{ matrix.engine }} ${{ matrix.mode }} load=${{ matrix.load }} ${{ matrix.arm }} ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: webkit, mode: keyboard, load: routes, arm: final773, shard: 1 }
          - { engine: webkit, mode: keyboard, load: routes, arm: final773, shard: 2 }
          - { engine: webkit, mode: keyboard, load: routes, arm: final773, shard: 3 }
          - { engine: webkit, mode: keyboard, load: routes, arm: final773, shard: 4 }
          - { engine: webkit, mode: outline, load: none, arm: unchanged, shard: 1 }
          - { engine: webkit, mode: outline, load: routes, arm: unchanged, shard: 1 }
          - { engine: webkit, mode: outline, load: none, arm: fix776, shard: 1 }
          - { engine: webkit, mode: outline, load: none, arm: fix776, shard: 2 }
          - { engine: webkit, mode: outline, load: routes, arm: fix776, shard: 1 }
          - { engine: webkit, mode: nav, load: none, arm: instrumented, shard: 1 }
          - { engine: webkit, mode: nav, load: none, arm: instrumented, shard: 2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      # The hosted checkout is mounted into a root-owned test container; trust this exact CI workspace only.
      - name: Trust the checked-out workspace in the test container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tools/site/package-lock.json
            tools/mermaid/package-lock.json
      - run: npm ci
        working-directory: tools/site
      - run: npm ci --ignore-scripts
        working-directory: tools/mermaid
      # The matching pinned image already contains Chromium, WebKit and their system dependencies.
      # npm ci still installs the exact locked Playwright library; no browser/apt install is needed here.
      # The site's Mermaid diagrams as earlier runs drew them (tools/site/compiler/site-diagrams.mjs: .cache/site-diagrams/, one file per
      # drawing, named by a hash of its source, theme, Mermaid, the kit, the font and the drawing code, so a changed
      # diagram is drawn again and a stale one never used). The key adds what that hash leaves out: the browser that draws
      # and the font packages baked into the matching container (both follow Playwright's version), and
      # the pinned container image with its other fonts (a new image draws everything once). It also names the files in that hash,
      # so a change to them starts an empty cache instead of carrying every old drawing along.
      - name: Key the diagram cache
        id: diagrams
        run: echo "key=site-diagrams-playwright-1.56.1-noble-f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a-${{ hashFiles('tools/site/package-lock.json', 'tools/site/compiler/site-diagrams.mjs', 'tools/site/assets/site.css', 'software/cadagent/webkit/documents/diagrams.*', 'software/cadagent/webkit/vendor/mermaid/**', 'software/cadagent/webkit/vendor/fonts/**') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: .cache/site-diagrams
          key: ${{ steps.diagrams.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.engine }}
          restore-keys: ${{ steps.diagrams.outputs.key }}-
      # One build of HEAD for every site test below: CAD_AGENT_SITE points them at it (tests/site/built-site.mjs).
      - name: Build the site
        id: site
        run: |
          set -o pipefail
          node tools/site/build-site.mjs --out "$RUNNER_TEMP/site" | tee "$RUNNER_TEMP/site.log"
          echo "CAD_AGENT_SITE=$RUNNER_TEMP/site" >> "$GITHUB_ENV"
          grep -q ', 0 drawn' "$RUNNER_TEMP/site.log" || echo "drew=true" >> "$GITHUB_OUTPUT"
      - name: Stress the failing checks
        run: node tests/site/website-browser.mjs
        env:
          PLAYWRIGHT_CHANNEL: chromium
          PLAYWRIGHT_BROWSER: ${{ matrix.engine }}
          CAD_AGENT_STRESS: ${{ matrix.mode }}
          CAD_AGENT_STRESS_LOAD: ${{ matrix.load }}
          CAD_AGENT_STRESS_ARM: ${{ matrix.arm }}
          CAD_AGENT_STRESS_MINUTES: '20'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: always()
        with:
          name: stress-${{ matrix.engine }}-${{ matrix.mode }}-${{ matrix.load }}-${{ matrix.arm }}-${{ matrix.shard }}
          path: /tmp/cad-agent-*
