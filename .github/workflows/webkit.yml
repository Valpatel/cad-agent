name: Webkit components
on:
  pull_request:
  push:
    branches: [dev, main]
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run test:webkit-unit
      - run: npm run test:part-table
        env:
          PLAYWRIGHT_CHANNEL: chromium
          PLAYWRIGHT_BROWSER: ${{ matrix.engine }}
      - run: npm run test:file-viewer
        env:
          PLAYWRIGHT_CHANNEL: chromium
          PLAYWRIGHT_BROWSER: ${{ matrix.engine }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[site]"
      - run: npm run test:diagrams
        env:
          PLAYWRIGHT_CHANNEL: chromium
          PLAYWRIGHT_BROWSER: ${{ matrix.engine }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        if: always()
        with:
          name: webkit-${{ matrix.engine }}
          path: /tmp/cad-agent-*
