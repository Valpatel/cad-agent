name: Webkit components
on:
  pull_request:
  push:
    branches: [dev, main]
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The site build draws its diagrams in headless Chromium (tools/site-diagrams.mjs, #132), so both engines' jobs
      # need it: the WebKit job then tests the drawn pages in WebKit.
      - run: npx playwright install --with-deps chromium ${{ matrix.engine == 'webkit' && 'webkit' || '' }}
      - run: npm run test:webkit-unit
      - run: node --test tests/website-*.test.mjs
      - run: node tests/website-browser.mjs
        env:
          PLAYWRIGHT_CHANNEL: chromium
          PLAYWRIGHT_BROWSER: ${{ matrix.engine }}
      - run: node tests/website-catalog-browser.mjs
        env:
          PLAYWRIGHT_CHANNEL: chromium
          PLAYWRIGHT_BROWSER: ${{ matrix.engine }}
      - run: npm run test:part-table
        env:
          PLAYWRIGHT_CHANNEL: chromium
          PLAYWRIGHT_BROWSER: ${{ matrix.engine }}
      - run: npm run test:file-viewer
        env:
          PLAYWRIGHT_CHANNEL: chromium
          PLAYWRIGHT_BROWSER: ${{ matrix.engine }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -e ".[site]"
      - run: npm run test:diagrams
        env:
          PLAYWRIGHT_CHANNEL: chromium
          PLAYWRIGHT_BROWSER: ${{ matrix.engine }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: always()
        with:
          name: webkit-${{ matrix.engine }}
          path: /tmp/cad-agent-*
