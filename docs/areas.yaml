# The topic tree: domain → area → topic (#139, #140). The one place that names an area; the site's area hubs (#141),
# the evaluation jobs (#142) and folder names (#145) use these slugs. Read docs/vision.md first.
#
# Every node: slug, title, scope (one line), maturity, and optionally:
#   priority  gyropup (needed for Gyropup to become real) and/or demo (makes a good video or interactive demo)
#   pages     repo-relative Markdown pages (docs/, research/)       cli      `cad-agent` subcommands
#   api       cadagent modules (today's import paths)                skills   skills/<name>/SKILL.md
#   agents    agents/<name>.md                                       lessons  a lessons/ folder this node owns (#133)
#   issues    open cad-agent issues or pull requests                 projects keys of `projects` below
# A list may name the same item under several nodes. tests/test_areas.py checks that every item exists, that every
# docs/ and research/ page, command, skill and agent is placed somewhere, and that every lessons/ folder is claimed.
#
# Keep the map whole: a PR that adds a docs or research page, a `cad-agent` command, a skill or an agent adds its line
# here. When two open PRs cross, the one that merges second adds it, after merging dev and re-running its CI (dev does
# not require branches to be up to date, so an older green run proves nothing about the map).
#
# Maturity values are first estimates; correct them when evidence says otherwise, and only then. An area or topic is
# judged on its own evidence, and an area is never below its most mature topic. A domain's maturity is the highest of
# its areas': it says how far the domain's best-developed area has got, and its hub shows every area's level beside it.
#
# Module names in `api` are import paths, the package paths since #121 (cadagent.sim.fea and so on). The old flat
# paths still import with a warning until v0.7.0, but the test rejects them here.
version: 1

maturity:
  - {level: idea, means: "named here so work has a place to land; nothing built yet"}
  - {level: surveyed, means: "open-source tools and published sources found and compared; adopt-vs-build recorded"}
  - {level: tooling, means: "deterministic tools or checks with tests, and a page that states their limits"}
  - {level: validated, means: "several independent sources agree, confidence recorded, standard jobs pass"}
  - {level: proven, means: "used on a real project, with a measured physical result"}

projects:
  gyropup: {title: Gyropup, url: "https://github.com/Valpatel/gyropup"}
  j501-enclosure: {title: J501 AGX enclosure, url: "https://github.com/mvalancy/j501-agx-orin"}
  thor-can-breakout: {title: AGX Thor CAN breakout, url: "https://github.com/mvalancy/pcb-agx-thor-can-breakout"}

cross_cutting:
  pages: [docs/vision.md, docs/toolkit.md, research/landscape.md]
  api: [cadagent.geometry, cadagent.project, cadagent.links]
  issues: [106, 113, 139]

