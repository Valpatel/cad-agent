# See it run: the two viewers are written by the build from their model sources; these are the cards beside them.
showcase:
  turret:
    img: docs/img/gyropup/turret-playground.webp
    still: docs/img/gyropup/turret-playground-still.webp
    title: Gyropup's turret playground
    caption: Gyropup's browser playground, model "Turret on the Orin AGX box", armed and firing foam balls at
      targets. Recorded from Gyropup {revision} by tools/site/figures/gyropup-turret.mjs. An unqualified
      work-in-progress prototype; the ball flight is the playground's simplified model, not physics validation.
    alt: A foam-ball turret on a compute box fires a stream of balls at targets in a 3D yard
    href: https://gyropup.com/designer/sim
  cards:
  - toolkit: robot-replay
    caption: A recorded MuJoCo run of an illustrative two-link arm. Scrub time and orbit; it is a replay, not a
      live solver.
  - toolkit: scada-simulations
    caption: A wastewater digester and other connected processes. Operate equipment and inject faults; the models
      are illustrative and editable.
  - toolkit: assembly
    caption: Step through a synthetic rail assembly's declared insertion order, part by part.
# From frontier to local: the arc, each step with what holds today and what is next.
arc:
- title: Use it on real projects
  today: People and agents on frontier models use cad-agent on real builds such as Gyropup and the J501 enclosure.
  next: More outside projects, so gaps show up beyond our own.
  href: docs/vision.md
- title: Improve it
  today: A gap becomes a reviewed PR with tests, sources and stated limits, merged under gates.
  next: Skills for triaging and integrating outside contributions.
  href: .github/CONTRIBUTING.md
- title: Gather the best
  today: '{catalog} catalogue entries (outside tools, guides, lessons and skills) and {references} reference records,
    {sources-read} of them read at source; each area states its maturity.'
  next: A confidence level on every rule and tool.
  href: docs/research/README.md
- title: Measure smaller models
  today: Three analytical jobs with independent graders. Three recorded attempts passed, all on one hosted frontier
    model; two CLI attempts produced no artifact. No baseline without cad-agent.
  next: Paired trials with and without cad-agent on a local model first, then a lower-cost hosted one. No local or
    open model has been measured yet.
  href: docs/practice/standard-evaluation.md
# The checks reel: animated, source-bound results; three more stay one click away as text links.
reel:
- img: docs/img/fea/mesh-convergence.svg
  still: docs/img/hero/result-stills/mesh-convergence-still.svg
  'on': example
  tool: cadagent.simulation.fea
  title: A mesh that earns its answer
  caption: 'Recorded steel L-bracket, 100 N load: the sharp-corner peak keeps rising with refinement; an R1.5 fillet
    settles near 439 MPa. Convergence is not proof of physical strength.'
  alt: Recorded sharp and filleted L-bracket mesh-refinement sequences and peak stress values
  href: docs/toolkit.md
- field: docs/img/cfd/fan-faces.webp
  img: docs/img/hero/thermal-history.svg
  still: docs/img/hero/result-stills/thermal-history-still.svg
  'on': example
  tool: cadagent.simulation.cfd
  title: Watch a thermal solve settle
  caption: 'Recorded 20 W box: heater-zone average temperature over 1,500 solver iterations. Iterations are not
    elapsed seconds. This is a simulation, not a measured hardware temperature.'
  alt: Actual sampled heater-zone temperature history over 1500 iterations
  href: docs/research/simulation-tools.md
- field: docs/img/cfd/fan-faces.webp
  img: docs/img/hero/airflow-balance.svg
  still: docs/img/hero/result-stills/airflow-balance-still.svg
  'on': example
  tool: cadagent.simulation.cfd
  title: A flow picture is not enough
  caption: 'Recorded fan cases: 3.75 versus 2.77 g/s. The ducted case is not steady and misses the energy balance
    by 10.9 percent; that failure stays visible. Not a cooling qualification.'
  alt: Two recorded cases showing mass flow and heat balance, including the failed ducted case
  href: docs/research/simulation-tools.md
- img: docs/img/motion/hinge-sweep.svg
  still: docs/img/hero/result-stills/hinge-sweep-still.svg
  'on': fixture-2d
  tool: cad-agent gates
  title: When a moving arm first hits the frame
  caption: A seeded fault, the test bench's arm range raised to 60 degrees. Swept in 12 poses, then bisected, contact
    starts between 44.89 and 44.91 degrees.
  alt: A seeded fault, an arm swept from 0 to 60 degrees; it first shares volume with the frame beam between 44.89
    and 44.91 degrees
  href: docs/practice/gates.md
- img: docs/img/motion/search-front.svg
  still: docs/img/hero/result-stills/search-front-still.svg
  'on': example
  tool: cad-agent optimise
  title: Searching designs by cost and mass
  caption: Sixty seeded trials as they arrive. Four are feasible, and trials 1 and 47 form the Pareto front.
  alt: Sixty seeded random design trials plotted by cost and mass as they arrive, with the Pareto front marked
  href: docs/explore.md
more_checks:
- title: A rib that refills a counterbore
  caption: "Two build orders of the same part. A rib added after the holes were cut fills both; the hole check finds it."
  tool: cad-agent holes
  href: docs/practice/common-issues.md
- title: A port window sized from the mating plug
  caption: "An RJ45 plug pushed in. Through a window sized from the jack's box its latch hits the wall; through one derived from the plug it clears by 0.5 mm."
  tool: cadagent.mechanical.connectors
  href: docs/practice/common-issues.md
- title: A module that slides in as one piece
  caption: "A carrier and its board checked on their own bench, then inserted into the parent as one rigid body and withdrawn again."
  tool: cad-agent gates
  href: docs/mechanical/subassembly-insertion.md
