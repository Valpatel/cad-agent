# Every visible example has a real animated figure, source and limits. See docs/img/hero/README.md (#605).
reel:
- img: docs/img/fea/mesh-convergence.svg
  still: docs/img/hero/result-stills/mesh-convergence-still.svg
  'on': example
  tool: cadagent.simulation.fea
  title: A mesh that earns its answer
  caption: 'Recorded steel L-bracket, 100 N load: the sharp-corner peak keeps rising with refinement; an R1.5 fillet
    settles near 439 MPa. Convergence is not proof of physical strength.'
  alt: Recorded sharp and filleted L-bracket mesh-refinement sequences and peak stress values
  href: docs/toolkit.md
- field: docs/img/cfd/fan-faces.webp
  img: docs/img/hero/thermal-history.svg
  still: docs/img/hero/result-stills/thermal-history-still.svg
  'on': example
  tool: cadagent.simulation.cfd
  title: Watch a thermal solve settle
  caption: 'Recorded 20 W box: heater-zone average temperature over 1,500 solver iterations. Iterations are not
    elapsed seconds. This is a simulation, not a measured hardware temperature.'
  alt: Actual sampled heater-zone temperature history over 1500 iterations
  href: docs/research/simulation-tools.md#3-cfd--conjugate-heat-transfer
- field: docs/img/cfd/fan-faces.webp
  img: docs/img/hero/airflow-balance.svg
  still: docs/img/hero/result-stills/airflow-balance-still.svg
  'on': example
  tool: cadagent.simulation.cfd
  title: A flow picture is not enough
  caption: 'Recorded fan cases: 3.75 versus 2.77 g/s. The ducted case is not steady and misses the energy balance
    by 10.9 percent; that failure stays visible. Not a cooling qualification.'
  alt: Two recorded cases showing mass flow and heat balance, including the failed ducted case
  href: docs/research/simulation-tools.md#3-cfd--conjugate-heat-transfer
- img: docs/img/motion/rib-in-counterbore.svg
  still: docs/img/hero/result-stills/rib-in-counterbore-still.svg
  'on': fixture-2d
  tool: cad-agent holes
  title: A rib that refills a counterbore
  caption: Two build orders of the same part. A rib added after the holes were cut fills both; the hole check finds
    it.
  alt: Section through a screw hole in two build orders; a rib unioned after the hole and counterbore were cut refills
    both
  href: docs/practice/common-issues.md
- img: docs/img/motion/connector-window.svg
  still: docs/img/hero/result-stills/connector-window-still.svg
  'on': fixture
  tool: cadagent.mechanical.connectors
  title: A port window sized from the mating plug
  caption: An RJ45 plug pushed in. Through a window sized from the jack's box its latch hits the wall; through one
    derived from the plug it clears by 0.5 mm.
  alt: An RJ45 plug pushed along its mating axis through two panel windows; only the window derived from the plug
    clears the latch
  href: docs/practice/common-issues.md
- img: docs/img/motion/hinge-sweep.svg
  still: docs/img/hero/result-stills/hinge-sweep-still.svg
  'on': fixture-2d
  tool: cad-agent gates
  title: When a moving arm first hits the frame
  caption: A seeded fault, the test bench's arm range raised to 60 degrees. Swept in 12 poses, then bisected, contact
    starts between 44.89 and 44.91 degrees.
  alt: A seeded fault, an arm swept from 0 to 60 degrees; it first shares volume with the frame beam between 44.89
    and 44.91 degrees
  href: docs/practice/gates.md
- img: docs/img/motion/module-insertion.svg
  still: docs/img/hero/result-stills/module-insertion-still.svg
  'on': fixture
  tool: cad-agent gates
  title: A module that slides in as one piece
  caption: A carrier and its board checked on their own bench, then inserted into the parent as one rigid body and
    withdrawn again.
  alt: A preassembled module inserted into its parent as one rigid body, then withdrawn
  href: docs/mechanical/subassembly-insertion.md
- img: docs/img/motion/search-front.svg
  still: docs/img/hero/result-stills/search-front-still.svg
  'on': example
  tool: cad-agent optimise
  title: Searching designs by cost and mass
  caption: Sixty seeded trials as they arrive. Four are feasible, and trials 1 and 47 form the Pareto front.
  alt: Sixty seeded random design trials plotted by cost and mass as they arrive, with the Pareto front marked
  href: docs/explore.md
fits:
  make:
  - name: text-to-cad
    upstream: earthtojake/text-to-cad
    does: build123d models, STEP and 3MF, drawings, DfAM checks, print handoff
    note: vendored in software/vendor/, pinned, telemetry and update check removed by patch
    href: https://github.com/Valpatel/cad-agent/tree/dev/vendor/text-to-cad
  - name: build123d and CadQuery
    does: The code-CAD kernels (both on OCP); our own tools and projects are CadQuery
    href: docs/research/agent-workflow/landscape.md
  - name: KiCad MCP servers
    does: Schematics and boards; kicad-mcp-pro and kicad-happy are vendored, pinned and in trial
    href: docs/research/agent-workflow/landscape.md
  ours:
  - title: Fit and access before fabrication
    does: 'Follow computed geometry through real checks: an arm sweeps until it touches the frame. Fixture evidence,
      not a physical qualification.'
    areas:
    - design-process
    - review-and-evidence
    href: docs/practice/gates.md
    img: docs/img/motion/hinge-sweep.svg
  - title: Numerical evidence with limits
    does: A recorded mesh study separates a singular peak from a converging filleted result. The load, mesh and
      assumptions remain available.
    areas:
    - structural-fea
    href: docs/toolkit.md
    img: docs/img/fea/mesh-convergence.svg
  - title: Thermal and airflow diagnosis
    does: Inspect recorded solver traces and energy checks, including a case that did not settle. A moving picture
      never substitutes for a balance check.
    areas:
    - cfd
    href: docs/research/fea-and-process-tools.md
    img: docs/img/hero/airflow-balance.svg
