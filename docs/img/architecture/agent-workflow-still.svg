<svg xmlns="http://www.w3.org/2000/svg" width="480" height="430" viewBox="0 0 480 430" role="img" aria-labelledby="title desc"><title id="title">Skills guide the work</title><desc id="desc">Conceptual illustration, not measured simulation. Review is a separate step, not an automatic approval. Choose a skill: Read sources and limits. Source: .agents/skills/README.md. Use the toolkit: Produce a scoped change. Source: software/cadagent/README.md. Check the result: Tests and visible evidence. Source: tests/README.md. Peer review: Approve or return findings. Source: .agents/agents/cad-pr-reviewer.md</desc>
