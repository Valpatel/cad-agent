<svg xmlns="http://www.w3.org/2000/svg" width="480" height="350" viewBox="0 0 480 350" role="img" aria-labelledby="title desc"><title id="title">One process, several views</title><desc id="desc">Conceptual handoffs, not measured simulation. 1. System + model: IDs, ports and equations. Source: software/cadagent/webkit/scada/sim/README.md. 2. Shared session: Commands and steps. Source: software/cadagent/webkit/scada/explorer/README.md. 3. Snapshot adapter: Readings and capabilities. Source: software/cadagent/webkit/scada/sim/src/adapter.mjs. 4. Diagram views: Symbols and controls. Source: software/cadagent/webkit/scada/ui/README.md</desc>
