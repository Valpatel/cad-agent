<svg xmlns="http://www.w3.org/2000/svg" width="480" height="430" viewBox="0 0 480 430" role="img" aria-labelledby="title desc"><title id="title">One process, several views</title><desc id="desc">Conceptual illustration, not measured simulation. The host owns the session; diagrams observe its state. System + model: IDs, ports and equations. Source: software/cadagent/webkit/scada/sim/README.md. Shared session: Commands and steps. Source: software/cadagent/webkit/scada/explorer/README.md. Snapshot adapter: Readings and capabilities. Source: software/cadagent/webkit/scada/sim/src/adapter.mjs. Diagram views: Symbols and controls. Source: software/cadagent/webkit/scada/ui/README.md</desc>
<style>text{font-family:system-ui,sans-serif}.flow,.return{stroke-dasharray:6 8}.flow{animation:flow 2.8s linear infinite}.return{animation:flow 4s linear infinite}.gear{animation:turn 20s linear infinite}.scan{animation:scan 3s ease-in-out infinite alternate}.check,.level{animation:readout 2s ease-in-out infinite alternate}.sweep{animation:sweep 4s ease-in-out infinite alternate}@keyframes sweep{from{transform:translateX(-90px)}to{transform:translateX(90px)}}@keyframes flow{to{stroke-dashoffset:-28}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes scan{to{opacity:.25}}@keyframes readout{to{opacity:.5}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><marker id="amber-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc579"/></marker><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3de0d4"/></marker></defs>
<rect width="480" height="430" rx="18" fill="#091a29"/>
<text x="24" y="34" font-size="22" text-anchor="start" fill="#e9f5fb" font-weight="700">One process, several views</text>
