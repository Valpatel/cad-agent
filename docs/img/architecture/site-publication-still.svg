<svg xmlns="http://www.w3.org/2000/svg" width="480" height="430" viewBox="0 0 480 430" role="img" aria-labelledby="title desc"><title id="title">Source becomes a website</title><desc id="desc">Conceptual illustration, not measured simulation. The generated site is an output, not the library owner. Owned sources: Guides, assets, metadata. Source: docs/pages.yaml. Site compiler: Select, link, render. Source: tools/site/build-site.mjs. Generated dist/: Pages and copied toolkit. Source: tools/site/compiler/README.md. Publish main: Cloudflare serves the build. Source: .github/CONTRIBUTING.md</desc>
<style>text{font-family:system-ui,sans-serif}.flow,.return{stroke-dasharray:6 8}</style>
<defs><marker id="amber-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc579"/></marker><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3de0d4"/></marker></defs>
<rect width="480" height="430" rx="18" fill="#091a29"/>
<text x="24" y="34" font-size="22" text-anchor="start" fill="#e9f5fb" font-weight="700">Source becomes a website</text>
<text x="24" y="65" font-size="16" text-anchor="start" fill="#b7d1de" font-weight="400">Source owners stay outside generated dist/.</text><path d="M56 87H91L104 100V137H56Z" fill="#132f43" stroke="#ffc579"/><path d="M91 87V100H104M67 110H93M67 122H87" fill="none" stroke="#ffc579" stroke-width="2" class=""/><text x="80" y="161" font-size="16" text-anchor="middle" fill="#e9f5fb" font-weight="400">Guides</text><path d="M80 172V193" fill="none" stroke="#3de0d4" stroke-width="2" class="flow" marker-end="url(#arrow)"/><path d="M216 87H251L264 100V137H216Z" fill="#132f43" stroke="#bdacff"/><path d="M251 87V100H264M227 110H253M227 122H247" fill="none" stroke="#bdacff" stroke-width="2" class=""/><text x="240" y="161" font-size="16" text-anchor="middle" fill="#e9f5fb" font-weight="400">Assets</text><path d="M240 172V193" fill="none" stroke="#3de0d4" stroke-width="2" class="flow" marker-end="url(#arrow)"/><path d="M376 87H411L424 100V137H376Z" fill="#132f43" stroke="#3de0d4"/><path d="M411 87V100H424M387 110H413M387 122H407" fill="none" stroke="#3de0d4" stroke-width="2" class=""/><text x="400" y="161" font-size="16" text-anchor="middle" fill="#e9f5fb" font-weight="400">Metadata</text><path d="M400 172V193" fill="none" stroke="#3de0d4" stroke-width="2" class="flow" marker-end="url(#arrow)"/><path d="M40 199H440L300 270H180Z" fill="#162d40" stroke="#4e8499" stroke-width="2"/><path d="M117 238H363" fill="none" stroke="#bdacff" stroke-width="2" class="scan"/><text x="240" y="225" font-size="16" text-anchor="middle" fill="#e9f5fb" font-weight="600">Site compiler</text><text x="240" y="253" font-size="15" text-anchor="middle" fill="#e9f5fb" font-weight="400">Select · link · render</text><path d="M240 273V294H119V311" fill="none" stroke="#3de0d4" stroke-width="2" class="flow" marker-end="url(#arrow)"/><rect x="53" y="315" width="128" height="60" rx="4" fill="#132f43" stroke="#4e8499"/><rect x="63" y="324" width="128" height="60" rx="4" fill="#132f43" stroke="#4e8499"/><text x="127" y="352" font-size="16" text-anchor="middle" fill="#e9f5fb" font-weight="600">dist/</text><text x="127" y="373" font-size="15" text-anchor="middle" fill="#e9f5fb" font-weight="400">Build output</text><path d="M198 352H294" fill="none" stroke="#3de0d4" stroke-width="2" class="flow" marker-end="url(#arrow)"/><path d="M317 367C282 365 283 325 312 324C309 292 360 287 372 313C411 295 439 325 425 347C451 372 408 385 389 371H317Z" fill="#103c42" stroke="#3de0d4"/><text x="363" y="341" font-size="16" text-anchor="middle" fill="#e9f5fb" font-weight="600">Website</text><text x="363" y="361" font-size="15" text-anchor="middle" fill="#e9f5fb" font-weight="400">Cloudflare</text><text x="24" y="411" font-size="15" text-anchor="start" fill="#b7d1de" font-weight="400">Released main is built and served to readers.</text>
