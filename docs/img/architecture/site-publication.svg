<svg xmlns="http://www.w3.org/2000/svg" width="480" height="350" viewBox="0 0 480 350" role="img" aria-labelledby="title desc"><title id="title">Source becomes a website</title><desc id="desc">Conceptual handoffs, not measured simulation. 1. Owned sources: Guides, assets, metadata. Source: docs/pages.yaml. 2. Site compiler: Select, link, render. Source: tools/site/build-site.mjs. 3. Generated dist/: Pages and copied toolkit. Source: tools/site/compiler/README.md. 4. Publish main: Cloudflare serves the build. Source: .github/CONTRIBUTING.md</desc>
