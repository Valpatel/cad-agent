<svg xmlns="http://www.w3.org/2000/svg" width="480" height="430" viewBox="0 0 480 430" role="img" aria-labelledby="title desc"><title id="title">From a project to review</title><desc id="desc">Conceptual illustration, not measured simulation. Workflows connect tools and reusable presentation. Project inputs: Models and assumptions. Source: software/cadagent/project.py. Domain methods: Calculate, build, check. Source: software/cadagent/README.md. Result artifacts: Values, files, evidence. Source: software/cadagent/publish/README.md. Human review: View, inspect, decide. Source: software/cadagent/webkit/README.md</desc>
<style>text{font-family:system-ui,sans-serif}.flow,.return{stroke-dasharray:6 8}.flow{animation:flow 2.8s linear infinite}.return{animation:flow 4s linear infinite}.gear{animation:turn 20s linear infinite}.scan{animation:scan 3s ease-in-out infinite alternate}.check,.level{animation:readout 2s ease-in-out infinite alternate}.sweep{animation:sweep 4s ease-in-out infinite alternate}@keyframes sweep{from{transform:translateX(-90px)}to{transform:translateX(90px)}}@keyframes flow{to{stroke-dashoffset:-28}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes scan{to{opacity:.25}}@keyframes readout{to{opacity:.5}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
