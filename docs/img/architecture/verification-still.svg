<svg xmlns="http://www.w3.org/2000/svg" width="480" height="430" viewBox="0 0 480 430" role="img" aria-labelledby="title desc"><title id="title">What a check establishes</title><desc id="desc">Conceptual illustration, not measured simulation. A passing test is evidence within its stated scope. Known inputs: Fixtures and assumptions. Source: tests/fixtures/README.md. Execute the subject: CLI, model or browser. Source: tests/README.md. Compare results: References and failures. Source: tests/repo/README.md. Keep the evidence: Source, result and limits. Source: docs/validation/README.md</desc>
<style>text{font-family:system-ui,sans-serif}.flow,.return{stroke-dasharray:6 8}</style>
<defs><marker id="amber-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc579"/></marker><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3de0d4"/></marker></defs>
<rect width="480" height="430" rx="18" fill="#091a29"/>
<text x="24" y="34" font-size="22" text-anchor="start" fill="#e9f5fb" font-weight="700">What a check establishes</text>
<text x="24" y="65" font-size="16" text-anchor="start" fill="#b7d1de" font-weight="400">Compare results with a known reference.</text><rect x="24" y="89" width="276" height="211" rx="10" fill="#132f43" stroke="#4e8499"/><text x="43" y="116" font-size="16" text-anchor="start" fill="#e9f5fb" font-weight="600">Fixture → subject</text><path d="M45 252V140M45 252H280" fill="none" stroke="#4e8499" stroke-width="2" class=""/><path d="M45 162H280" fill="none" stroke="#24485b" stroke-width="1" class=""/><path d="M45 192H280" fill="none" stroke="#24485b" stroke-width="1" class=""/><path d="M45 222H280" fill="none" stroke="#24485b" stroke-width="1" class=""/><path d="M48 239C84 239 79 163 116 174S151 235 184 191S239 152 277 153" fill="none" stroke="#3de0d4" stroke-width="3" class=""/><path d="M48 241C84 237 81 169 117 179S152 239 185 196S239 156 277 158" fill="none" stroke="#bdacff" stroke-width="2" class=""/><path d="M174 140V251" fill="none" stroke="#ffc579" stroke-width="2" class="sweep"/><path d="M43 277H65" fill="none" stroke="#3de0d4" stroke-width="2" class=""/><text x="72" y="282" font-size="14" text-anchor="start" fill="#e9f5fb" font-weight="400">Reference</text><path d="M179 277H201" fill="none" stroke="#bdacff" stroke-width="2" class=""/><text x="208" y="282" font-size="14" text-anchor="start" fill="#e9f5fb" font-weight="400">Result</text><path d="M306 187H331" fill="none" stroke="#3de0d4" stroke-width="2" class="flow" marker-end="url(#arrow)"/><circle cx="388" cy="184" r="48" fill="#162d40" stroke="#bdacff" stroke-width="3"/><text x="388" y="183" font-size="32" text-anchor="middle" fill="#bdacff" font-weight="400">Δ</text><text x="388" y="208" font-size="15" text-anchor="middle" fill="#e9f5fb" font-weight="400">Compare</text><text x="388" y="255" font-size="16" text-anchor="middle" fill="#e9f5fb" font-weight="400">Pass / fail</text><path d="M388 266V324H240V338" fill="none" stroke="#3de0d4" stroke-width="2" class="flow" marker-end="url(#arrow)"/><rect x="24" y="343"