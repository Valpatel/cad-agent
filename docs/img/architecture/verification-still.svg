<svg xmlns="http://www.w3.org/2000/svg" width="480" height="350" viewBox="0 0 480 350" role="img" aria-labelledby="title desc"><title id="title">What a check establishes</title><desc id="desc">Conceptual handoffs, not measured simulation. 1. Known inputs: Fixtures and assumptions. Source: tests/fixtures/README.md. 2. Execute the subject: CLI, model or browser. Source: tests/README.md. 3. Compare results: References and failures. Source: tests/repo/README.md. 4. Keep the evidence: Source, result and limits. Source: docs/validation/README.md</desc>
