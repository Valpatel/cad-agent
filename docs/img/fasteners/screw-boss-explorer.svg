<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Screw-boss explorer: a DELTA PT 30 screw (3 mm) in a 6 mm boss of Bambu PLA Basic, printed upright, 6 mm of thread, tightened to 0.30 N·m: clamp 22 to 374 N (the low end if the drive torque, which makes no clamp, is the most the window allows); the thread strips at 767 N, at 0.62 N·m to 1.74 N·m over the drive torque, so tighten to at most 0.31 N·m and only if the measured drive torque is below 0.25 N·m; hoop stress 2.95 MPa, 8 % of the strength. A pass: inside the guide and the torque window. A starting point to test, not a rating."><title>Screw-boss explorer: a DELTA PT 30 screw (3 mm) in a 6 mm boss of Bambu PLA Basic, printed upright, 6 mm of thread, tightened to 0.30 N·m: clamp 22 to 374 N (the low end if the drive torque, which makes no clamp, is the most the window allows); the thread strips at 767 N, at 0.62 N·m to 1.74 N·m over the drive torque, so tighten to at most 0.31 N·m and only if the measured drive torque is below 0.25 N·m; hoop stress 2.95 MPa, 8 % of the strength. A pass: inside the guide and the torque window. A starting point to test, not a rating.</title><rect width="640" height="300" fill="#fffdf5"/><defs><linearGradient id="pb-still-hoop" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#eff0e3"/><stop offset="0.03" stop-color="#eff0e3"/><stop offset="0.06" stop-color="#eff0e3"/><stop offset="0.09" stop-color="#eff0e3"/><stop offset="0.13" stop-color="#eff0e2"/><stop offset="0.16" stop-color="#eff0e2"/><stop offset="0.19" stop-color="#eff0e2"/><stop offset="0.22" stop-color="#f0efe2"/><stop offset="0.25" stop-color="#f0efe1"/><stop offset="0.78" stop-color="#f0efe2"/><stop offset="0.81" stop-color="#eff0e2"/><stop offset="0.84" stop-color="#eff0e2"/><stop offset="0.88" stop-color="#eff0e2"/><stop offset="0.91" stop-color="#eff0e3"/><stop offset="0.94" stop-color="#eff0e3"/><stop offset="0.97" stop-color="#eff0e3"/><stop offset