<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1590" width="720" height="1590" role="img" aria-labelledby="title desc"><title id="title">From shared evidence to better hardware</title><desc id="desc">Examples and manufacturer guides enter a messy knowledge graph, become organized topics and cited rules, then inform design, checks, simulation and printing. Results return through human-reviewed contributions. Conceptual process illustration, not a hardware simulation or automatic model training.</desc><defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#233549" stroke-width="1"/></pattern><linearGradient id="panel" x2="0.6" y2="1"><stop stop-color="#142439"/><stop offset="1" stop-color="#0b1625"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#79e5d0"/></marker></defs><style>text{font-family:Inter,system-ui,sans-serif;fill:#edf4f8}.muted{fill:#a9bbcd}.cyan{fill:#79e5d0}.amber{fill:#ffcb83}.mono{font-family:ui-monospace,monospace}.wire{fill:none;stroke:#79e5d0;stroke-width:2;stroke-dasharray:5 9;animation:flow 4s linear infinite}.node{fill:#0c2634;stroke:#79e5d0;stroke-width:2}.pulse{animation:pulse 6s ease-in-out infinite}.trace{fill:none;stroke:#79e5d0;stroke-width:3;stroke-dasharray:900;animation:trace 9s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-140}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes trace{0%{stroke-dashoffset:900}55%,100%{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.trace{stroke-dashoffset:0}.pulse{opacity:1}}</style><rect width="100%" height="100%" rx="28" fill="#091422"/><rect width="100%" height="100%" rx="28" fill="url(#grid)" opacity=".6"/><text x="38" y="58" font-size="22" class="cyan mono" text-anchor="start">YOUR NEED. SHARED KNOWLEDGE. BETTER HARDWARE.</text><text x="38" y="100" font-size="32" class="" text-anchor="start">Anyone. Any useful thing.</text><g transform="translate(28 150)"><rect width="664" height="420" rx="20" fill="url(#panel)" stroke="#314459"/><text x="24" y="40" font-size="19" class="amber mono" text-anchor="start">01</text><text x="68" y="40" font-size="23" class="" text-anchor="start">START WITH A NEED</text><text x="24" y="77" font-size="20" class="muted" text-anchor="start">Learn from examples and original guides.</text><g transform="translate(28 108)"><path d="M0 0H188L220 30V120H0Z" fill="#1e3046" stroke="#738ba4"/><path d="M188 0V30H220" fill="none" stroke="#738ba4"/><text x="16" y="31" font-size="16" class="cyan mono" text-anchor="start">YOUR NEED</text><text x="16" y="65" font-size="23" class="" text-anchor="start">A useful thing</text><text x="16" y="93" font-size="14" class="muted" text-anchor="start">A person sets the requirements</text></g><g transform="translate(28 250)"><path d="M0 0H188L220 30V120H0Z" fill="#1e3046" stroke="#738ba4"/><path d="M188 0V30H220" fill="none" stroke="#738ba4"/><text x="16" y="31" font-size="16" class="cyan mono" text-anchor="start">MANUFACTURER GUIDE</text><text x="16" y="65" font-size="23" class="" text-anchor="start">PEM · Covestro</text><text x="16" y="93" font-size="14" class="muted" text-anchor="start">Source, edition, limits</text></g><text x="28" y="396" font-size="17" class="muted" text-anchor="start">Real examples + checks guide the AI.</text><g transform="translate(346 110)"><circle cx="14" cy="0" r="13" fill="none" stroke="#edf4f8" stroke-width="3"/><path d="M-6 52V32q20-30 40 0v20M-6 35l-12 22M34 35l12 22" fill="none" stroke="#edf4f8" stroke-width="3"/></g><circle cx="360" cy="200" r="4" fill="#ffcb83" class="pulse" style="animation-delay:0.0s"/><circle cx="360" cy="225" r="5" fill="#ffcb83" class="pulse" style="animation-delay:0.4s"/><circle cx="360" cy="250" r="6" fill="#ffcb83" class="pulse" style="animation-delay:0.8s"/><circle cx="360" cy="275" r="4" fill="#ffcb83" class="pulse" style="animation-delay:1.2000000000000002s"/><circle cx="360" cy="300" r="5" fill="#ffcb83" class="pulse" style="animation-delay:1.6s"/><circle cx="360" cy="325" r="6" fill="#ffcb83" class="pulse" style="animation-delay:2.0s"/><circle cx="360" cy="350" r="4" fill="#ffcb83" class="pulse" style="animation-delay:2.4000000000000004s"/><path class="wire" d="M256 200H644"/></g><g transform="translate(28 610)"><rect width="664" height="420" rx="20" fill="url(#panel)" stroke="#314459"/><text x="24" y="40" font-size="19" class="amber mono" text-anchor="start">02</text><text x="68" y="40" font-size="23" class="" text-anchor="start">ORGANIZE</text><text x="24" y="77" font-size="20" class="muted" text-anchor="start">Topics. Provenance. Cited rules.</text><path d="M32 145L174 166" stroke="#62768e" stroke-width="1" opacity=".55"/><path d="M32 145L48 238" stroke="#62768e" stroke-width="1" opacity=".55"/><path d="M105 111L48 238" stroke="#62768e" stroke-width="1" opacity=".55"/><path d="M105 111L144 265" stroke="#62768e" stroke-width="1" opacity=".55"/><path d="M174 166L144 265" stroke="#62768e" stroke-width="1" opacity=".55"/><path d="M174 166L82 340" stroke="#62768e" stroke-width="1" opacity=".55"/><path d="M48 238L82 340" stroke="#62768e" stroke-width="1" opacity=".55"/><path d="M48 238L201 332" stroke="#62768e" stroke-width="1" opacity=".55"/><path d="M144 265L201 332" stroke="#62768e" stroke-width="1" opacity=".55"/><path d="M144 265L220 210" stroke="#62768e" stroke-width="1" opacity=".55"/><path d="M82 340L220 210" stroke="#62768e" stroke-width="1" opacity=".55"/><path d="M82 340L32 145" stroke="#62768e" stroke-width="1" opacity=".55"/><path d="M201 332L32 145" stroke="#62768e" stroke-width="1" opacity=".55"/><path d="M201 332L105 111" stroke="#62768e" stroke-width="1" opacity=".55"/><path d="M220 210L105 111" stroke="#62768e" stroke-width="1" opacity=".55"/><path d="M220 210L174 166" stroke="#62768e" stroke-width="1" opacity=".55"/><circle cx="32" cy="145" r="5" fill="#ffcb83" opacity=".8"/><circle cx="105" cy="111" r="6" fill="#ffcb83" opacity=".8"/><circle cx="174" cy="166" r="7" fill="#ffcb83" opacity=".8"/><circle cx="48" cy="238" r="5" fill="#ffcb83" opacity=".8"/><circle cx="144" cy="265" r="6" fill="#ffcb83" opacity=".8"/><circle cx="82" cy="340" r="7" fill="#ffcb83" opacity=".8"/><circle cx="201" cy="332" r="5" fill="#ffcb83" opacity=".8"/><circle cx="220" cy="210" r="6" fill="#ffcb83" opacity=".8"/><path class="trace" d="M330 130V320M330 180h-35v60M330 180h45v60M330 280h45v60"/><rect class="node" x="318" y="118" width="24" height="24" rx="5"/><rect class="node" x="283" y="228" width="24" height="24" rx="5"/><rect class="node" x="363" y="228" width="24" height="24" rx="5"/><rect class="node" x="363" y="328" width="24" height="24" rx="5"/><text x="415" y="150" font-size="21" class="cyan" text-anchor="start">TOPIC TREE</text><text x="415" y="210" font-size="21" class="" text-anchor="start">Source-linked</text><text x="415" y="245" font-size="21" class="" text-anchor="start">Material limits</text><text x="415" y="280" font-size="21" class="" text-anchor="start">Worked examples</text><text x="415" y="315" font-size="21" class="" text-anchor="start">Rule + test</text></g><g transform="translate(28 1070)"><rect width="664" height="420" rx="20" fill="url(#panel)" stroke="#314459"/><text x="24" y="40" font-size="19" class="amber mono" text-anchor="start">03</text><text x="68" y="40" font-size="23" class="" text-anchor="start">BUILD + LEARN</text><text x="24" y="77" font-size="20" class="muted" text-anchor="start">Design → check → make → report.</text><g transform="translate(32 112)"><rect width="276" height="96" rx="12" fill="#172d3e" stroke="#496479"/><text x="14" y="34" font-size="20" class="cyan mono" text-anchor="start">DESIGN</text><text x="14" y="65" font-size="16" class="muted" text-anchor="start">real CAD</text></g><g transform="translate(332 112)"><rect width="276" height="96" rx="12" fill="#172d3e" stroke="#496479"/><text x="14" y="34" font-size="20" class="cyan mono" text-anchor="start">CHECK</text><text x="14" y="65" font-size="16" class="muted" text-anchor="start">fit + access</text></g><g transform="translate(32 232)"><rect width="276" height="96" rx="12" fill="#172d3e" stroke="#496479"/><text x="14" y="34" font-size="20" class="cyan mono" text-anchor="start">SIMULATE</text><text x="14" y="65" font-size="16" class="muted" text-anchor="start">stated assumptions</text></g><g transform="translate(332 232)"><rect width="276" height="96" rx="12" fill="#172d3e" stroke="#496479"/><text x="14" y="34" font-size="20" class="cyan mono" text-anchor="start">MAKE</text><text x="14" y="65" font-size="16" class="muted" text-anchor="start">reviewed release</text></g><text x="26" y="395" font-size="16" class="amber" text-anchor="start">Useful objects. Honest feedback. Better next time.</text></g><path class="wire" d="M360 574v28" marker-end="url(#arrow)"/><path class="wire" d="M360 1034v28" marker-end="url(#arrow)"/><text x="360" y="1540" font-size="21" class="cyan" text-anchor="middle">Human-reviewed feedback → the next design</text></svg>
