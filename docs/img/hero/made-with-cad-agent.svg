<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 496 112" width="248" height="56" role="img" aria-label="Made with cad-agent" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Made with cad-agent</title><desc>Valpatel's violet crystal and blue V, redrawn as vectors inside a small titanium instrument panel. Circuit signals, a segmented orbital ring and a slow light sweep surround permanently readable lettering. Reusable project attribution, not a certification. Generated by tools/anim/made_with_badge.py.</desc><style>svg{--bg:#fffdf5;--panel:#f4f1e6;--ink:#173d3c;--muted:#526863;--line:#d8e0d3;--edge:#173d3c;--fill:#fffdf5;--accent:#bd3a12;--good:#2f7d5b;--soft:#ffe1cc;--link:#e7a93a;--metal:#c7cdc8;--dark:#3a4744;--trace:#2b7bb9}@media (prefers-color-scheme:dark){svg{--bg:#0f1716;--panel:#16211f;--ink:#e8efe9;--muted:#9db0aa;--line:#2a3a37;--edge:#d5e2dc;--fill:#13201e;--accent:#ff7a45;--good:#5cc8a0;--soft:#4a2a1c;--link:#f2b84e;--metal:#4c5a57;--dark:#26302e;--trace:#6cb4ff}}
