<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960" width="640" height="480" role="img" aria-label="Sources, evaluate, methods, regress" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Sources, evaluate, methods, regress</title><desc>Read and cite research; evaluate examples and controls; encode reusable methods in code and skills; keep failed cases in tests and lessons. Repeat.</desc><style>svg{--bg:#fffdf5;--panel:#f4f1e6;--ink:#173d3c;--muted:#526863;--line:#d8e0d3;--edge:#173d3c;--fill:#fffdf5;--accent:#bd3a12;--good:#2f7d5b;--soft:#ffe1cc;--link:#e7a93a;--metal:#c7cdc8;--dark:#3a4744;--trace:#2b7bb9}@media (prefers-color-scheme:dark){svg{--bg:#0f1716;--panel:#16211f;--ink:#e8efe9;--muted:#9db0aa;--line:#2a3a37;--edge:#d5e2dc;--fill:#13201e;--accent:#ff7a45;--good:#5cc8a0;--soft:#4a2a1c;--link:#f2b84e;--metal:#4c5a57;--dark:#26302e;--trace:#6cb4ff}}.title{font-size:43px;font-weight:720;fill:var(--ink)}
.intro,.limit{font-size:26px;fill:var(--muted)}
.card{fill:var(--panel);stroke:var(--line);stroke-width:2}
.badge{fill:var(--ink)}.number{font-size:29px;fill:var(--bg);font-weight:700}
.step{font-size:43px;font-weight:700;fill:var(--ink)}
.folder{font-size:33px;font-weight:600;fill:var(--ink)}
.meaning{font-size:30px;fill:var(--muted)}
.route,.arrows{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.packet{fill:var(--accent);opacity:0}.p0{animation:pulse 8s linear infinite}.p1{animation:pulse 8s 2s linear infinite}.p2{animation:pulse 8s 4s linear infinite}.p3{animation:pulse 8s 6s linear infinite}
@keyframes pulse{0%,21%{opacity:1}26%,100%{opacity:0}}
@media(max-width:400px){.intro,.meaning,.limit{display:none}.title{font-size:44px}.step{font-size:46px}.folder{font-size:40px}.card{stroke-width:3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1280" height="960" rx="24" style="fill:var(--bg)"/><text x="64" y="75" class="title">Every finding has a next step.</text><text x="64" y="123" class="intro">Evidence in. Reusable engineering out.</text><path d="M608 330H672M936 470V560M672 700H608M344 560V470" class="route"/><path d="m650 318 22 12-22 12m274 196 12 22 12-22m-318 162-22 12 22 12m-298-144 12-22 12 22" class="arrows"/><g transform="translate(64 190)"><rect width="544" height="280" rx="28" class="card"/><circle cx="55" cy="59" r="26" class="badge"/><text x="55" y="70" text-anchor="middle" class="number">1</text><text x="102" y="74" class="step">Sources</text><text x="36" y="151" class="folder">docs/research/</text><text x="36" y="219" class="meaning">read + cite</text></g><g transform="translate(672 190)"><rect width="544" height="280" rx="28" class="card"/><circle cx="55" cy="59" r="26" class="badge"/><text x="55" y="70" text-anchor="middle" class="number">2</text><text x="102" y="74" class="step">Evaluate</text><text x="36" y="151" class="folder">tests/</text><text x="36" y="219" class="meaning">examples + controls</text></g><g transform="translate(672 560)"><rect width="544" height="280" rx="28" class="card"/><circle cx="55" cy="59" r="26" class="badge"/><text x="55" y="70" text-anchor="middle" class="number">3</text><text x="102" y="74" class="step">Methods</text><text x="36" y="151" class="folder">src/ + skills/</text><text x="36" y="219" class="meaning">encode + explain</text></g><g transform="translate(64 560)"><rect width="544" height="280" rx="28" class="card"/><circle cx="55" cy="59" r="26" class="badge"/><text x="55" y="70" text-anchor="middle" class="number">4</text><text x="102" y="74" class="step">Regress</text><text x="36" y="151" class="folder">tests/ + docs/lessons/</text><text x="36" y="219" class="meaning">keep the failed case</text></g><circle cx="640" cy="330" r="9" class="packet p0"/><circle cx="936" cy="515" r="9" class="packet p1"/><circle cx="640" cy="700" r="9" class="packet p2"/><circle cx="344" cy="515" r="9" class="packet p3"/><text x="64" y="906" class="limit">A model checks assumptions. A physical test checks the part.</text></svg>
