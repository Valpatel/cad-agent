<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="640" height="240" role="img" aria-label="A learning workshop: Study, Try, Test, Review, Learn" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>A learning workshop: Study, Try, Test, Review, Learn</title><desc>Conceptual pixel-art workshop. Study credited sources, try a method, distinguish virtual checks from real measurements, review the evidence, and preserve reusable skills. The loop is a method, not a claim of physical qualification.</desc><style>svg{--bg:#fffdf5;--panel:#f4f1e6;--ink:#173d3c;--muted:#526863;--line:#d8e0d3;--edge:#173d3c;--fill:#fffdf5;--accent:#bd3a12;--good:#2f7d5b;--soft:#ffe1cc;--link:#e7a93a;--metal:#c7cdc8;--dark:#3a4744;--trace:#2b7bb9}@media (prefers-color-scheme:dark){svg{--bg:#0f1716;--panel:#16211f;--ink:#e8efe9;--muted:#9db0aa;--line:#2a3a37;--edge:#d5e2dc;--fill:#13201e;--accent:#ff7a45;--good:#5cc8a0;--soft:#4a2a1c;--link:#f2b84e;--metal:#4c5a57;--dark:#26302e;--trace:#6cb4ff}}.heading{font-size:32px;font-weight:650;fill:#f4d6a0;letter-spacing:1px}
.step{font-size:38px;font-weight:650;fill:#e4e7dc}
.note{animation:carry 18s linear infinite}
.lamplight{animation:warm 18s ease-in-out infinite}
