<rect width="680" height="352" rx="14" fill="#fffdf5" stroke="#d8e0d3" />
<text x="20" y="28" font-size="15" font-weight="700">A rigid module: its bench sequence first, then one parent step</text>
<text x="20" y="46" class="m11">the tests/review/test_gate_subassembly.py fixture through the assembly gate's own core (run_sequence)</text>
