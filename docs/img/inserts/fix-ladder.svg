<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 844" width="900" height="422" role="img" aria-label="The fix ladder in order, larger head, washer, large washer, limiter, each re-checked: on the issue's M3 lid the ISO 7089 washers lift the preload cap from 329 N to 774 N at 0.30 N·m and the catalogue limiters fail their own rows; on an M5 under a 3.8 mm PETG lid a proud limiter passes and is the lasting fix" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>The fix ladder in order, larger head, washer, large washer, limiter, each re-checked: on the issue's M3 lid the ISO 7089 washers lift the preload cap from 329 N to 774 N at 0.30 N·m and the catalogue limiters fail their own rows; on an M5 under a 3.8 mm PETG lid a proud limiter passes and is the lasting fix</title><desc>The fix ladder in order, larger head, washer, large washer, limiter, each re-checked: on the issue's M3 lid the ISO 7089 washers lift the preload cap from 329 N to 774 N at 0.30 N·m and the catalogue limiters fail their own rows; on an M5 under a 3.8 mm PETG lid a proud limiter passes and is the lasting fix</desc><style>svg{--bg:#fffdf5;--panel:#f4f1e6;--ink:#173d3c;--muted:#526863;--line:#d8e0d3;--edge:#173d3c;--fill:#fffdf5;--accent:#bd3a12;--good:#2f7d5b;--soft:#ffe1cc;--link:#e7a93a;--metal:#c7cdc8;--dark:#3a4744;--trace:#2b7bb9;--brass:#d3a93f;--brassedge:#7a5a12;--plastic:#e9e3cf;--layer:#cfc6a8;--melt:#f2c9a8}@media (prefers-color-scheme:dark){svg{--bg:#0f1716;--panel:#16211f;--ink:#e8efe9;--muted:#9db0aa;--line:#2a3a37;--edge:#d5e2dc;--fill:#13201e;--accent:#ff7a45;--good:#5cc8a0;--soft:#4a2a1c;--link:#f2b84e;--metal:#4c5a57;--dark:#26302e;--trace:#6cb4ff;--brass:#b08a2a;--brassedge:#f0cf7a;--plastic:#2a3330;--layer:#3c4743;--melt:#5a3a28}}text{fill:var(--ink);font-size:26px}.small{font-size:22px;fill:var(--muted)}.big{font-size:30px;font-weight:600}.dim{stroke:var(--muted);stroke-width:2;fill:none}.edge{stroke:var(--edge);stroke-width:2.4;stroke-linejoin:round}.plastic{fill:var(--plastic)}.layer{stroke:var(--layer);stroke-width:2}.brass{fill:var(--brass);stroke:var(--brassedge);stroke-width:2}.metal{fill:var(--metal);stroke:var(--edge);stroke-width:2}.screw{fill:var(--dark);stroke:var(--edge);stroke-width:2}.good{stroke:var(--good);fill:var(--good)}.bad{stroke:var(--accent);fill:var(--accent)}.arrow{stroke-width:4.8;stroke-linecap:round}.hole{fill:var(--bg)}.melt{fill:var(--melt)}.axis{stroke:var(--muted);stroke-width:2;stroke-dasharray:12 8}.grid{stroke:var(--line);stroke-width:2}.base{fill:var(--muted)}</style><rect width="1800" height="844" rx="24" style="fill:var(--bg)"/><text x="40" y="68" class="big">M3 insert, 3 mm PLA lid (the issue)</text><text x="480" y="128.2" class="small" text-anchor="end">as it is</text><rect x="500" y="104" width="146.6" height="36" class="base"/><text x="662.6" y="128.2" class="small">329 N, 0.20 N·m</text><text x="480" y="180.2" class="small" text-anchor="end">larger head</text><text x="508" y="180.2" class="small">no listed M3 head bears wider than 5.07 mm</text><text x="480" y="232.2" class="small" text-anchor="end">washer</text><rect x="500" y="208" width="345.5" height="36" class="good"/><text x="861.5" y="232.2" class="small">774 N, 0.30 N·m: the fix</text><text x="480" y="284.2" class="small" text-anchor="end">large washer</text><rect x="500" y="260" width="462.3" height="36" class="good"/><text x="978.3" y="284.2" class="small">1036 N, 0.40 N·m: named</text><text x="480" y="336.2" class="small" text-anchor="end">limiter (CL6000, 3 mm)</text><rect x="500" y="312" width="219.7" height="36" class="bad"/><text x="735.7" y="336.2" class="small">492 N, 0.19 N·m: 3 mm: fails seating force, press fit; 4 mm: fails press fit</text><text x="480" y="388.2" class="small" text-anchor="end">limiter (CL8000, 3 mm)</text><rect x="500" y="364" width="219.7" height="36" class="bad"/><text x="735.7" y="388.2" class="small">492 N, 0.19 N·m: 3 mm: fails seating force, press fit; 4 mm: fails press fit</text><text x="40" y="452" class="big">M5 insert, 3.8 mm PETG lid</text><text x="480" y="512.2" class="small" text-anchor="end">as it is</text><rect x="500" y="488" width="234.6" height="36" class="base"/><text x="750.6" y="512.2" class="small">526 N, 0.53 N·m</text><text x="480" y="564.2" class="small" text-anchor="end">larger head</text><rect x="500" y="540" width="234.6" height="36" class="bad"/><text x="750.6" y="564.2" class="small">526 N, 0.53 N·m: does not lift it: clamped on insert still sets 526 N</text><text x="480" y="616.2" class="small" text-anchor="end">washer</text><rect x="500" y="592" width="698.1" height="36" class="good"/><text x="1214.1" y="616.2" class="small">1564 N, 1.00 N·m: the fix</text><text x="480" y="668.2" class="small" text-anchor="end">large washer</text><rect x="500" y="644" width="857.1" height="36" class="good"/><text x="1373.1" y="668.2" class="small">1921 N, 1.23 N·m: named</text><text x="480" y="720.2" class="small" text-anchor="end">limiter (CL6000, 4 mm)</text><rect x="500" y="696" width="553.1" height="36" class="good"/><text x="1069.1" y="720.2" class="small">1240 N, 0.79 N·m: the lasting fix</text><text x="480" y="772.2" class="small" text-anchor="end">limiter (CL8000, 4 mm)</text><rect x="500" y="748" width="553.1" height="36" class="good"/><text x="1069.1" y="772.2" class="small">1240 N, 0.79 N·m: named</text><line x1="500" y1="80" x2="500" y2="776" class="grid"/><text x="500" y="820" class="small">allowed preload (bar) and the torque that gives it; green: named, red: not named</text></svg>
