<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 660" width="870" height="330" role="img" aria-label="A compression limiter proud, flush and short of the plastic it passes through: proud, the plastic is loose round it; flush, the clamp goes through the metal; short, the head squeezes the plastic a few per cent before it lands on the limiter (SPIROL: at most 5 %, which printed plastic may not take)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>A compression limiter proud, flush and short of the plastic it passes through: proud, the plastic is loose round it; flush, the clamp goes through the metal; short, the head squeezes the plastic a few per cent before it lands on the limiter (SPIROL: at most 5 %, which printed plastic may not take)</title><desc>A compression limiter proud, flush and short of the plastic it passes through: proud, the plastic is loose round it; flush, the clamp goes through the metal; short, the head squeezes the plastic a few per cent before it lands on the limiter (SPIROL: at most 5 %, which printed plastic may not take)</desc><style>svg{--bg:#fffdf5;--panel:#f4f1e6;--ink:#173d3c;--muted:#526863;--line:#d8e0d3;--edge:#173d3c;--fill:#fffdf5;--accent:#bd3a12;--good:#2f7d5b;--soft:#ffe1cc;--link:#e7a93a;--metal:#c7cdc8;--dark:#3a4744;--trace:#2b7bb9;--brass:#d3a93f;--brassedge:#7a5a12;--plastic:#e9e3cf;--layer:#cfc6a8;--melt:#f2c9a8}@media (prefers-color-scheme:dark){svg{--bg:#0f1716;--panel:#16211f;--ink:#e8efe9;--muted:#9db0aa;--line:#2a3a37;--edge:#d5e2dc;--fill:#13201e;--accent:#ff7a45;--good:#5cc8a0;--soft:#4a2a1c;--link:#f2b84e;--metal:#4c5a57;--dark:#26302e;--trace:#6cb4ff;--brass:#b08a2a;--brassedge:#f0cf7a;--plastic:#2a3330;--layer:#3c4743;--melt:#5a3a28}}text{fill:var(--ink);font-size:26px}.small{font-size:22px;fill:var(--muted)}.big{font-size:30px;font-weight:600}.dim{stroke:var(--muted);stroke-width:2;fill:none}.edge{stroke:var(--edge);stroke-width:2.4;stroke-linejoin:round}.plastic{fill:var(--plastic)}.layer{stroke:var(--layer);stroke-width:2}.brass{fill:var(--brass);stroke:var(--brassedge);stroke-width:2}.metal{fill:var(--metal);stroke:var(--edge);stroke-width:2}.screw{fill:var(--dark);stroke:var(--edge);stroke-width:2}.good{stroke:var(--good);fill:var(--good)}.bad{stroke:var(--accent);fill:var(--accent)}.arrow{stroke-width:4.8;stroke-linecap:round}.hole{fill:var(--bg)}.melt{fill:var(--melt)}.axis{stroke:var(--muted);stroke-width:2;stroke-dasharray:12 8}</style><rect width="1740" height="660" rx="24" style="fill:var(--bg)"/><text x="290" y="60" class="big" text-anchor="middle">Proud: +0.15 mm</text><text x="290" y="100" class="small" text-anchor="middle">clamp through the metal</text><text x="290" y="132" class="small" text-anchor="middle">the plastic loose round it</text><rect x="34" y="472" width="512" height="80" class="metal"/><rect x="34" y="280" width="512" height="192" class="plastic"/><rect x="194" y="251.2" width="192" height="220.8" class="metal"/><rect x="235.6" y="249.2" width="108.8" height="224.8" class="hole"/><rect x="146" y="219.2" width="288" height="32" class="metal"/><rect x="200.4" y="155.2" width="179.2" height="64" class="metal"/><rect x="245.2" y="219.2" width="89.6" height="332.8" class="metal"/><text x="290" y="596" class="small" text-anchor="middle">plastic 0.15 mm below the limiter</text><line x1="219.6" y1="257.6" x2="219.6" y2="462.4" class="good arrow"/><polygon points="219.6,462.4 213.5,449.8 225.7,449.8" class="good"/><text x="870" y="60" class="big" text-anchor="middle">Flush: +0.00 mm</text><text x="870" y="100" class="small" text-anchor="middle">clamp through the metal</text><text x="870" y="132" class="small" text-anchor="middle">the plastic just held</text><rect x="614" y="472" width="512" height="80" class="metal"/><rect x="614" y="280" width="512" height="192" class="plastic"/><rect x="774" y="280" width="192" height="192" class="metal"/><rect x="815.6" y="278" width="108.8" height="196" class="hole"/><rect x="726" y="248" width="288" height="32" class="metal"/><rect x="780.4" y="184" width="179.2" height="64" class="metal"/><rect x="825.2" y="248" width="89.6" height="304" class="metal"/><line x1="799.6" y1="286.4" x2="799.6" y2="462.4" class="good arrow"/><polygon points="799.6,462.4 793.5,449.8 805.7,449.8" class="good"/><text x="1450" y="60" class="big" text-anchor="middle">Short: -0.15 mm</text><text x="1450" y="100" class="small" text-anchor="middle">the head squeezes the plastic first</text><text x="1450" y="132" class="small" text-anchor="middle">a few % is the aim</text><rect x="1194" y="472" width="512" height="80" class="metal"/><rect x="1194" y="280" width="512" height="192" class="plastic"/><rect x="1354" y="308.8" width="192" height="163.2" class="metal"/><rect x="1395.6" y="278" width="108.8" height="196" class="hole"/><rect x="1306" y="248" width="288" height="32" class="metal"/><rect x="1360.4" y="184" width="179.2" height="64" class="metal"/><rect x="1405.2" y="248" width="89.6" height="304" class="metal"/><line x1="1328.4" y1="286.4" x2="1328.4" y2="462.4" class="bad arrow"/><polygon points="1328.4,462.4 1322.3,449.8 1334.5,449.8" class="bad"/><text x="1450" y="596" class="small" text-anchor="middle">limiter 0.15 mm short of the plastic</text></svg>
