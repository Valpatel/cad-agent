<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 772" width="960" height="386" role="img" aria-label="Section of a printed boss with a M3 heat-set insert (McMaster-Carr 94459A140): hole 4.20 mm, 6.7 mm deep, wall 2.7 mm" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Section of a printed boss with a M3 heat-set insert (McMaster-Carr 94459A140): hole 4.20 mm, 6.7 mm deep, wall 2.7 mm</title><desc>Section of a printed boss with a M3 heat-set insert (McMaster-Carr 94459A140): hole 4.20 mm, 6.7 mm deep, wall 2.7 mm. the maker's hole is 4 mm; a printed hole comes out about 0.25 mm small, so CAD takes 0.2 mm more (CNC Kitchen 2026: 0.2-0.3 mm for small inserts) straight, not tapered, and no chamfer (CNC Kitchen tips; SPIROL: a straight hole tapers at most 1 degree included) blind: 6.7 mm deep, the deepest of the makers' rules, so the melt the insert pushes down has somewhere to go</desc><style>svg{--bg:#fffdf5;--panel:#f4f1e6;--ink:#173d3c;--muted:#526863;--line:#d8e0d3;--edge:#173d3c;--fill:#fffdf5;--accent:#bd3a12;--good:#2f7d5b;--soft:#ffe1cc;--link:#e7a93a;--metal:#c7cdc8;--dark:#3a4744;--trace:#2b7bb9;--brass:#d3a93f;--brassedge:#7a5a12;--plastic:#e9e3cf;--layer:#cfc6a8;--melt:#f2c9a8}@media (prefers-color-scheme:dark){svg{--bg:#0f1716;--panel:#16211f;--ink:#e8efe9;--muted:#9db0aa;--line:#2a3a37;--edge:#d5e2dc;--fill:#13201e;--accent:#ff7a45;--good:#5cc8a0;--soft:#4a2a1c;--link:#f2b84e;--metal:#4c5a57;--dark:#26302e;--trace:#6cb4ff;--brass:#b08a2a;--brassedge:#f0cf7a;--plastic:#2a3330;--layer:#3c4743;--melt:#5a3a28}}text{fill:var(--ink);font-size:26px}.small{font-size:22px;fill:var(--muted)}.big{font-size:30px;font-weight:600}.dim{stroke:var(--muted);stroke-width:2;fill:none}.edge{stroke:var(--edge);stroke-width:2.4;stroke-linejoin:round}.plastic{fill:var(--plastic)}.layer{stroke:var(--layer);stroke-width:2}.brass{fill:var(--brass);stroke:var(--brassedge);stroke-width:2}.metal{fill:var(--metal);stroke:var(--edge);stroke-width:2}.screw{fill:var(--dark);stroke:var(--edge);stroke-width:2}.good{stroke:var(--good);fill:var(--good)}.bad{stroke:var(--accent);fill:var(--accent)}.arrow{stroke-width:4.8;stroke-linecap:round}.hole{fill:var(--bg)}.melt{fill:var(--melt)}.axis{stroke:var(--muted);stroke-width:2;stroke-dasharray:12 8}</style><rect width="1920" height="772" rx="24" style="fill:var(--bg)"/><rect x="296.8" y="120" width="566.4" height="552" class="plastic"/><line x1="296.8" y1="156" x2="863.2" y2="156" class="layer"/><line x1="296.8" y1="192" x2="863.2" y2="192" class="layer"/><line x1="296.8" y1="228" x2="863.2" y2="228" class="layer"/><line x1="296.8" y1="264" x2="863.2" y2="264" class="layer"/><line x1="296.8" y1="300" x2="863.2" y2="300" class="layer"/><line x1="296.8" y1="336" x2="863.2" y2="336" class="layer"/><line x1="296.8" y1="372" x2="863.2" y2="372" class="layer"/><line x1="296.8" y1="408" x2="863.2" y2="408" class="layer"/><line x1="296.8" y1="444" x2="863.2" y2="444" class="layer"/><line x1="296.8" y1="480" x2="863.2" y2="480" class="layer"/><line x1="296.8" y1="516" x2="863.2" y2="516" class="layer"/><line x1="296.8" y1="552" x2="863.2" y2="552" class="layer"/><line x1="296.8" y1="588" x2="863.2" y2="588" class="layer"/><line x1="296.8" y1="624" x2="863.2" y2="624" class="layer"/><line x1="296.8" y1="660" x2="863.2" y2="660" class="layer"/><polygon points="454,120 706,120 706,522 454,522" class="hole"/><polygon points="454,120 423.4,120 423.4,462 454,462" class="melt"/><polygon points="509.5,120 438.4,120 457.3,147 438.4,174 457.3,201 438.4,228 457.3,255 438.4,282 457.3,309 438.4,336 457.3,363 438.4,390 457.3,417 438.4,444 457.3,462 509.5,462" class="brass"/><polygon points="706,120 736.6,120 736.6,462 706,462" class="melt"/><polygon points="650.5,120 721.6,120 702.7,147 721.6,174 702.7,201 721.6,228 702.7,255 721.6,282 702.7,309 721.6,336 702.7,363 721.6,390 702.7,417 721.6,444 702.7,462 650.5,462" class="brass"/><polygon points="296.8,120 296.8,672 863.2,672 86