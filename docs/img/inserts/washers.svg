<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1140" width="900" height="570" role="img" aria-label="The issue's M3 lid in PLA with ISO 7089 washers under the head and between the lid and the insert: the lid bears on 19.8 mm² of washer instead of 8.4 mm² of the insert's ring, so its preload cap rises from 329 N to 774 N; the pressure is full over the ring and falls off over the washer's overhang, 0.70 of 0.96 mm of which bears" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>The issue's M3 lid in PLA with ISO 7089 washers under the head and between the lid and the insert: the lid bears on 19.8 mm² of washer instead of 8.4 mm² of the insert's ring, so its preload cap rises from 329 N to 774 N; the pressure is full over the ring and falls off over the washer's overhang, 0.70 of 0.96 mm of which bears</title><desc>The issue's M3 lid in PLA with ISO 7089 washers under the head and between the lid and the insert: the lid bears on 19.8 mm² of washer instead of 8.4 mm² of the insert's ring, so its preload cap rises from 329 N to 774 N; the pressure is full over the ring and falls off over the washer's overhang, 0.70 of 0.96 mm of which bears</desc><style>svg{--bg:#fffdf5;--panel:#f4f1e6;--ink:#173d3c;--muted:#526863;--line:#d8e0d3;--edge:#173d3c;--fill:#fffdf5;--accent:#bd3a12;--good:#2f7d5b;--soft:#ffe1cc;--link:#e7a93a;--metal:#c7cdc8;--dark:#3a4744;--trace:#2b7bb9;--brass:#d3a93f;--brassedge:#7a5a12;--plastic:#e9e3cf;--layer:#cfc6a8;--melt:#f2c9a8}@media (prefers-color-scheme:dark){svg{--bg:#0f1716;--panel:#16211f;--ink:#e8efe9;--muted:#9db0aa;--line:#2a3a37;--edge:#d5e2dc;--fill:#13201e;--accent:#ff7a45;--good:#5cc8a0;--soft:#4a2a1c;--link:#f2b84e;--metal:#4c5a57;--dark:#26302e;--trace:#6cb4ff;--brass:#b08a2a;--brassedge:#f0cf7a;--plastic:#2a3330;--layer:#3c4743;--melt:#5a3a28}}text{fill:var(--ink);font-size:26px}.small{font-size:22px;fill:var(--muted)}.big{font-size:30px;font-weight:600}.dim{stroke:var(--muted);stroke-width:2;fill:none}.edge{stroke:var(--edge);stroke-width:2.4;stroke-linejoin:round}.plastic{fill:var(--plastic)}.layer{stroke:var(--layer);stroke-width:2}.brass{fill:var(--brass);stroke:var(--brassedge);stroke-width:2}.metal{fill:var(--metal);stroke:var(--edge);stroke-width:2}.screw{fill:var(--dark);stroke:var(--edge);stroke-width:2}.good{stroke:var(--good);fill:var(--good)}.bad{stroke:var(--accent);fill:var(--accent)}.arrow{stroke-width:4.8;stroke-linecap:round}.hole{fill:var(--bg)}.melt{fill:var(--melt)}.axis{stroke:var(--muted);stroke-width:2;stroke-dasharray:12 8}</style><rect width="1800" height="1140" rx="24" style="fill:var(--bg)"/><rect x="220" y="474" width="480" height="342" class="plastic"/><polygon points="389.5,474 318.4,474 337.3,501 318.4,528 337.3,555 318.4,582 337.3,609 318.4,636 337.3,663 318.4,690 337.3,717 318.4,744 337.3,771 318.4,798 337.3,816 389.5,816" class="brass"/><rect x="180" y="267" width="178" height="180" class="plastic"/><rect x="260.8" y="240" width="97.2" height="27" class="metal"/><rect x="260.8" y="447" width="97.2" height="27" class="metal"/><polygon points="530.5,474 601.6,474 582.7,501 601.6,528 582.7,555 601.6,582 582.7,609 601.6,636 582.7,663 601.6,690 582.7,717 601.6,744 582.7,771 601.6,798 582.7,816 530.5,816" class="brass"/><rect x="562" y="267" width="178" height="180" class="plastic"/><rect x="562" y="240" width="97.2" height="27" class="metal"/><rect x="562" y="447" width="97.2" height="27" class="metal"/><rect x="289.6" y="60" width="340.8" height="180" class="screw"/><rect x="370" y="240" width="180" height="576" class="screw"/><line x1="460" y1="36" x2="460" y2="832" class="axis"/><text x="764" y="158" class="small">socket head (ISO 4762)</text><text x="764" y="248" class="small">ISO 7089 washer</text><text x="764" y="365" class="small">3 mm PLA lid</text><text x="764" y="463" class="small">ISO 7089 washer</text><text x="764" y="653" class="small">insert, flush</text><polygon points="562,1008 562,880 601.6,880 603.4,880 605.1,880.1 606.9,880.3 608.6,880.6 610.4,880.9 612.2,881.3 613.9,881.7 615.7,882.2 617.5,882.8 619.2,883.4 621,884 622.7,884.8 624.5,885.5 626.3,886.3 628,887.2 629.8,888.1 631.5,889 633.3,890 635.1,891 636.8,892 638.6,893.1 640.4,894.2 642.1,895.3 643.9,896.5 643.9,1008" class="good"/><line x1="643.9" y1="896.5" x2="645.8" y2="897.8" class="axis"/><line x1="645.8" y1="897.8" x2="647.7" y2="899.1" class="axis"/><line x1="647.7" y1="899.1" x2="649.6" y2="900.4" class="axis"/><line x1="649.6" y1="900.4" x2="651.5" y2="901.8" class="axis"/><line x1="651.5" y1="901.8" x2="653.5" y2="903.2" class="axis"/><line x1="653.5" y1="903.2" x2="655.4" y2="904.6" class="axis"/><line x1="655.4" y1="904.6" x2="657.3" y2="906" class="axis"/><line x1="657.3" y1="906" x2="659.2" y2="907.5" class="axis"/><line x1="562" y1="1008" x2="667.2" y2="1008" class="dim"/><line x1="601.6" y1="868" x2="601.6" y2="1020" class="dim"/><line x1="659.2" y1="988" x2="659.2" y2="1020" class="dim"/><text x="546" y="888" class="small" text-anchor="end">39 MPa allowed</text><text x="546" y="924" class="small" text-anchor="end">over the ring</text><text x="687.2" y="888" class="small">eases off over the overhang; the check counts it</text><text x="687.2" y="924" class="small">only to where the washer would bend past 320 MPa</text><text x="687.2" y="960" class="small">(dashed: the beam's pressure out to its edge)</text><text x="659.2" y="1052" class="small" text-anchor="middle">washer edge</text><text x="180" y="1108" class="small">the pressure the check counts on the lid's underside, to the section's radius scale</text><text x="1120" y="140" class="big">Bare lid on the insert's ring</text><text x="1120" y="184">8.4 mm²  →  329 N, 0.20 N·m</text><text x="1120" y="272" class="big">ISO 7089 washer between lid and insert</text><text x="1120" y="316">19.8 mm²  →  774 N, 0.30 N·m</text><text x="1120" y="360" class="small">0.70 of its 0.96 mm overhang bears:</text><text x="1120" y="398" class="small">past that it would bend over 320 MPa</text><text x="1120" y="436" class="small">the plastic spreads it over 1.70 mm (1 / β)</text><text x="1120" y="518" class="small">A head washer too: with the lid off the ring,</text><text x="1120" y="556" class="small">the head sets the next limit</text></svg>
