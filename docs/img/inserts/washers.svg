<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 940" width="900" height="470" role="img" aria-label="The issue's M3 lid in PLA with ISO 7089 washers under the head and between the lid and the insert: the lid bears on 19.8 mm² of washer instead of 8.4 mm² of the insert's ring, so its preload cap rises from 329 N to 774 N; the pressure is full over the ring and falls off over the washer's overhang, 0.70 of 0.96 mm of which bears" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>The issue's M3 lid in PLA with ISO 7089 washers under the head and between the lid and the insert: the lid bears on 19.8 mm² of washer instead of 8.4 mm² of the insert's ring, so its preload cap rises from 329 N to 774 N; the pressure is full over the ring and falls off over the washer's overhang, 0.70 of 0.96 mm of which bears</title><desc>The issue's M3 lid in PLA with ISO 7089 washers under the head and between the lid and the insert: the lid bears on 19.8 mm² of washer instead of 8.4 mm² of the insert's ring, so its preload cap rises from 329 N to 774 N; the pressure is full over the ring and falls off over the washer's overhang, 0.70 of 0.96 mm of which bears</desc><style>svg{--bg:#fffdf5;--panel:#f4f1e6;--ink:#173d3c;--muted:#526863;--line:#d8e0d3;--edge:#173d3c;--fill:#fffdf5;--accent:#bd3a12;--good:#2f7d5b;--soft:#ffe1cc;--link:#e7a93a;--metal:#c7cdc8;--dark:#3a4744;--trace:#2b7bb9;--brass:#d3a93f;--brassedge:#7a5a12;--plastic:#e9e3cf;--layer:#cfc6a8;--melt:#f2c9a8}@media (prefers-color-scheme:dark){svg{--bg:#0f1716;--panel:#16211f;--ink:#e8efe9;--muted:#9db0aa;--line:#2a3a37;--edge:#d5e2dc;--fill:#13201e;--accent:#ff7a45;--good:#5cc8a0;--soft:#4a2a1c;--link:#f2b84e;--metal:#4c5a57;--dark:#26302e;--trace:#6cb4ff;--brass:#b08a2a;--brassedge:#f0cf7a;--plastic:#2a3330;--layer:#3c4743;--melt:#5a3a28}}text{fill:var(--ink);font-size:26px}.small{font-size:22px;fill:var(--muted)}.big{font-size:30px;font-weight:600}.dim{stroke:var(--muted);stroke-width:2;fill:none}.edge{stroke:var(--edge);stroke-width:2.4;stroke-linejoin:round}.plastic{fill:var(--plastic)}.layer{stroke:var(--layer);stroke-width:2}.brass{fill:var(--brass);stroke:var(--brassedge);stroke-width:2}.metal{fill:var(--metal);stroke:var(--edge);stroke-width:2}.screw{fill:var(--dark);stroke:var(--edge);stroke-width:2}.good{stroke:var(--good);fill:var(--good)}.bad{stroke:var(--accent);fill:var(--accent)}.arrow{stroke-width:4.8;stroke-linecap:round}.hole{fill:var(--bg)}.melt{fill:var(--melt)}.axis{stroke:var(--muted);stroke-width:2;stroke-dasharray:12 8}</style><rect width="1800" height="940" rx="24" style="fill:var(--bg)"/><rect x="220" y="446" width="480" height="144" class="plastic"/><polygon points="389.5,446 318.4,446 337.3,473 318.4,500 337.3,527 318.4,554 337.3,581 318.4,590 389.5,590" class="brass"/><rect x="180" y="239" width="178" height="180" class="plastic"/><rect x="260.8" y="212" width="97.2" height="27" class="metal"/><rect x="260.8" y="419" width="97.2" height="27" class="metal"/><polygon points="530.5,446 601.6,446 582.7,473 601.6,500 582.7,527 601.6,554 582.7,581 601.6,590 530.5,590" class="brass"/><rect x="562" y="239" width="178" height="180" class="plastic"/><rect x="562" y="212" width="97.2" height="27" class="metal"/><rect x="562" y="419" width="97.2" height="27" class="metal"/><rect x="307.9" y="80" width="304.2" height="132" class="screw"/><rect x="370" y="212" width="180" height="378" class="screw"/><line x1="460" y1="56" x2="460" y2="606" class="axis"/><text x="764" y="154" class="small">socket head (ISO 4762)</text><text x="764" y="220" class="small">ISO 7089 washer</text><text x="764" y="337" class="small">3 mm PLA lid</text><text x="764" y="435" class="small">ISO 7089 washer</text><text x="764" y="526" class="small">insert, flush</text><polygon points="562,790 562,662 601.6,662 603.4,662 605.1,662.1 606.9,662.3 608.6,662.6 610.4,662.9 612.2,663.3 613.9,663.7 615.7,664.2 617.5,664.8 619.2,665.4 621,666 622.7,666.8 624.5,667.5 626.3,668.3 628,669.2 629.8,670.1 631.5,671 633.3,672 635.1,673 636.8,674 638.6,675.1 640.4,676.2 642.1,677.3 643.9,678.5 643.9,790" class="good"/><line x1="562" y1="790" x2="667.2" y2="790" class="dim"/><line x1="601.6" y1="650" x2="601.6" y2="802" class="dim"/><line x1="659.2" y1="770" x2="659.2" y2="802" class="dim"/><text x="546" y="670" class="small" text-anchor="end">39 MPa allowed</text><text x="546" y="706" class="small" text-anchor="end">over the ring</text><text x="663.9" y="746" class="small">eases off over the overhang,</text><text x="663.9" y="782" class="small">cut where the washer would bend past 320 MPa</text><text x="659.2" y="834" class="small" text-anchor="middle">washer edge</text><text x="180" y="890" class="small">pressure on the lid's underside, to the section's radius scale</text><text x="1120" y="140" class="big">Bare lid on the insert's ring</text><text x="1120" y="184">8.4 mm²  →  329 N, 0.20 N·m</text><text x="1120" y="272" class="big">ISO 7089 washer between lid and insert</text><text x="1120" y="316">19.8 mm²  →  774 N, 0.30 N·m</text><text x="1120" y="360" class="small">0.70 of its 0.96 mm overhang bears:</text><text x="1120" y="398" class="small">past that it would bend over 320 MPa</text><text x="1120" y="436" class="small">the plastic spreads it over 1.70 mm (1 / β)</text><text x="1120" y="518" class="small">A head washer too: with the lid off the ring,</text><text x="1120" y="556" class="small">the head sets the next limit</text></svg>
