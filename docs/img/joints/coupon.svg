<circle class="hole" cx="205.7" cy="323.5" r="37.4"><title>hole 2: 5.35 mm in CAD</title></circle>
<text x="205.7" y="327.5" text-anchor="middle" style="font-size:11px">5.35</text>
<circle class="hole" cx="313.5" cy="323.5" r="37.8"><title>hole 3: 5.40 mm in CAD</title></circle>
<text x="313.5" y="327.5" text-anchor="middle" style="font-size:11px">5.40</text>
<circle class="hole" cx="97.9" cy="215.7" r="38.1"><title>hole 4: 5.45 mm in CAD</title></circle>
<text x="97.9" y="219.7" text-anchor="middle" style="font-size:11px">5.45</text>
<circle class="hole" cx="205.7" cy="215.7" r="38.5"><title>hole 5: 5.50 mm in CAD</title></circle>
<text x="205.7" y="219.7" text-anchor="middle" style="font-size:11px">5.50</text>
<circle class="hole" cx="313.5" cy="215.7" r="38.9"><title>hole 6: 5.55 mm in CAD</title></circle>
<text x="313.5" y="219.7" text-anchor="middle" style="font-size:11px">5.55</text>
<circle class="hole" cx="97.9" cy="107.9" r="39.2"><title>hole 7: 5.60 mm in CAD</title></circle>
<text x="97.9" y="111.9" text-anchor="middle" style="font-size:11px">5.60</text>
<circle class="hole" cx="205.7" cy="107.9" r="39.6"><title>hole 8: 5.65 mm in CAD</title></circle>
<text x="205.7" y="111.9" text-anchor="middle" style="font-size:11px">5.65</text>
<circle class="hole" cx="313.5" cy="107.9" r="39.9"><title>hole 9: 5.70 mm in CAD</title></circle>
<text x="313.5" y="111.9" text-anchor="middle" style="font-size:11px">5.70</text>
<text x="405" y="58" class="muted">hole 1 by the notched corner; sizes rise along each row</text>
<text x="405" y="78" class="muted">nominal 5 + slide 0.25 + undersize 0.25 mm</text>
<text x="405" y="98" class="muted">9 holes, 0.05 mm apart, 5 mm thick</text>
<text x="405" y="118" class="muted">print it like the part, try the real pin,</text>
<text x="405" y="138" class="muted">note which hole fits: from_coupon() gives the offset</text>
</svg>
