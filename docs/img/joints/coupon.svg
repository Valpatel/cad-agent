<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 715 411" width="715" height="411" role="img" aria-label="Fit coupon for a 5 mm pin: nine holes from 5.30 to 5.70 mm">
<style>text{font:13px system-ui,sans-serif;fill:#1d1d1b}.muted{fill:#5c5b56;font-size:11px}.axis{stroke:#9b9a93;stroke-width:1;fill:none}.grid{stroke:#e2e1dc;stroke-width:1}.s1{fill:#2a78d6;stroke:#2a78d6}.s2{fill:#eb6834;stroke:#eb6834}.s3{fill:#1baf7a;stroke:#1baf7a}.part{fill:#eef1e4;stroke:#173d3c;stroke-width:1.5}.hole{fill:#fcfcfb;stroke:#173d3c;stroke-width:1.5}.bg{fill:#fcfcfb}@media (prefers-color-scheme:dark){text{fill:#f0efec}.muted{fill:#c3c2b7}.axis{stroke:#8a897f}.grid{stroke:#383835}.s1{fill:#3987e5;stroke:#3987e5}.s2{fill:#d95926;stroke:#d95926}.s3{fill:#199e70;stroke:#199e70}.part{fill:#2a3330;stroke:#c3c2b7}.hole{fill:#1a1a19;stroke:#c3c2b7}.bg{fill:#1a1a19}}</style>
<rect class="bg" width="715" height="411"/>
<text x="20" y="24">Fit coupon: pivot pin, 5 mm, slide (CAD 5.5 ± 0.2 mm)</text>
