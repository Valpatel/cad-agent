<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" role="img" aria-label="An RJ45 plug pushed in along its mating axis through two panel windows. Through a window sized from the jack's bounding box, the latch sweeps 17.55 cubic millimetres of wall. Through the window derived from the mated plug, it clears with the 0.5 mm clearance." font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#173d3c">
<style>.m10,.m11{fill:#526863}.m10{font-size:10px}.m11{font-size:11px}.n{display:none}@media (max-width:400px){text:not(.n),.w{display:none}.n{display:inline}}@keyframes k0{0%,91.7%,100%{transform:translateX(206.4px);opacity:0}3.3%,8.9%{transform:translateX(206.4px);opacity:1}53.3%,86.7%{transform:translateX(0px);opacity:1}91.1%{transform:translateX(0px);opacity:0}}@keyframes k1{0%,45%,91.1%,100%{transform:scaleX(0)}50.6%,86.7%{transform:scaleX(1)}}@keyframes k2{0%,55.6%,90%,100%{opacity:0}58.9%,86.7%{opacity:1}}@keyframes k3{0%,58.9%,90%,100%{opacity:0}62.2%,86.7%{opacity:1}}.band{transform-origin:98.5px 0;transform-box:view-box}.plug0,.plug1{animation:k0 9s linear infinite}.band{animation:k1 9s linear infinite}#v00,#v10{animation:k2 9s linear infinite}#v01,#v11{animation:k3 9s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
