<g id="l3"><text x="20" y="490" class="m11">A step is the gap, and at least max_step_mm. After the first sample, a box gap ≥ max_step_mm stands in for the query (○).</text><text x="20" y="506" class="m11">A move of h changes the gap by at most h, so between two samples it stays ≥ (g1 + g2 − h) / 2. Dashed: exact.</text><text x="20" y="522" font-weight="600">clear: the closest approach lies between 1.85 and 4.03 mm; 4 queries</text></g>
