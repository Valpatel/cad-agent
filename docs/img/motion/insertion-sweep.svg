<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540" role="img" aria-label="Three pairs from the assembly gate's box-world tests, each part moved in along a straight line. A card 3 mm off a block: the box it sweeps stays 3 mm from the block's, so it is clear with no kernel query. A card into a cover fitted first: it hits, and the first contact is bisected to 25.00 mm before its seat. A part passing a block's corner: sampled near it, and between samples h apart the gap is at least (g1 + g2 - h) / 2, here 1.85 mm." font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#173d3c">
