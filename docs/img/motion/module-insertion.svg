<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352" width="680" height="352" role="img" aria-label="A preassembled module, a carrier and a board with its screw, is first checked on its own bench sequence. It then goes into the parent as one rigid body along minus X, and the retainer and bumper follow. With the bumper and retainer assumed removed, the module withdraws along plus X." font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#173d3c">
