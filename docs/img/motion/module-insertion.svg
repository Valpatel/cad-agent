<g id="ph0" opacity="0"><text x="24" y="76" font-weight="600">On the bench: the module's members only</text><text x="24" y="86" font-size="26" font-weight="700" class="n">1 · on the bench</text></g>
<g id="ph1"><text x="24" y="76" font-weight="600">In the parent: the module moves as one body</text><text x="24" y="86" font-size="26" font-weight="700" class="n">2 · in the parent</text></g>
<g id="ph2" opacity="0"><text x="24" y="76" font-weight="600">Service: withdrawn with bumper and retainer assumed out</text><text x="24" y="86" font-size="26" font-weight="700" class="n">3 · service</text></g>
<text x="434" y="72" font-weight="700">Bench: the members only</text>
<rect id="h1" class="w" x="428" y="78" width="238" height="18" rx="4" fill="#ffe1cc" opacity="0"/>
<text x="434" y="91" font-size="11.5">1  carrier along −Z</text>
<rect id="h2" class="w" x="428" y="97" width="238" height="18" rx="4" fill="#ffe1cc" opacity="0"/>
<text x="434" y="110" font-size="11.5">2  board along +X, touching carrier</text>
<rect id="h3" class="w" x="428" y="116" width="238" height="18" rx="4" fill="#ffe1cc" opacity="0"/>
<text x="450" y="129" font-size="11.5">module qualified: pass</text>
<text x="434" y="156" font-weight="700">Parent: the module is one part</text>
<rect id="h5" class="w" x="428" y="162" width="238" height="18" rx="4" fill="#ffe1cc" opacity="0"/>
<text x="434" y="175" font-size="11.5">1  base along −Z</text>
<rect id="h6" class="w" x="428" y="181" width="238" height="18" rx="4" fill="#ffe1cc" opacity="0"/>
<text x="434" y="194" font-size="11.5">2  electronics along −X, retainer</text>
<rect id="h7" class="w" x="428" y="200" width="238" height="18" rx="4" fill="#ffe1cc" opacity="0"/>
<text x="450" y="213" font-size="11.5">clear by at least 0.8 mm</text>
<rect id="h8" class="w" x="428" y="219" width="238" height="18" rx="4" fill="#ffe1cc" opacity="0"/>
<text x="434" y="232" font-size="11.5">3  bumper along −Z</text>
