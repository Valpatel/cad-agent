<rect id="h10" class="w" x="428" y="265" width="238" height="18" rx="4" fill="#ffe1cc" opacity="0"/>
<text x="450" y="278" font-size="11.5">bumper and retainer assumed removed</text>
<rect id="h11" class="w" x="428" y="284" width="238" height="18" rx="4" fill="#ffe1cc" opacity="0"/>
<text x="450" y="297" font-size="11.5">withdraws along +X: pass</text>
<rect id="h12" class="w" x="428" y="303" width="238" height="18" rx="4" fill="#ffe1cc" opacity="0"/>
<text x="450" y="316" font-size="11.5">removing those two is not verified</text>
<g id="nf0"><text x="434" y="132" font-size="24" class="n">bench: pass</text></g>
<g id="nf1"><text x="434" y="172" font-size="24" class="n">fitted, ≥ 0.8 mm</text></g>
<g id="nf2"><text x="434" y="212" font-size="24" fill="#bd3a12" class="n">withdraws: pass</text></g>
<g id="nf3"><text x="434" y="244" font-size="24" fill="#bd3a12" class="n">if 2 parts out</text></g>
