%{opacity:1}}@keyframes k13{0%,34.7%,41.3%,100%{opacity:0}36%,40%{opacity:1}}@keyframes k14{0%,42%,58%,100%{opacity:0}43.3%,56.7%{opacity:1}}@keyframes k15{0%,58.7%,65.3%,100%{opacity:0}60%,64%{opacity:1}}@keyframes k16{0%,69.3%,91.3%,100%{opacity:0}70.7%,90%{opacity:1}}@keyframes k17{0%,74.7%,91.3%,100%{opacity:0}76%,90%{opacity:1}}@keyframes k18{0%,82.7%,91.3%,100%{opacity:0}84%,90%{opacity:1}}@keyframes k19{0%,24%,94.7%,100%{opacity:0}26%,92.7%{opacity:1}}@keyframes k20{0%,56.7%,94.7%,100%{opacity:0}58.7%,92.7%{opacity:1}}@keyframes k21{0%,82.7%,94.7%,100%{opacity:0}84.7%,92.7%{opacity:1}}.bc,.bb,.bs{opacity:0}.bc{animation:k0 15s ease-in-out infinite}.bb{animation:k1 15s ease-in-out infinite}.bs{animation:k2 15s ease-in-out infinite}.pb{animation:k3 15s ease-in-out infinite}.pm{animation:k4 15s ease-in-out infinite}.pr{animation:k5 15s ease-in-out infinite}.pu{animation:k6 15s ease-in-out infinite}#gone,#ph2{animation:k7 15s linear infinite}#ph0{animation:k8 15s linear infinite}#ph1{animation:k9 15s linear infinite}#h1{animation:k10 15s linear infinite}#h2{animation:k11 15s linear infinite}#h3{animation:k12 15s linear infinite}#h5{animation:k13 15s linear infinite}#h6,#h7{animation:k14 15s linear infinite}#h8{animation:k15 15s linear infinite}#h10{animation:k16 15s linear infinite}#h11{animation:k17 15s linear infinite}#h12{animation:k18 15s linear infinite}#nf0{animation:k19 15s linear infinite}#nf1{animation:k20 15s linear infinite}#nf2,#nf3{animation:k21 15s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
