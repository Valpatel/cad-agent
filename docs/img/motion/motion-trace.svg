<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 522" width="680" height="522" role="img" aria-label="The analytic shaft from the motion-trace tests at its 10 required poses: the yaw turns the housing, the spin turns the rotor on it, and one nested pose has both turned. Rings mark where the CAD puts each landmark. Renderer A's points sit in them at every pose, and it passes. Renderer B spins the rotor about a pivot 48 mm off the shaft, so its rotor is up to 96 mm off, and it fails." font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#173d3c">
