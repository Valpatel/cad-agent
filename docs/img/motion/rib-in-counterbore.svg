</g>
<text x="188.2" y="170.2" class="m10">counterbore D6.4 × 4</text>
<text x="170.9" y="231.2" class="m10">clearance hole D3.4</text>
<text x="69.7" y="116.2" class="m11" text-anchor="middle">rib</text>
<g id="v00"><text x="26" y="298" fill="#bd3a12">D6.4 counterbore: 24.2 mm³ of rib inside</text></g>
<g id="v01"><text x="26" y="316" fill="#bd3a12">D3.4 hole: 18.2 mm³ of rib inside</text></g>
<g id="v02"><text x="26" y="334" fill="#bd3a12" font-weight="600">fail: over 0.05 mm³ in 2 bores</text></g>
