<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352" width="680" height="352" role="img" aria-label="Section through a screw hole in two build orders. When the rib is unioned after the clearance hole and counterbore are cut, it refills both, and the hole check finds 24.2 and 18.2 cubic millimetres of rib inside them. When the holes are cut last, both are clear." font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#173d3c">
<style>.m10,.m11{fill:#526863}.m10{font-size:10px}.m11{font-size:11px}@keyframes k0{0%,0%,10%,100%{opacity:0}1.8%,8.2%{opacity:1}}@keyframes k1{0%,10.9%,31.8%,100%{opacity:0}12.7%,30%{opacity:1}}@keyframes k2{0%,32.7%,91.8%,100%{opacity:0}34.5%,90%{opacity:1}}@keyframes k3{0%,10.9%,100%{transform:translateY(-14px);opacity:0}19.1%,90%{transform:translateY(0px);opacity:1}93.6%{transform:translateY(0px);opacity:0}}@keyframes k4{0%,20%,92.7%,100%{opacity:0}23.6%,35.5%{opacity:0.85}40%,50.9%,90%{opacity:1}45.5%{opacity:0.7}}@keyframes k5{0%,32.7%,92.7%,100%{opacity:0}35.5%,90%{opacity:1}}@keyframes k6{0%,38.2%,92.7%,100%{opacity:0}40.9%,90%{opacity:1}}@keyframes k7{0%,40.9%,92.7%,100%{opacity:0}43.6%,90%{opacity:1}}@keyframes k8{0%,43.6%,92.7%,100%{opacity:0}46.4%,90%{opacity:1}}@keyframes k9{0%,19.1%,93.6%,100%{opacity:1}22.7%,90%{opacity:0}}@keyframes k10{0%,10.9%,22.7%,100%{opacity:0}13.6%,19.1%{opacity:1}}#s00,#s10{animation:k0 11s linear infinite}#s01,#s11{animation:k1 11s linear infinite}#s02,#s12{animation:k2 11s linear infinite}.rib{animation:k3 11s ease-out infinite}#f{animation:k4 11s ease-in-out infinite}#p0,#p1{animation:k5 11s linear infinite}#v00,#v10{animation:k6 11s linear infinite}#v01,#v11{animation:k7 11s linear infinite}#v02{animation:k8 11s linear infinite}#u{animation:k9 11s linear infinite}#x{animation:k10 11s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="680" height="352" rx="14" fill="#fffdf5" stroke="#d8e0d3"/>
<text x="20" y="28" font-size="15" font-weight="700">A rib added after the holes refills them: section through the screw hole</text>
<clipPath id="c0"><rect x="26" y="84" width="264.5" height="184"/></clipPath>
<text x="26" y="54" font-size="13" font-weight="600">Holes cut, then the rib unioned</text>
<g id="s00" opacity="0"><text x="26" y="72" class="m11">1 · cut the hole and counterbore</text></g>
<g id="s01" opacity="0"><text x="26" y="72" class="m11">2 · union the rib: it runs to the hole's centre</text></g>
<g id="s02"><text x="26" y="72" class="m11">3 · cad-agent holes probes each bore</text></g>
