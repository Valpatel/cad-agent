<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260" role="img" aria-label="Injection moulding: bosses and cored holes as multiples of the hole diameter" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<rect width="680" height="260" rx="14" fill="#fffdf5" stroke="#d8e0d3"/>
<text x="18" y="30" font-size="15" font-weight="700" fill="#173d3c">Injection moulding: bosses and cored holes as multiples of the hole diameter</text>
<text x="18" y="50" font-size="12" fill="#526863">4 rules (compare: im-boss-od, im-hole-depth), at a hole diameter of 1, so each reads as × D.</text>
<line x1="300.0" y1="70" x2="300.0" y2="214" stroke="#d8e0d3"/>
<text x="300.0" y="229" font-size="11" fill="#526863" text-anchor="middle">0</text>
<line x1="353.0" y1="70" x2="353.0" y2="214" stroke="#d8e0d3"/>
<text x="353.0" y="229" font-size="11" fill="#526863" text-anchor="middle">0.5</text>
<line x1="406.0" y1="70" x2="406.0" y2="214" stroke="#d8e0d3"/>
<text x="406.0" y="229" font-size="11" fill="#526863" text-anchor="middle">1</text>
<line x1="459.0" y1="70" x2="459.0" y2="214" stroke="#d8e0d3"/>
<text x="459.0" y="229" font-size="11" fill="#526863" text-anchor="middle">1.5</text>
<line x1="512.0" y1="70" x2="512.0" y2="214" stroke="#d8e0d3"/>
<text x="512.0" y="229" font-size="11" fill="#526863" text-anchor="middle">2</text>
<line x1="565.0" y1="70" x2="565.0" y2="214" stroke="#d8e0d3"/>
<text x="565.0" y="229" font-size="11" fill="#526863" text-anchor="middle">2.5</text>
<line x1="618.0" y1="70" x2="618.0" y2="214" stroke="#d8e0d3"/>
<text x="618.0" y="229" font-size="11" fill="#526863" text-anchor="middle">3</text>
<text x="618.0" y="244" font-size="11" fill="#526863" text-anchor="end">× D</text>
<text x="18" y="93" font-size="12.5" font-weight="700" fill="#173d3c">Boss outside diameter</text>
<text x="290" y="116.0" font-size="12" fill="#173d3c" text-anchor="end">DuPont</text>
<rect x="512.0" y="108.0" width="53.0" height="8" rx="4" fill="#6f8a80"/>
<text x="572.0" y="116.0" font-size="11" fill="#173d3c" text-anchor="start">2–2.5</text>
<text x="290" y="136.0" font-size="12" fill="#173d3c" text-anchor="end">Covestro</text>
<rect x="512.0" y="128.0" width="42.4" height="8" rx="4" fill="#6f8a80"/>
<text x="561.4" y="136.0" font-size="11" fill="#173d3c" text-anchor="start">2–2.4</text>
<text x="18" y="157" font-size="12.5" font-weight="700" fill="#173d3c">Depth of a blind cored hole</text>
<text x="290" y="180.0" font-size="12" fill="#173d3c" text-anchor="end">DuPont</text>
<line x1="300" y1="176.0" x2="512.0" y2="176.0" stroke="#6f8a80" stroke-width="2" stroke-dasharray="3 3"/>
<circle cx="512.0" cy="176.0" r="5" fill="#6f8a80"/>
<text x="521.0" y="180.0" font-size="11" fill="#173d3c" text-anchor="start">≤ 2</text>
<text x="290" y="200.0" font-size="12" fill="#173d3c" text-anchor="end">Covestro</text>
<line x1="300" y1="196.0" x2="618.0" y2="196.0" stroke="#6f8a80" stroke-width="2" stroke-dasharray="3 3"/>
<circle cx="618.0" cy="196.0" r="5" fill="#6f8a80"/>
<text x="627.0" y="200.0" font-size="11" fill="#173d3c" text-anchor="start">≤ 3</text>
<text x="18" y="248" font-size="11" fill="#526863">Each source's own wording and conditions are in the YAML file and on the page. Read 2026-10-31.</text>
</svg>
