<text x="618.0" y="220" font-size="11" fill="#526863" text-anchor="end">HRB</text>
<text x="18" y="93" font-size="12.5" font-weight="700" fill="#173d3c">Fastener material</text>
<text x="290" y="116.0" font-size="12" fill="#173d3c" text-anchor="end">PEM · aluminium: CLA, FHA, SOA</text>
<line x1="300" y1="112.0" x2="459.0" y2="112.0" stroke="#6f8a80" stroke-width="2" stroke-dasharray="3 3"/>
<circle cx="459.0" cy="112.0" r="5" fill="#6f8a80"/>
<text x="468.0" y="116.0" font-size="11" fill="#173d3c" text-anchor="start">≤ 50</text>
<text x="290" y="136.0" font-size="12" fill="#173d3c" text-anchor="end">PEM · 300 stainless: CLS, FHS, SOS, F</text>
<line x1="300" y1="132.0" x2="522.6" y2="132.0" stroke="#6f8a80" stroke-width="2" stroke-dasharray="3 3"/>
<circle cx="522.6" cy="132.0" r="5" fill="#6f8a80"/>
<text x="531.6" y="136.0" font-size="11" fill="#173d3c" text-anchor="start">≤ 70</text>
<text x="290" y="156.0" font-size="12" fill="#173d3c" text-anchor="end">PEM · hardened steel: S, SS, FH, SO, BSO</text>
<line x1="300" y1="152.0" x2="554.4" y2="152.0" stroke="#6f8a80" stroke-width="2" stroke-dasharray="3 3"/>
<circle cx="554.4" cy="152.0" r="5" fill="#6f8a80"/>
<text x="563.4" y="156.0" font-size="11" fill="#173d3c" text-anchor="start">≤ 80</text>
<text x="290" y="176.0" font-size="12" fill="#173d3c" text-anchor="end">PEM · hardened stainless: SO4, F4, SP, FH4</text>
