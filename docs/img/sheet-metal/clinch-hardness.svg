<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 236" width="680" height="236" role="img" aria-label="Self-clinching fasteners: the hardest sheet each fastener material takes" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<rect width="680" height="236" rx="14" fill="#fffdf5" stroke="#d8e0d3"/>
<text x="18" y="30" font-size="15" font-weight="700" fill="#173d3c">Self-clinching fasteners: the hardest sheet each fastener material takes</text>
<text x="18" y="50" font-size="12" fill="#526863">4 rules (compare: sm-clinch-sheet-hardness). The sheet must also be about 20 HRB softer than the fastener.</text>
