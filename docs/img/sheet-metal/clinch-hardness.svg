<line x1="363.6" y1="70" x2="363.6" y2="190" stroke="#d8e0d3"/>
<text x="363.6" y="205" font-size="11" fill="#526863" text-anchor="middle">20</text>
<line x1="395.4" y1="70" x2="395.4" y2="190" stroke="#d8e0d3"/>
<text x="395.4" y="205" font-size="11" fill="#526863" text-anchor="middle">30</text>
<line x1="427.2" y1="70" x2="427.2" y2="190" stroke="#d8e0d3"/>
<text x="427.2" y="205" font-size="11" fill="#526863" text-anchor="middle">40</text>
<line x1="459.0" y1="70" x2="459.0" y2="190" stroke="#d8e0d3"/>
<text x="459.0" y="205" font-size="11" fill="#526863" text-anchor="middle">50</text>
<line x1="490.8" y1="70" x2="490.8" y2="190" stroke="#d8e0d3"/>
<text x="490.8" y="205" font-size="11" fill="#526863" text-anchor="middle">60</text>
<line x1="522.6" y1="70" x2="522.6" y2="190" stroke="#d8e0d3"/>
<text x="522.6" y="205" font-size="11" fill="#526863" text-anchor="middle">70</text>
<line x1="554.4" y1="70" x2="554.4" y2="190" stroke="#d8e0d3"/>
<text x="554.4" y="205" font-size="11" fill="#526863" text-anchor="middle">80</text>
<line x1="586.2" y1="70" x2="586.2" y2="190" stroke="#d8e0d3"/>
<text x="586.2" y="205" font-size="11" fill="#526863" text-anchor="middle">90</text>
<line x1="618.0" y1="70" x2="618.0" y2="190" stroke="#d8e0d3"/>
