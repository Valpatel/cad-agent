# Real outputs placed on doc pages by the site build (tools/build-site.mjs, tools/site-pages.mjs), without touching the
# Markdown: the .md twins and llms.txt stay exactly as written, and GitHub shows the page as before.
#
#   docs/<page>.md:
#     hero:                  # one large figure under the title and its first paragraph
#       img: docs/img/...    # a committed picture
#       shows: output        # output: the tool's own (a render, a page it built, a file it wrote);
#                            # diagram: a drawing of something real, made by the script in drawn_by
#       drawn_by: tools/...  # diagrams only: the script that drew it
#       tool: cad-agent site # a cad-agent command, a cadagent module or a script under tools/ (the build checks it exists)
#       on: fixture          # what it was computed on: gyropup, enclosure, fixture, fixture-2d, example, sources
#       caption: one or two lines, with the numbers the tool computed
#       alt: what the picture shows, for a screen reader
#     band:                  # two to four input → tool → output tiles, under the hero
#       - img, shows, drawn_by, tool, on, caption, alt as above
#         input: what goes in, in words
#         output: what comes out, in words
#         href: "#a-heading-on-this-page"   # or another published page: docs/x.md, docs/x.md#heading
#     figures:               # a picture inside a section, after its first paragraph (or right under the heading
#       - after: heading-id  #   when that paragraph introduces the block after it); several keep their order
#         below: some words  # optional: after the section's first paragraph, list, table or code block with these words
#         img, shows, drawn_by, tool, on, caption, alt as above
#
# Every caption starts with what the picture is ("Real output of `cad-agent site`, on a test fixture in this repo."),
# then says what it shows. A caption never calls a drawing a result, or a seeded failure the design as built.
# The build stops on an unknown key, an entry that places nothing, a picture that is not committed under docs/img/, a
# heading the page does not have, or a missing caption, alt text, `shows` or `on`.
#
# Owner (2026-10-31): "CAD is graphical, so our site should be too. Not a wall of text." The browser suite measures each
# page's longest stretch with nothing to look at (tests/site-walls.mjs, #179).
#
# The gate bench pictures (docs/img/gates/) come from tools/site-bench-pictures.mjs, which builds the review site with
# `cad-agent site` from the bench's committed run (tests/fixtures/gate_bench/site_snapshot). The bench as built: six
# gates, 144 checks (31 + 21 + 28 + 1 + 55 + 8), all pass; its arm sweeps 0 to 40 degrees in 12 poses with no
# collision and 1.60 mm least clearance (the motion gate's verdict, site_snapshot/gates/motion.json).
#
# The review-packet renders (docs/img/packets/) come from tools/site-packet-pictures.py, which runs `cad-agent gates
# --build` and `cad-agent review-packet` on a copy of the bench, as built and with one seeded defect at a time
# (tests/fixtures/gate_bench/build.py, SEEDS). docs/img/packets/SOURCE.json records each run's gate verdicts, and
# tests/test_packet_pictures.py holds the captions below to it: a seeded picture's caption names its seed.

