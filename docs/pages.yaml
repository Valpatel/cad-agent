research/compliant-mechanisms.md:
  hero:
    img: docs/img/compliant/snap-engagement.svg
    shows: diagram
    drawn_by: tools/readme_anim.py
    tool: cadagent.mechanical.compliant.snapfit
    on: example
    caption: "A printed snap arm, 15 mm long and 1.6 × 6 mm, rides a 30° lead over a 1.3 mm undercut; the snap-fit calculator gives its root strain along the travel. At the top it is 1.38 %: 68 % of the 2.02 % allowed for dry CoPA, a pass, and 139 % of PETG-CF's 1.00 %, a fail. The equations and allowables below are what it uses."
    alt: "An animated snap arm bending as a mating edge rides up its hook's lead, with its root strain rising to 1.38 percent against two filaments' allowables: a pass for CoPA, a fail for PETG-CF"
  figures:
    - after: 2-snap-fit-equations-and-worked-examples-for-tests-bayer-guide-read
      below: Undercut = deflection.
      img: docs/img/compliant/example-1.svg
      shows: diagram
      drawn_by: tools/snapfit_figures.py
      tool: cadagent.mechanical.compliant.snapfit
      on: sources
      caption: "Example I of the table below, computed by the toolkit's snap-fit calculator and drawn to scale: the guide's tapered polycarbonate hook, 19 mm long, deflected 2.4 mm. The 2.00 % root strain and the forces come out of the module, not typed in; a test holds them to the guide's answers."
      alt: "Example I from the snap-fit design guide, computed: a tapered polycarbonate cantilever hook with its length, thicknesses and deflection drawn to scale, root strain 2.00 percent"
    - after: 5-fdm-anisotropy-in-plane-x-y-vs-inter-layer-z-data-from-manufacturer-tds-read
      below: Strain to failure across the layers falls far more than strength
      img: docs/img/fea/layer-check.svg
      shows: diagram
      drawn_by: tools/fea_layer_figure.py
      tool: cadagent.simulation.fea
      on: example
      caption: "The toolkit's layer check on a PETG-CF bar pulled at 10 MPa, solved at seven print tilts. Pulled straight across the layers its safety factor is 2.20 (the bond), lying in them 2.66 (the bulk), and at 30° only 2.07, where the layers also carry shear. Strength, not snap strain, but the same reason for the orientation rule below."
      alt: "A PETG-CF bar's safety factor against print tilt: the bond check governs from 0 to 58 degrees, worst at 30 degrees (2.07), the bulk check past that (2.66); the solved bar's dots sit on the hand-computed lines"
    - after: 7-how-the-process-changes-each-feature
      img: docs/img/research/process-fits.svg
      shows: diagram
