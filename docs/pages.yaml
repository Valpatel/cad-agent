      tool: cadagent.mechanical.connectors
      on: fixture
      caption: "An RJ45 plug pushed in along its mating axis, the port in tests/test_connectors.py in section. Through a window sized from the jack's bounding box its latch sweeps into the wall; through the window derived from the mated plug it clears by the 0.5 mm clearance. The swept volumes match the connector check's."
