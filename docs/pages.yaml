docs/file-viewer.md:
  figures:
    - after: behavior-and-limits
      img: docs/img/kit/file-viewer-step.webp
      shows: output
      tool: kit/file-viewer.js
      on: gyropup
      caption: Gyropup's left hip motor plate, opened from its STEP file. The viewer's worker tessellated it into 7,724 triangles, 164.02 × 24.1 × 178 mm, and placed it on the floor, fitted. A visual tessellation, not a manufacturing check.
      alt: The file viewer showing a grey motor plate with a large bore and a ring of screw holes in an isometric view, with view buttons and the file's format, triangle count and size below
    - after: embedding
      img: docs/img/kit/file-viewer-front.webp
      shows: output
      tool: kit/file-viewer.js
      on: gyropup
      caption: The same viewer after viewer.fit('front'). The camera moves to a standard view; the file is not loaded again.
      alt: The same motor plate seen straight from the front, its bore and screw holes in full view
    - after: product-themes
      img: docs/img/kit/file-viewer-theme.webp
      shows: output
      tool: kit/file-viewer.js
      on: gyropup
      caption: The same viewer after setTheme() with the light palette below (accent #126d58, surface #fffaf2). The model, its materials and the camera stay as they were.
      alt: The same motor plate in the viewer's light theme, on a white stage with a cream header and controls
    - after: reproducing-validation
      img: docs/img/kit/file-viewer-error.webp
      shows: output
      tool: kit/file-viewer.js
      on: gyropup
      caption: Broken files are part of the validation. Here, the first half of the same STEP file, cut off. The viewer says it found no surfaces it can show and offers Retry; the download link stays.
      alt: The file viewer with an error panel reading that the STEP reader could not find displayable surfaces in this file, a Retry file button, and the view buttons dimmed

