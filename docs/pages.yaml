      img: docs/img/gyropup/wheel-link-fea.webp
      shows: output
      tool: cadagent.simulation.fea
      on: gyropup
      caption: "A study with the table's pa6_cf_xy row: Gyropup's wheel link in a turn (case E1), 52,134 P2 tetrahedra, PA6-CF along the layers (humid). Safety factor 3.15 against a target of 2.0."
      alt: Von Mises stress in Gyropup's wheel link, highest beside the axle bore, with a colour bar from 0 to 15 MPa
    - after: stiffness-and-strength-cadagentsimulationfea
      below: render(png, scale=None
      img: docs/img/fea.jpg
      shows: output
      tool: cadagent.simulation.fea
      on: enclosure
      caption: "How a study shows margin for a report: a ribbed enclosure lid under a 300 N press, top and underside, coloured by stress as a fraction of the material's strength (at most about 0.39 here), so the colour reads as margin, not megapascals."
      alt: "FEA of a ribbed enclosure lid under a 300 N press, top and underside, coloured by stress over strength on a scale from 0 to 0.39"
    - after: robot-export-cadagentsimulationrobot-optional
      below: solid_mass_properties
      img: docs/img/linkages/fivebar.svg
      shows: diagram
      drawn_by: tools/linkage_figures.py
      tool: cadagent.mechanical.linkages
      on: example
      caption: "A closed loop a tree cannot hold: a five-bar leg (cranks 100 mm, links 120 mm, ground 80 mm) moving its foot round a stride, its poses solved by cadagent.mechanical.linkages. Its lowest transmission angle is 53.4°; turning both cranks together from −90° locks at θ1 = −143.1°."
      alt: "A five-bar leg hanging from its two hips moves its foot round an elliptical stride inside its reach; beside it, a map of the two crank angles shaded by transmission angle, with the stride's path"
    - after: heatsinks-cadagentthermalheatsink
      img: docs/img/thermal/fan-curve-explorer.svg
      shows: diagram
      drawn_by: tools/fan-curve-still.mjs
      tool: kit/fan-curve.js
      on: example
      caption: "The balance operating_point() finds, as the fans page's explorer draws it: a fan's datasheet curve (one ebm-papst W2G115-AD15-13 at 12 V) against a system's resistance, here a system needing 12 Pa at 100 m³/h rather than a heatsink. They cross at 150 m³/h and 26.9 Pa, clear of the stall region below 132 m³/h."
      alt: "A fan's datasheet pressure-flow curve against a system curve: they cross at 150 cubic metres per hour and 26.9 Pa, clear of the shaded stall region below 132"
    - after: topology-optimisation-cadagentsimulationtopopt
      img: docs/img/topology.jpg
      shows: output
      tool: cadagent.simulation.topopt
      on: enclosure
      caption: An enclosure floor with its mounting posts under load. Only the material that carries load is kept; it is a design guide, turned into ribs and pockets in the CAD and checked with FEA.
      alt: Topology optimisation of an enclosure floor, with the remaining load paths between the mounting posts
    - after: holes-clear
      img: docs/img/motion/rib-in-counterbore.svg
      shows: diagram
      drawn_by: tools/motion_figures.py
      tool: cad-agent holes
      on: fixture-2d
      caption: "Why every hole is cut last: a rib unioned after the holes runs into the counterbore and the clearance hole, and cad-agent holes finds it inside both. The counterbore plate in tests/test_holes.py, in section; the volumes match the hole check's."
      alt: "Section through a screw hole in two build orders: a rib unioned after the clearance hole and counterbore were cut refills both, and the hole check finds rib inside each; with the holes cut last, both are clear"

