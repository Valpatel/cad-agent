      on: gyropup
      caption: "The web kit's single-file viewer, a sibling of viewer.html: a motor plate opened from its STEP file, tessellated into 7,724 triangles, 164.02 × 24.1 × 178 mm, placed on the floor and fitted. A visual tessellation, not a manufacturing check."
