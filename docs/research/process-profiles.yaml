    value: "6*D"
    units: mm
    applies: three or more rows (FAA AC 43.13-1B Fig. 4-5 (B)); the outer rows at 6D, the inner rows at 3D with a rivet halfway between the outer rows' rivets, the rows 3D apart and in line. The figure gives the sheet 83 % of its strength through the outer row, (6D - D) / 6D
    datum: hole centre to hole centre
    source: faa-ac-43-13-1b
    status: read
    verified: 2026-11-02
  - id: sm-rivet-row-spacing-faa
