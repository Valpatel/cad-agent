  # ------------------------------------------------------------------ sheet metal: self-clinching fasteners (any shop)
  # PennEngineering's own rules for its PEM fasteners; the same physics holds for other makers' clinch hardware, but
  # their numbers are PEM's. Per-size data (hole, minimum sheet, edge distance, push-out, torque-out) is for the check
  # (#283, PR B), not here.

  - id: sm-clinch-hardness-margin-pem
    process: sheet-metal
    feature: clinch-hardware
    quantity: how much harder the fastener must be than the sheet
    min: 20
    units: hrb
    applies: any self-clinching fastener; the sheet must be ductile and softer than the fastener
    source: pem-handbook
    status: read
    verified: 2026-11-01
  - id: sm-clinch-sheet-hardness-aluminium-pem
    process: sheet-metal
    feature: clinch-hardware
    compare: sm-clinch-sheet-hardness
    variant: "aluminium: CLA, FHA, SOA"
    quantity: hardest sheet the fastener material clinches into
    max: 50
    units: hrb
    applies: PEM aluminium fasteners; printed as HB 89 in the handbook and HB 82 in the bulletins (5052 is HRB 15–30, 6061-T6 HRB 50–55)
    source: pem-handbook
    status: read
    verified: 2026-11-01
  - id: sm-clinch-sheet-hardness-300ss-pem
    process: sheet-metal
    feature: clinch-hardware
    compare: sm-clinch-sheet-hardness
    variant: "300 stainless: CLS, FHS, SOS, F"
    quantity: hardest sheet the fastener material clinches into
    max: 70
    units: hrb
    applies: PEM 300-series stainless fasteners (HB 125); never into stainless sheet
    source: pem-handbook
    status: read
    verified: 2026-11-01
  - id: sm-clinch-sheet-hardness-steel-pem
    process: sheet-metal
    feature: clinch-hardware
    compare: sm-clinch-sheet-hardness
    variant: "hardened steel: S, SS, FH, SO, BSO"
    quantity: hardest sheet the fastener material clinches into
    max: 80
    units: hrb
    applies: PEM hardened steel fasteners (HB 150), for steel or aluminium sheet; cold-rolled steel is HRB 40–75
    source: pem-handbook
    status: read
    verified: 2026-11-01
  - id: sm-clinch-sheet-hardness-hardened-ss-pem
    process: sheet-metal
    feature: clinch-hardware
    compare: sm-clinch-sheet-hardness
    variant: "hardened stainless: SO4, F4, SP, FH4"
    quantity: hardest sheet the fastener material clinches into
    min: 88
    max: 92
    units: hrb
    applies: PEM's stainless-sheet fasteners (SO4 and F4 HRB 88, SP HRB 90, FH4 and FHP HRB 92); 304 annealed is HRB 80 and up, and ASTM A240 allows 304 to HRB 92, so read the sheet's certified hardness
    source: pem-tech-sheet-stainless
    status: read
    verified: 2026-11-01
  - id: sm-clinch-hole-tolerance-pem
    process: sheet-metal
    feature: clinch-hardware
    quantity: mounting hole tolerance over the catalogue size (+, and −0)
    max: 0.08
    units: mm
    applies: PEM self-clinching fasteners; punched or drilled, not chamfered, broken edges at most 0.127 mm (0.005 in), not deburred. SP nuts in stainless sheet hold +0.025 mm
    as_printed: +0.003 in
    source: pem-handbook
    status: read
    verified: 2026-11-01
  - id: sm-clinch-punch-side-pem
    process: sheet-metal
    feature: clinch-hardware
    quantity: sheet thickness from which the fastener must go in from the punch side of a punched hole
    min: 2.29
    units: mm
    applies: PEM; the die side of a punched hole is oversized and burred. Prefer the punch side at any thickness. A laser-cut hole has no punch side but may harden locally
    as_printed: 0.09 in
    source: pem-handbook
    status: read
    verified: 2026-11-01
  - id: sm-clinch-to-bend-pem
    process: sheet-metal
    feature: clinch-hardware
    compare: sm-clinch-to-bend
    quantity: distance from a clinch fastener's hole centre to the bend centre line
    min: "BA/2 + E"
    units: mm
    applies: PEM; E is the part's minimum hole centreline-to-edge distance, which PEM measures from the outside of the bend radius (where the flat starts). On the flat pattern that point lies BA/2 from the bend centre line, so the rule is written on the same datum as SendCutSend's. The sheet must be flat under the fastener, the hole made after bending, and the tooling must reach. Edge distances hold for one edge only
    datum: bend centre line to hole centre (PEM's own datum, the outside of the bend radius, plus BA/2)
    source: pem-handbook
    status: read
    verified: 2026-11-01
  - id: sm-clinch-spacing-pem
    process: sheet-metal
    feature: clinch-hardware
    quantity: centre-to-centre distance between two clinch fasteners
    min: "E + hole/2"
    units: mm
    applies: PEM; E is the first part's minimum centreline-to-edge distance, hole the second part's mounting hole. SendCutSend's catalogue gives its own minimum (M) per part
    datum: hole centre to hole centre
    source: pem-handbook
    status: read
    verified: 2026-11-01
  - id: sm-clinch-sheet-min-pem
    process: sheet-metal
    feature: clinch-hardware
    quantity: the usual thinnest sheet for self-clinching fasteners
    min: 0.76
    max: 1.0
    units: mm
    applies: PEM; some types reach 0.2 mm (0.008 in), and each part's shank code sets its own minimum
    as_printed: 0.030 in or 0.040 in
    source: pem-handbook
    status: read
    verified: 2026-11-01
  - id: sm-clinch-pushout-share-pem
    process: sheet-metal
    feature: clinch-hardware
    quantity: push-out force as a share of the installation force
    min: 5
    max: 10
    units: percent
    applies: PEM self-clinching nuts; a rough cross-check of a quoted push-out, not a rating
    source: pem-handbook
    status: read
    verified: 2026-11-01

