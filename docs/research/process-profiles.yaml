  - id: sm-rivet-pitch-faa
    process: sheet-metal
    feature: rivet
    compare: sm-rivet-pitch
    variant: single row
    quantity: rivet centre to centre along a row
    min: "3*D"
    units: mm
    applies: a single row (FAA AC 43.13-1B 4-57c)
    datum: hole centre to hole centre
    source: faa-ac-43-13-1b
    status: read
    verified: 2026-11-01
  - id: sm-rivet-pitch-double-faa
    process: sheet-metal
    feature: rivet
    compare: sm-rivet-pitch
    variant: double row
    quantity: rivet centre to centre along a row
    value: "4*D"
    units: mm
    applies: two rows (FAA AC 43.13-1B Fig. 4-5); the rows 4D apart too
    datum: hole centre to hole centre
    source: faa-ac-43-13-1b
    status: read
    verified: 2026-11-01
  - id: sm-rivet-pitch-nasa
    process: sheet-metal
    feature: rivet
    compare: sm-rivet-pitch
    variant: nominal
    quantity: rivet centre to centre
    value: "4*D"
    units: mm
    applies: NASA RP-1228 pp. 21 and 34; thin sheet can buckle between fasteners, so wider spacing suits thicker sheet
    datum: hole centre to hole centre
    source: nasa-1228
    status: read
    verified: 2026-11-01
  - id: sm-rivet-pitch-multiple-faa
    process: sheet-metal
    feature: rivet
