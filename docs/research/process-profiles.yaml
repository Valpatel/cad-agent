# Manufacturing-process profiles: design rules by process, each cited to the person, company or standard behind it
# (Valpatel/cad-agent#99). The page that explains them is docs/research/manufacturing/process-profiles.md.
#
# Who reads this: agents choosing limits for a part, and the checks and calculators (cadagent.manufacturing.process,
# .dfm, .sheet_metal and .fit_coupons, #99) that need a process's minimum wall, hole-to-bend distance or draft instead
# of hard-coding one printer's numbers.
#
# "We are highlighting experts, not taking credit for their tips." Every rule names its source; sources are
# summarised and cited, never copied. Paid standards are cited by number and title only.
#
# Sources live in the reference registry, docs/research/references.yaml (#118): every `source` here is an id there, and
# tests/review/test_references.py checks that each resolves and that the registry lists this file in its used_for.
#
# Rules
#   id         unique, kebab-case: <process>-<feature>-<qualifier>-<source short name>
#   process    a key of `processes`
#   feature    what on the part the rule is about (wall, hole, bend-radius, draft, …)
#   compare    optional: rules from different sources or processes that limit the same quantity, in the same units,
#              share this key, so a page or a check can set them side by side (tools/figures/process_profile_figures.py draws
#              them)
#   variant    optional: a short qualifier when one source gives the same quantity more than once (supported)
#   quantity   what is limited, in words
#   min / max / value
#              at least one. A number, or an expression in `variables` (for example "2*T + R"), using + - * / ( ),
#              numbers, min() / max() and one "a if T <= x else b" for a rule that steps with thickness. min is
#              "at least", max is "at most", min and max together a range, value a typical or nominal figure.
#   window     optional, with both min and max: true when they are the two ends of an allowed window for the feature
#              itself (at least min and at most max), not one limit that varies between them by size, material or
#              support. Charts draw a window as an open bar
#   units      one of `units`; for an expression, the units of its result
#   applies    when the rule applies (material, thickness, machine, orientation)
#   datum      optional: where a distance is measured from, when the source says (or "not stated")
#   source     a source id in docs/research/references.yaml, or dataset:<id> for numbers kept on another research page
#              (see `datasets`)
#   as_printed optional: the value in the source's own units when it was converted (1 in = 25.4 mm)
#   shop       optional: the id of a shop in `shops` when the rule is that shop's own process limit, not a generic
#              design rule. cadagent.manufacturing.process leaves shop rules out unless a caller names the shop, so the
#              generic rules stay supplier-neutral and a project's chosen suppliers (#284) select a shop's
#   status     read: seen in the source's own text (or its rendered figure, where `applies` says so) on the date in
#              `verified`; u: not verified (never enforce)
#   verified   ISO date the value was read
#   note       optional: caveats, and where sources disagree
#   applied_by optional: the functions, modules or gates that apply the rule, as dotted names
#              (cadagent.mechanical.inserts.printed_hole). Each reads the rule by its id: a function in its own
#              body, a module at import. The tests check it, so a rule card can say what enforces it
#
# When to apply it (#323 phase 7b): `applies` grows into these, which `cad-agent rules <feature>` serves as one line
# per rule. Each is optional; its text is the rule's `source` unless it carries its own [ref:<id>] tags, which must be
# read records. Where no source says, write `unstated`: the card flags it and nothing is guessed.
#   when       the conditions it holds under (load, cycles, temperature, quantity, material, process); the card
#              falls back to `applies`
#   not_when   when it does not hold, and what to use instead
#   instead    optional: the rule ids or cards (of `cards`) to use then
#   strictness non-negotiable (a failure, a safety issue or a fit that will not assemble), guideline, or unstated
#   wiggle     how far it may move and which way (for a non-negotiable rule, the side that is free)
#   cost       what holding it tighter costs, so loose and cheap is the default unless a function needs tight
#   materials  optional: the material families it is for (fdm: those of cadagent.manufacturing.process.FDM_MATERIALS)
#   cards      optional: cards of `cards` it belongs to, besides its feature's own
#
# Cards (`cards`): named rule cards that gather rules across features (insert-hole takes the insert hole rules and the
# printed-hole rules its function reads). Decisions (`decisions`): the judgement calls as small decision tables that
# `cad-agent choose <decision>` evaluates (cadagent.manufacturing.cards documents the format); each row's reasons are
# cited, and where no source covers a branch its `gap` says so.
#
# Shops (`shops`): a named supplier whose own rules (`shop:` on a rule) and tables (`shop:` on a shop table) form a
# profile a project can select. Its tables are by stock SKU, lengths converted from its inches at 25.4 mm.
#
# Standards that govern the same ground (ISO 2768-1, ISO 20457, DIN 16742, ISO/ASTM 52910 and 52911-2) are in the
# registry too, as paid documents cited by number and title only; no rule here takes a value from them.
schema: 1
updated: 2026-11-11

units:
  mm: millimetres
  deg: degrees
  percent: per cent
  ratio: a dimensionless ratio
  degC: degrees Celsius
  count: a whole number of things
  hrb: Rockwell B hardness
  hb: Brinell hardness

variables:
  T: sheet thickness (mm)
  R: inside bend radius (mm)
  wall: nominal wall thickness of the part next to the feature (mm)
  D: nominal diameter of the hole, pin, boss, thread or tool (mm)
  L: the nominal dimension a tolerance applies to (mm)
  depth: depth of the pocket, cavity or hole (mm)
  width: width of the pocket, cavity or slot (mm)
  H: height of a rib or boss (mm)
  track: width of one extruded track, the line width (mm)
  facets: sides of the polygon a meshed circle is drawn with (count)
  nozzle: FDM nozzle diameter (mm)
  rib: base thickness of the rib (mm)
  texture: depth of the mould texture (mm)
  area: area of the mating feature (mm²)
  die: the V-die opening a shop bends the stock on (mm)
  BA: bend allowance, the length of the neutral sheet through the bend (mm)
  E: a clinch fastener's minimum hole centreline-to-edge distance, from its maker's or shop's catalogue (mm)
  hole: the mounting hole of the second of two clinch fasteners (mm)
  grip: the total thickness a rivet clamps (mm)

processes:
  fdm: FDM / FFF material extrusion (desktop and industrial)
  sla: vat photopolymerisation, laser SLA and masked / LCD (MSLA) printers
  sls: selective laser sintering of polymer powder (mostly PA 12)
  mjf: HP Multi Jet Fusion (PA 12, PA 11, PP)
  injection-moulding: plastic injection moulding
  sheet-metal: laser- or punch-cut sheet, press-brake bent
  cnc: CNC milling and turning

shops:
  - id: sendcutsend
    name: SendCutSend
    url: https://sendcutsend.com/
    note: >-
      Online laser, waterjet and router cutting with bending, PEM hardware, tapping, countersinks, dimples and
      finishes. Air bending on fixed tooling: one radius and K per stock, no custom
      radii, no hems. Its per-stock limits change: re-fetch sendcutsend-specs.json before relying on a number.
      Research: docs/research/manufacturing/sheet-metal.md (the deep dive) and docs/research/manufacturing/sheet-metal-joining.md (its hardware).

# Data that already lives on another research page. Rules here point at it instead of copying it.
datasets:
  - id: fdm-anisotropy-tds
    what: >-
      In-plane (XY) against across-the-layers (Z) modulus, strength and strain to failure for 13 filaments from the
      makers' data sheets, with the derived allowable strain per direction
    where: docs/research/compliant-mechanisms.md
    section: "§5 FDM anisotropy and §6 printed allowable strain"
    cites: >-
      Bambu Lab and Polymaker technical data sheets, each linked in that page's §10 (keys BBL-* and PM-*; the #119
      registry ids are bambu-*-tds and polymaker-*-tds)
  - id: sendcutsend-bend-table
    what: >-
      One shop's bend tooling, per stock SKU: inside radius, K-factor, minimum flange and relief depth. A check should
      read the chosen shop's table before any generic rule (see `shop_tables` below)
    where: docs/research/process-profiles.yaml
    section: shop_tables
    cites: sendcutsend-specs

formulas:
  - id: sm-bend-allowance
    expr: "pi*(R + K*T)*A/180"
    gives: bend allowance, the arc length of the neutral sheet (mm)
    variables: {R: inside bend radius (mm), K: K-factor, T: thickness (mm), A: bend angle (deg)}
    source: solidworks-k-factor
    verified: 2026-10-31

rules:

  # ================================================================== FDM
  # Orientation and anisotropy: the numbers are in docs/research/compliant-mechanisms.md §5–6 (dataset fdm-anisotropy-tds)
  # and are not repeated here. Across the layers, strength is 0.40–0.90 of in-plane and strain to failure 0.10–0.61.

  - id: fdm-orientation-z-strength-ratio-tds
    process: fdm
    feature: orientation
    quantity: strength across the layers (Z) as a fraction of in-plane (XY), PLA, PETG, ASA and CoPA data sheets
    min: 0.40
    max: 0.90
    units: ratio
    applies: 100 % infill tensile bars; the per-material rows are in compliant-mechanisms.md §5
    source: dataset:fdm-anisotropy-tds
    status: read
    verified: 2026-10-31
  - id: fdm-orientation-z-strain-ratio-tds
    process: fdm
    feature: orientation
    quantity: strain to failure across the layers (Z) as a fraction of in-plane (XY), same data sheets
    min: 0.10
    max: 0.61
    units: ratio
    applies: 100 % infill tensile bars; strain falls much more than strength, so flexing features lie in XY
    source: dataset:fdm-anisotropy-tds
    status: read
    verified: 2026-10-31

  - id: fdm-overhang-max-hubs
    process: fdm
    feature: overhang
    compare: overhang-max
    quantity: steepest overhang printed without support, from vertical
    max: 45
    units: deg
    applies: most materials; above it, add support and expect marks on the supported face
    source: hubs-fdm-design
    status: read
    verified: 2026-10-31
  - id: fdm-overhang-max-prusa
    process: fdm
    feature: overhang
    compare: overhang-max
    quantity: steepest overhang printed cleanly without support, from vertical
    min: 45
    max: 60
    units: deg
    applies: 0.4 mm nozzle, depending on settings; smaller nozzles (0.25 mm) may manage less than 45°
    source: prusa-modeling-for-3dp
    status: read
    verified: 2026-10-31
  - id: fdm-overhang-max-prusa-360-cooling
    process: fdm
    feature: overhang
    compare: overhang-max
    quantity: steepest overhang printed without support, from vertical
    max: 75
    units: deg
    applies: Prusa printers with the Nextruder and 360° part cooling (MK4S, CORE One family), per Prusa
    source: prusa-modeling-for-3dp
    status: read
    verified: 2026-10-31
  - id: fdm-overhang-max-xometry-eu
    process: fdm
    feature: overhang
    compare: overhang-max
    quantity: steepest overhang without support, from vertical
    max: 45
    units: deg
    applies: Xometry Europe's FDM service; chamfer or round the edge so it prints
    source: xometry-eu-fdm-design-tips
    status: read
    verified: 2026-10-31

  - id: fdm-bridge-max-hubs
    process: fdm
    feature: bridge
    compare: bridge-max
    quantity: longest bridge without visible sag or support marks
    max: 5
    units: mm
    applies: horizontal bridges and roofs; longer ones sag or need support, or split the part
    source: hubs-fdm-design
    status: read
    verified: 2026-10-31
  - id: fdm-bridge-max-xometry-eu
    process: fdm
    feature: bridge
    compare: bridge-max
    quantity: bridge length above which support or a design change may be needed
    max: 5
    units: mm
    applies: Xometry Europe's FDM service
    source: xometry-eu-fdm-design-tips
    status: read
    verified: 2026-10-31

  - id: fdm-wall-min-hubs
    process: fdm
    feature: wall
    compare: min-wall
    quantity: recommended minimum wall thickness
    min: 0.8
    units: mm
    applies: any FDM printer in the Protolabs Network
    source: hubs-3dp-geometry-limits
    status: read
    verified: 2026-10-31
  - id: fdm-wall-min-prusa
    process: fdm
    feature: wall
    compare: min-wall
    variant: one perimeter
    quantity: thinnest printable wall, one perimeter
    min: 0.45
    units: mm
    applies: 0.4 mm nozzle in PrusaSlicer (0.45 mm extrusion width); walls come in whole perimeters (2 = 0.9 mm,
      3 = 1.35 mm, 4 = 1.8 mm), and a wall thinner than one perimeter does not print
    source: prusa-modeling-for-3dp
    status: read
    verified: 2026-10-31
  - id: fdm-wall-min-xometry-eu
    process: fdm
    feature: wall
    compare: min-wall
    variant: supported–unsupported
    quantity: minimum wall thickness
    min: 0.75
    max: 1.0
    units: mm
    applies: Xometry Europe; 0.75 mm where the wall is supported, 1.0 mm unsupported; or three nozzle diameters
    source: xometry-eu-fdm-design-tips
    status: read
    verified: 2026-10-31
  - id: fdm-wall-min-nozzle-xometry-eu
    process: fdm
    feature: wall
    quantity: minimum wall thickness as a multiple of the nozzle
    min: "3*nozzle"
    units: mm
    applies: Xometry Europe's alternative to the absolute 0.75–1.0 mm
    source: xometry-eu-fdm-design-tips
    status: read
    verified: 2026-10-31
  - id: fdm-wall-min-xometry-us
    process: fdm
    feature: wall
    compare: min-wall
    variant: supporting wall
    quantity: minimum thickness of a supporting wall
    min: 1.2
    max: 1.5
    units: mm
    applies: Xometry (US) FDM service, industrial printers; the guide gives 0.047–0.06 in
    as_printed: 0.047–0.06 in
    source: xometry-fdm-mini-guide
    status: read
    verified: 2026-10-31

  - id: fdm-hole-min-xometry-us
    process: fdm
    feature: hole
    compare: min-hole
    quantity: smallest hole diameter that stays round
    min: 1.0
    units: mm
    applies: Xometry (US); holes print best with their axis vertical (in the XY plane); critical through holes may be
      drilled after printing
    as_printed: 0.04 in
    source: xometry-fdm-mini-guide
    status: read
    verified: 2026-10-31
  - id: fdm-hole-undersize-cnckitchen
    process: fdm
    feature: hole
    quantity: how much smaller a printed hole came out than designed
    value: 0.25
    units: mm
    applies: one measurement (Prusa CORE One L, PolySonic PLA, M3 insert holes); every printer and material differs,
      so print a test coupon. Protolabs Network also says vertical holes print undersize and to drill critical ones
    source: cnckitchen-heat-set-hole-size
    status: read
    verified: 2026-10-31
    applied_by: [cadagent.mechanical.inserts.printed_hole, cadagent.manufacturing.fit_coupons]
    cards: [printed-hole]
    when: a printed hole, no coupon measured on your printer and filament
    not_when: a coupon's measured undersize governs
    strictness: guideline
    wiggle: published 0.1 (2019) to 0.25 mm (2026)
    cost: a test coupon per printer and filament

  - id: fdm-elephant-foot-compensation-prusa
    process: fdm
    feature: elephant-foot
    quantity: first-layer inset (elephant-foot compensation) in the slicer
    value: 0.2
    units: mm
    applies: 0.4 mm nozzle in PrusaSlicer; on by default in Prusa's own profiles
    source: prusa-elephant-foot
    status: read
    verified: 2026-10-31
  - id: fdm-elephant-foot-chamfer-hubs
    process: fdm
    feature: elephant-foot
    quantity: chamfer angle (or a radius) on edges touching the build plate, where fit or overall size matters
    value: 45
    units: deg
    applies: any FDM part whose bottom edges must assemble; also eases removal from the plate. Prusa prefers a chamfer
      to a fillet on edges facing the bed
    source: hubs-fdm-design
    status: read
    verified: 2026-10-31

  - id: fdm-corner-radius-hubs
    process: fdm
    feature: corner
    quantity: smallest outside corner or edge radius the nozzle leaves
    value: "nozzle"
    units: mm
    applies: corners in the layer plane are never sharp
    source: hubs-fdm-design
    status: read
    verified: 2026-10-31

  - id: fdm-pin-min-hubs
    process: fdm
    feature: pin
    compare: min-pin
    quantity: vertical pin diameter below which the pin is perimeters only and weakly joined
    min: 5
    units: mm
    applies: smaller pins need a fillet at the base, or a hole and a bought pin
    source: hubs-fdm-design
    status: read
    verified: 2026-10-31
  - id: fdm-pin-min-xometry-eu
    process: fdm
    feature: pin
    compare: min-pin
    quantity: minimum pin diameter (keep it short)
    min: 1.0
    units: mm
    applies: Xometry Europe; columns 2–3 mm minimum
    source: xometry-eu-fdm-design-tips
    status: read
    verified: 2026-10-31

  - id: fdm-clearance-snap-hubs
    process: fdm
    feature: clearance
    compare: clearance-fit
    quantity: nominal clearance between mating parts (snap fits)
    value: 0.5
    units: mm
    applies: Protolabs Network FDM
    source: hubs-snapfit-3dp
    status: read
    verified: 2026-10-31
    cards: [snap-clip]
  - id: fdm-clearance-moving-prusa
    process: fdm
    feature: clearance
    compare: clearance-fit
    quantity: starting clearance for parts that move (hinges) or snap
    min: 0.3
    units: mm
    applies: Original Prusa printers, which Prusa says are accurate to at least 0.2 mm; test-print and adjust
    source: prusa-modeling-for-3dp
    status: read
    verified: 2026-10-31
  - id: fdm-clearance-sliding-xometry-eu
    process: fdm
    feature: clearance
    compare: clearance-fit
    quantity: clearance for a sliding fit
    min: 0.2
    max: 0.3
    units: mm
    applies: Xometry Europe; print mating faces vertical. The same page gives 0.5 mm "for an interference fit", which
      reads as a slip in the source (a clearance cannot make an interference fit), so it is not used here
    source: xometry-eu-fdm-design-tips
    status: read
    verified: 2026-10-31

  - id: fdm-tolerance-desktop-hubs
    process: fdm
    feature: tolerance
    compare: tolerance
    quantity: expected tolerance (±) on a dimension L
    value: "max(0.005*L, 0.5)"
    units: mm
    applies: desktop (prototyping) FDM; ±0.5 % with a lower limit of ±0.5 mm
    source: hubs-3dp-dimensional-accuracy
    status: read
    verified: 2026-10-31
  - id: fdm-tolerance-industrial-hubs
    process: fdm
    feature: tolerance
    compare: tolerance
    quantity: expected tolerance (±) on a dimension L
    value: "max(0.0015*L, 0.2)"
    units: mm
    applies: industrial FDM; ±0.15 % with a lower limit of ±0.2 mm
    source: hubs-3dp-dimensional-accuracy
    status: read
    verified: 2026-10-31
  - id: fdm-tolerance-xometry-eu
    process: fdm
    feature: tolerance
    compare: tolerance
    quantity: general tolerance (±) on a dimension L
    value: "max(0.005*L, 0.5)"
    units: mm
    applies: >-
      Xometry Europe's FDM service, standard and industrial machines (up to 900 × 600 × 900 mm); the specification
      table prints ±0.5 % (±0.5 mm), read here as 0.5 % with a 0.5 mm floor. The page states no floor and no
      "whichever is greater"; the floor is this file's reading
    source: xometry-eu-fdm-design-tips
    as_printed: ±0.5% (±0.5 mm)
    status: read
    verified: 2026-10-31
  - id: fdm-tolerance-xometry-us
    process: fdm
    feature: tolerance
    compare: tolerance
    quantity: tolerance (±) Xometry says its FDM service holds
    value: 0.127
    units: mm
    applies: Xometry (US) industrial FDM; ±0.005 in, with no size dependence stated
    as_printed: ±0.005 in
    source: xometry-fdm-mini-guide
    status: read
    verified: 2026-10-31
  - id: fdm-shrinkage-hubs
    process: fdm
    feature: shrinkage
    quantity: typical shrinkage
    min: 0.2
    max: 1.0
    units: percent
    applies: depends on the material; high-temperature materials warp more (add a bottom radius or a brim)
    source: hubs-3dp-dimensional-accuracy
    status: read
    verified: 2026-10-31

  - id: fdm-thread-printed-min-hubs
    process: fdm
    feature: thread
    quantity: smallest thread worth printing
    min: 5
    units: mm
    applies: printed threads in FDM; below M5 use an insert, a tapped hole or a self-tapping screw
    as_printed: M5
    source: hubs-3dp-threaded-fasteners
    status: read
    verified: 2026-10-31
    when: a thread printed in FDM
    not_when: below M5 use an insert, a tapped hole or a self-tapping screw
    instead: [insert-hole, fdm-self-tap-engagement-hubs]
    strictness: guideline
    wiggle: unstated
    cost: unstated
  - id: fdm-thread-wall-min-hubs
    process: fdm
    feature: thread
    quantity: wall around a threaded hole or insert
    min: "D"
    units: mm
    applies: rule of thumb, D is the fastener's nominal diameter (an M5 needs 5 mm of wall)
    source: hubs-3dp-threaded-fasteners
    status: read
    verified: 2026-10-31
    when: the wall round a threaded hole or an insert in a print
    not_when: unstated
    strictness: guideline
    wiggle: a rule of thumb; too thin bulges and distorts, and in FDM may delaminate or crack
    cost: unstated
  - id: fdm-nut-pocket-clearance-hubs
    process: fdm
    feature: thread
    quantity: total offset around an embedded nut (0.1 mm per side) for a loose fit
    value: 0.2
    units: mm
    applies: a starting point; more for nuts above M12; iterate for the printer
    source: hubs-3dp-threaded-fasteners
    status: read
    verified: 2026-10-31
    when: a nut embedded in a printed pocket, for a loose fit
    not_when: nuts above M12 may need more
    strictness: guideline
    wiggle: a starting point, iterated for the printer
    cost: small test prints, which save time and material against reprinting the part
  - id: fdm-self-tap-engagement-hubs
    process: fdm
    feature: thread
    quantity: thread engagement to size a self-tapping screw's pilot hole for
    min: 75
    max: 80
    units: percent
    applies: when the screw maker gives no pilot size; not for parts taken apart often
    source: hubs-3dp-threaded-fasteners
    status: read
    verified: 2026-10-31
    when: a self-tapping screw whose maker gives no pilot size; one-off assembly
    not_when: parts taken apart often take an insert or an embedded nut
    instead: [insert-hole]
    strictness: guideline
    wiggle: 75-80 % is a start; the screw maker's pilot governs
    cost: unstated

  - id: fdm-insert-hole-m3-nominal-cnckitchen
    process: fdm
    feature: insert
    quantity: nominal (as-built) hole diameter for CNC Kitchen's M3 heat-set insert
    value: 4.0
    units: mm
    applies: the hole as it comes out; drilled holes at 4.0 mm gave easy fitting and full strength, and pull-out
      falls sharply above 4.1–4.2 mm
    source: cnckitchen-heat-set-hole-size
    status: read
    verified: 2026-10-31
    cards: [insert-hole]
    when: a CNC Kitchen M3 insert in a hole drilled to size, or as a printed hole comes out
    not_when: another maker's insert takes its maker's hole [ref:epfl-inserts]
    instead: [fdm-insert-hole-cad-offset-cnckitchen]
    strictness: non-negotiable
    wiggle: small side only; pull-out falls sharply above 4.1-4.2 mm, and too small cracks the plastic [ref:spirol-hole]
    cost: drilling is a step after printing and may cut the printed walls [ref:spirol-3dp]
  - id: fdm-insert-hole-cad-offset-cnckitchen
    process: fdm
    feature: insert
    quantity: amount added to the nominal insert hole in CAD so it prints to size
    min: 0.2
    max: 0.3
    units: mm
    applies: small inserts; size so the insert pre-seats with slight resistance (M3 in PLA on one printer, 4.2 mm in
      CAD kept about 90 % of the highest pull-out force)
    source: cnckitchen-heat-set-hole-size
    status: read
    verified: 2026-10-31
    applied_by: [cadagent.mechanical.inserts.printed_hole, cadagent.manufacturing.fit_coupons]
    cards: [insert-hole]
    when: a printed hole for a small insert
    not_when: a hole drilled after printing takes the maker's hole
    instead: [fdm-insert-hole-m3-nominal-cnckitchen]
    strictness: guideline
    wiggle: 0.2-0.3 mm; each printer and filament shrinks holes differently, so your coupon governs
    cost: test prints until it is right [ref:spirol-3dp], or drill [ref:hubs-3dp-threaded-fasteners]
  - id: fdm-insert-blind-depth-cnckitchen
    process: fdm
    feature: insert
    quantity: extra depth of a blind insert hole beyond the insert's length
    value: 1.0
    units: mm
    applies: blind holes; through holes need be no longer than the insert. Holes straight, not tapered; normally no
      chamfer
    source: cnckitchen-heat-set-tips
    status: read
    verified: 2026-10-31
    cards: [insert-hole]
    when: a blind hole
    not_when: a through hole need be no longer than the insert
    strictness: non-negotiable
    wiggle: deeper than the insert so it never bottoms [ref:covestro-joining]; by how much is free, two thread pitches at
      SPIROL [ref:spirol-inserts]
    cost: unstated
  - id: fdm-insert-iron-temp-cnckitchen
    process: fdm
    feature: insert
    quantity: soldering-iron temperature above the printing temperature
    min: 10
    max: 20
    units: degC
    applies: melt in about 90 % of the way, press the rest flush with a tool; resin parts glue the insert instead
    source: cnckitchen-heat-set-tips
    status: read
    verified: 2026-10-31
    cards: [insert-install]
    when: heat-setting into a printed thermoplastic
    not_when: a resin (SLA) part takes the insert glued in [ref:formlabs-inserts]
    strictness: guideline
    wiggle: 10-20 degC; SPIROL heats to the plastic's heat-deflection temperature + 150 degF, which it prints as
      65 degC; as a rise 150 degF is 83 K [ref:spirol-3dp]
    cost: unstated
  - id: fdm-hole-undersize-cnckitchen-2019
    process: fdm
    feature: hole
    quantity: how much smaller a printed hole came out than designed
    value: 0.1
    units: mm
    applies: one measurement (an Original Prusa, Prusament, strips of 4-5 mm holes in 0.1 mm steps gauged with drill
      bits); STL triangulation and the filament's shrinkage are among the causes
    source: cnck-2019
    status: read
    verified: 2026-11-04
    note: CNC Kitchen measured 0.1 mm in 2019 and 0.25 mm in 2026 (fdm-hole-undersize-cnckitchen) on two printers and
      filaments. The range is kept; the insert hole takes 2026's, the one its pull-out tests sized, and a coupon on
      your printer and filament governs both
    applied_by: [cadagent.mechanical.inserts.printed_hole]
    cards: [printed-hole]
    when: the low end of the published undersize, reported beside 2026's
    not_when: a coupon's measured undersize governs
    instead: [fdm-hole-undersize-cnckitchen]
    strictness: guideline
    wiggle: 2026's 0.25 mm, on another printer and filament, is the high end
    cost: unstated
  - id: fdm-insert-hole-filler-spirol
    process: fdm
    feature: insert
    quantity: increase of the maker's insert hole for a glass- or mineral-filled plastic
    min: 0.08
    max: 0.15
    units: mm
    applies: SPIROL, heat or ultrasonic inserts; 0.08 mm at 15 % filler or more, 0.15 mm at 35 % or more, interpolated
      between, none under 15 %. Written for moulded plastics; a fibre-filled filament takes it by extension, and its
      coupon governs
    source: spirol-how-to-design-the-proper-hole-for-heat-ultrasonic
    status: read
    verified: 2026-11-04
    applied_by: [cadagent.mechanical.inserts.printed_hole, cadagent.mechanical.inserts.filler_increase]
    cards: [insert-hole]
    materials: [petg-cf, pa-cf]
    when: glass- or mineral-filled plastic, 15 % filler or more; a fibre filament by extension
    not_when: under 15 % filler, no increase
    strictness: guideline
    wiggle: interpolate between 15 and 35 %; a filament's coupon governs
    cost: unstated
  - id: fdm-insert-wall-perimeters-lulzbot
    process: fdm
    feature: insert
    quantity: perimeters round a heat-set insert's hole, the wall a whole number of extrusion widths
    min: 2
    units: count
    applies: LulzBot; more perimeters hold more
    source: lulzbot-tips-and-tricks-heat-set-inserts
    status: read
    verified: 2026-11-04
    note: Sources differ on the count. LulzBot asks two or more, SPIROL at least the metric size (M3 three, M6 six,
      the only count with pull-out tests behind it, so it governs) and Stratasys's slicer four to six
      (fdm-insert-contours-padt)
    applied_by: [cadagent.mechanical.inserts.perimeter_counts]
    cards: [insert-boss]
    when: LulzBot's floor, with no tested count to hand
    not_when: SPIROL's tested count governs
    instead: [fdm-insert-wall-perimeters-spirol]
    strictness: guideline
    wiggle: more perimeters hold more
    cost: unstated
  - id: fdm-insert-contours-padt
    process: fdm
    feature: insert
    quantity: contours (perimeters) round each insert hole, Stratasys Insight's recommendation
    min: 4
    max: 6
    units: count
    applies: Stratasys FDM, as PADT reports it; GrabCAD Print sizes the hole and sets the contours itself
    source: padt-adding-inserts-to-3d-printed-parts-hardware-tips
    status: read
    verified: 2026-11-04
    applied_by: [cadagent.mechanical.inserts.perimeter_counts]
    cards: [insert-boss]
    when: Stratasys FDM through GrabCAD Print, which sets the contours itself
    not_when: other slicers take SPIROL's tested count
    instead: [fdm-insert-wall-perimeters-spirol]
    strictness: guideline
    wiggle: unstated
    cost: unstated

  - id: fdm-hole-arc-floor-reprap
    process: fdm
    feature: hole
    quantity: least diameter to draw a hole that should print at D with tracks `track` wide
    min: "sqrt(D*D + track*track)"
    units: mm
    applies: the RepRap arc balance (a track bent round a hole, pi r t = pi (r^2 - R^2)) solved for the drawn hole. A
      floor; Nophead found real tracks shrink a hole more, so it binds only for a wide track in a small hole
    source: reprap-arc-compensation
    status: read
    verified: 2026-11-04
    applied_by: [cadagent.mechanical.inserts.printed_hole]
    cards: [printed-hole]
    when: a wide track in a small hole
    not_when: elsewhere the measured undersize is larger and governs
    strictness: unstated
    wiggle: a floor, not a size; real tracks shrink a hole more [ref:nophead-polyholes]
    cost: unstated
  - id: fdm-hole-facets-nophead
    process: fdm
    feature: hole
    quantity: diameter to draw a circle of `facets` sides so its flats land on a hole of D
    value: "D / cos(pi / facets)"
    units: mm
    applies: any meshed hole (STL export, OpenSCAD $fn); the flats sit D (1 - cos(pi/n)) inside the circle, 5 % at 10
      sides and 1 % at 22. Nophead's polyhole, max(round(2 D), 3) sides, is reported beside it, untested with inserts
    source: nophead-polyholes
    status: read
    verified: 2026-11-04
    applied_by: [cadagent.mechanical.inserts.printed_hole]
    cards: [printed-hole]
    when: a hole exported as a mesh (STL, OpenSCAD $fn)
    not_when: unstated
    strictness: unstated
    wiggle: the flats sit 5 % inside at 10 sides, 1 % at 22
    cost: unstated
  - id: fdm-insert-wall-perimeters-spirol
    process: fdm
    feature: insert
    quantity: perimeters round a heat-set insert's hole, at least its metric size (D, whole perimeters)
    min: "D"
    units: count
    applies: SPIROL's printed pull-out tests against wall loops (Figures 8 and 9, M3 and M6). It governs LulzBot's two
      or more and Stratasys's four to six, which have no tests behind them
    source: spirol-3dp
    status: read
    verified: 2026-11-04
    applied_by: [cadagent.mechanical.inserts.perimeter_counts]
    cards: [insert-boss]
    when: a printed boss round a heat-set insert
    not_when: unstated
    strictness: guideline
    wiggle: fewer loops hold less (pull-out and torque-out); boss at least 1.5 x the knurl, full performance from 2 x
    cost: unstated
  - id: fdm-insert-infill-min-spirol
    process: fdm
    feature: insert
    quantity: infill density round a heat-set insert, for its optimal performance
    min: 50
    units: percent
    applies: SPIROL's FDM tests; performance rises linearly with infill, and its figures were tested at 55 % infill
      and 5 wall loops
    source: spirol-3dp
    status: read
    verified: 2026-11-05
    cards: [insert-boss]
    when: an FDM part that takes a heat-set insert
    not_when: unstated
    strictness: guideline
    wiggle: "less infill holds less (SPIROL: linear in infill)"
    cost: unstated

