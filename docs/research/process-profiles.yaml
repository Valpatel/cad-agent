cards:
  insert-hole: the hole a heat-set insert goes in (draw it with printed-hole)
  printed-hole: drawing a hole so it prints to size (undersize, track and mesh)
  insert-boss: the printed boss round a heat-set insert
  insert-install: setting a heat-set insert with an iron
  snap-clip: printed snap and clip clearances

# Decision tables: cadagent.manufacturing.cards evaluates them, rows in order, the first whose `if` holds wins, and
# the last row has no `if`. Each reason carries [ref:<id>] tags (read records) or names what computes it (`by`);
# a branch no source covers says so in `gap`. Text in braces is filled from the inputs and the computed facts.
decisions:
  - id: joining
    question: how to join two parts with a thread, a fastener or a feature
    inputs:
      process: {choices: [fdm, sls, mjf, injection-moulding, sla, sheet-metal], default: fdm}
      material: {help: "the part's material: an fdm family or filament key, or a sheet alloy"}
      load: {units: N, required: true, help: "service load on one joint along its axis (pull-out); 0 if it only holds
          parts closed (no default: assuming 0 would choose a clip)"}
      cycles: {units: count, default: 1, help: times the joint is assembled over its life (1 is once)}
      qty: {units: count, default: 1, help: parts made}
    facts:
      insert_fits:
        by: cadagent.manufacturing.cards.insert_for_load
        from: [process, material, load]
        help: the smallest catalogued heat-set insert whose low pull-out, over the kit's margin, carries the load in
          the weakest data sheet of the material's family (fdm only; none elsewhere, where no calibrated model is)
    unused:
      qty: no registry source ties the joining choice to quantity; SPIROL only suggests installation machines for
        volume production [ref:spirol-3dp]
    options:
      heat-set-insert: {name: heat-set insert, cards: [insert-hole, insert-boss, insert-install]}
      glued-insert: {name: "threaded insert, glued in (CA or epoxy) or pressed in cold", cards: [insert-hole, insert-boss]}
      thread-forming-screw: {name: thread-forming screw into the plastic, cards: [thread]}
      through-bolt-nut: {name: through-bolt and nut, cards: [thread], check: inserts}
      pem: {name: PEM self-clinching nut or stud, cards: [clinch-hardware]}
      snap-clip: {name: snap or compliant clip, cards: [snap-clip], check: snapfit}
    rows:
      - id: sheet
        if: {process: [sheet-metal]}
        choose: pem
        because:
          - the sheet flows into the clinched part's undercut and locks it [ref:pem-handbook], so the thread is fixed
            in the sheet, where a through-bolt needs a loose nut held on the far side
          - "check: the sheet softer than the fastener by about 20 HRB, the hole +0.08/-0 mm, the press reaching both
            faces [ref:pem-handbook]"
        rules: [sm-clinch-hardness-margin-pem, sm-clinch-hole-tolerance-pem, sm-clinch-sheet-min-pem]
        runner_up: through-bolt-nut
        wins_when: unstated
        gap: no registry source ranks a PEM against a loose nut and bolt in sheet; the runner-up is listed, not ranked.
          The load is not checked here; cadagent.mechanical.clinch.check_placement compares push-out, torque and
          pull-through loads with PEM's ratings
      - id: resin
        if: {process: [sla]}
        choose: glued-insert
        because:
          - in resin the insert is glued in with CA glue or epoxy
            [ref:formlabs-inserts]; thermosets take inserts cold, pressed
            in [ref:spirol-3dp]
          - brittle resins may crack with self-tapping screws [ref:formlabs-inserts]
        runner_up: through-bolt-nut
        wins_when: unstated
        gap: no registry source compares a glued insert with a through-bolt in resin, nor gives a glued insert's
          pull-out, so the load is not checked here
      - id: clip-once
        if: {load: {max: 0}, cycles: {max: 1}}
        choose: snap-clip
        because:
          - a clip is designed into the parts, simple and economical, and may eliminate metal fasteners
            [ref:covestro-joining]
          - most plastics take a snap fit, particularly for one-time assembly [ref:covestro-joining]
        runner_up: thread-forming-screw
        wins_when: the joint must carry a load the clip cannot; size the clip with `cad-agent snapfit` first
        gap: no registry source gives a load a clip cannot take in general; it depends on the clip's geometry
      - id: clip-repeated
        if: {load: {max: 0}, cycles: {min: 2}}
        choose: snap-clip
        because:
          - a clip allows easy disassembly [ref:covestro-joining]; for repeated assembly design it to a lower strain,
            60 % of the one-time allowable [ref:covestro-snapfit]
        runner_up: heat-set-insert
        wins_when: the joint must carry a load the clip cannot; parts disassembled regularly take metal inserts
          [ref:covestro-joining]
        gap: no registry source gives a load a clip cannot take in general; it depends on the clip's geometry
      - id: too-heavy
        if: {insert_fits: false}
        choose: through-bolt-nut
        because:
          - "{insert_fits.why}"
          - washers under both the head and the nut spread the load on the plastic [ref:covestro-joining]
        by: [cadagent.mechanical.inserts.capacity]
        runner_up: heat-set-insert
        wins_when: the load splits over several inserts, each within its capacity
        gap: the bolt's bearing on the plastic is not checked here; run `cad-agent inserts` (check_clamp) on the joint
      - id: repeated
        if: {cycles: {min: 2}}
        needs: [insert_fits]
        choose: heat-set-insert
        because:
          - "{cycles} assemblies: self-tapping screws are a one-off method, not for repeated disassembly
            [ref:hubs-3dp-threaded-fasteners]; parts disassembled regularly take metal inserts [ref:covestro-joining]"
          - "{insert_fits.why}"
        by: [cadagent.mechanical.inserts.capacity]
        runner_up: thread-forming-screw
        wins_when: the joint is re-assembled only a few times, each time with the screw put back by hand into its own
          thread [ref:covestro-screws]
        gap: no registry source puts a number on 'a few' re-assemblies [ref:covestro-screws]; this table takes an
          insert from the second assembly, the cautious reading
      - id: once
        needs: [insert_fits]
        choose: thread-forming-screw
        because:
          - assembled once, a self-tapping screw is a quick one-off method [ref:hubs-3dp-threaded-fasteners];
            forming generally suits thermoplastics, cutting thermosets [ref:bossard-fastening-technology-self-tapping-screws-for-plastic]
          - an M3 screw driven straight into a print pulled out about as hard as a heat-set insert (about 120 kg)
            [ref:embedded-inserts]
        rules: [fdm-self-tap-engagement-hubs, fdm-thread-wall-min-hubs]
        runner_up: heat-set-insert
        wins_when: the joint will be re-assembled, or must take torque; the insert was best in torque-out (3 N m)
          [ref:embedded-inserts]
        gap: "the screw's own pull-out is not computed: the insert's capacity ({insert_fits.allowed_n} N allowed) stands in, on
          one M3 test where screw and insert pulled out alike at about 120 kg, with no margin [ref:embedded-inserts];
          test the screw in your material. Bossard provides no printed-joint capacity or wall dimension
          [ref:bossard-fastening-technology-self-tapping-screws-for-plastic]"

