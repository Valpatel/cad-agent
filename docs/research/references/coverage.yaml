wanted:
- group: print
  title: 3D printing
  areas:
  - 3d-printing
  text: No independent strength data on print orientation or anisotropy surfaced, no Prusa or Bambu tolerance or hole tables,
    and nothing PETG-specific. Fictiv, Hubs, Shapeways and 3DXTech gave no guide of their own.
- group: sheet
  title: Sheet metal and laser
  areas:
  - sheet-metal
  - laser-cutting
  text: No Hubs, Big Blue Saw, Komacut or Approved Sheet Metal page surfaced, and no standard-gauge chart. PEM design guidance,
    weldments and finishing are thin. SendCutSend and OSH Cut fix the 6061-T6 bend radius per thickness.
- group: cnc
  title: CNC machining
  areas:
  - cnc-machining
  text: 'No primary tolerance-cost data: seller-blog multipliers of 3x to 10x conflict, so they were left out. No free primary
    ASME Y14.5 primer or 6061 vs 7075 guide.'
- group: mould
  title: Moulding and casting
  areas:
  - mould-design
  - mould-making
  text: No Hubs injection guide, and nothing on PA6-CF, gate sizing or casting. The Xometry break-even page is title-only.
    Formlabs has the only worked cost model.
- group: inserts
  title: Inserts and fasteners
  areas:
  - fasteners-and-hardware
  text: No readable PEM push-out or torque-out tables, no Ruthex datasheet or Voron docs, and nothing on press-fits into plastic
    hubs or adhesives on 6061 or PA6-CF.
- group: pcb
  title: PCB and electronics
  areas:
  - circuit-boards
  text: JLCPCB's own capability page never surfaced; its numbers came from third parties and conflict.
- group: winding
  title: Motor winding
  areas:
  - motor-mounts
  text: No winding or motor-build guides were searched. Open projects here are thin and mostly unmeasured.
- group: general
  title: General DFM
  areas:
  - design-process
  text: No real open-source printability or DFM analyser turned up. No toy-safety (UL 2054) entry and no Ashby or MatWeb values.
