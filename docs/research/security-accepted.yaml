- check: npm-install-script
  subject: npm:esbuild
  fp: 30e8057fdbba6aa6
  reason: >-
    Maintainer-only tools/mermaid compiler 0.28.2, not a production-site dependency. Its complete install.js was read
    on 2026-11-07 (#322), SHA256 612294e278914443bdcf81cb17f54afec34dbdd2ebd999a6ee187912320cc315: it validates or
    downloads/installs a platform executable and can rewrite its wrapper. The dedicated context and provenance CI
    use npm ci --ignore-scripts, so this hook is not executed. The producer resolves the installed exact optional
    platform binary and verifies its SHA256 against the pinned esbuild package's binaryHashes before execution;
    missing/mismatched input fails instead of invoking the hook. This fingerprint includes tools/mermaid/package.json and covers only 0.28.2's known hook,
    not an advisory, registry drift, a future hook or another context that runs install scripts.
  accepted: 2026-11-07

- check: npm-install-script
  subject: npm:esbuild
  fp: e002f7ae48e41d8e
  reason: >-
    SCADA maintenance tests use the exact tools/webkit/scada esbuild 0.25.12 package to check bundled module
    dependency boundaries; neither the deployed runtime nor the Python wheel includes this tool dependency.
    Its complete install.js was read on 2026-11-14, SHA256
    10f6fa3644d8d23d066ff67b0ae449074e75884503546a9fedb667f1dcb9ade2, and compared with the npm archive
    verified against the committed SHA512 integrity. The hook can install or download a platform executable,
    execute its version probe and rewrite the wrapper. SCADA CI and documented maintenance installs use
    npm ci --ignore-scripts; a clean such install successfully bundled an ESM input using the exact optional
    platform package already covered by the lock. This accepts only that unexecuted install hook at this
    version and owning manifest, not advisories, integrity failures, other contexts or future scripts.
  accepted: 2026-11-14

- check: npm-install-script
  subject: npm:fsevents
  fp: 0cf2576d5c5533dc
  reason: >-
    Optional, macOS-only dependency of Playwright (os: darwin), so CI and Linux machines never install it. Read on
    2026-11-01 (#151): the registry's manifest for 2.3.2 lists install "node-gyp rebuild" (gypfile), but the tarball
    the lockfile pins (its sha512 matches) has no binding.gyp and its package.json has no install script; it ships a
    prebuilt fsevents.node, so npm runs nothing at install. The fingerprint is 2.3.2's: when Playwright moves to
    another fsevents, the finding comes back to be read again.
  accepted: 2026-11-01

