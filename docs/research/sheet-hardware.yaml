# Bought hardware for bent sheet-metal parts: self-clinching (PEM) nuts, studs and standoffs, and blind rivets, with
# dated prices and where to buy them (#283). The layout is cad-agent's part catalogue
# (cadagent.simulation.explore.catalogue): one item per orderable part number. cadagent.mechanical.sheet_hardware
# reads it and joins each item to the part it checks (`part`: a key of cadagent.mechanical.clinch.PARTS or
# cadagent.mechanical.rivets.RIVETS).
#
# Every number is a dated fact read from a public page, cited by `reference` (an id in docs/research/references.yaml) and
# its URL. No vendor text, table or file is copied. No account was used and nothing was bought.
#   price_usd        the seller's price for one piece (pack_qty pieces for a pack) at its smallest quantity break
#   price_checked    the day it was read; prices change without notice, so re-read before a buy
#   specs.price_usd_1000  the 1000-4999 break (Bossard), specs.stock the stock count shown that day
#   installed        what a shop charges to press the part in, from its ordering feed (SendCutSend's
#                    sendcutsend-catalog.json): shop, sku, price_usd, the feed's generated date and the day it was
#                    read (checked); whether that includes the part is not stated
#   mass_g           null: not read
# Only parts the checks know are listed (FH studs in M3-M6; no inch FH rows yet).
# The table in docs/research/manufacturing/sheet-metal-joining.md §4 and §9 explains which of these are the common, cheap choices.

