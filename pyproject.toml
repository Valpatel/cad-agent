[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-agent"
version = "0.4.0"
description = "CAD design verification and review reports for 3D-printed parts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pyyaml", "numpy"]

[project.optional-dependencies]
cad = [
    "cadquery>=2.4",
    "trimesh>=4.0",
    "vtk>=9.2",
    "matplotlib>=3.7",
    "pillow>=10.0",
    "numpy",
]
robot = ["mujoco>=3"]
# airflow/heat case writing, topology optimisation, pictures and animations (OpenFOAM and Bambu Studio are external programs)
sim = ["trimesh>=4.0", "manifold3d>=2.4", "rtree>=1.0", "pyvista>=0.44", "imageio>=2.30", "imageio-ffmpeg>=0.5",
       "pymoto>=2.0", "matplotlib>=3.7", "pillow>=10.0", "scipy>=1.10"]
site = ["markdown>=3.5"]
fea = ["gmsh>=4.11", "scikit-fem>=9", "matplotlib>=3.7", "pypardiso>=0.4", "pyamg>=5"]
explore = ["optuna>=3.4"]
dev = ["pytest"]

[project.scripts]
cad-agent = "cadagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cadagent = ["webkit/*", "webkit/vendor/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
