      2026-10-31: the live page answers scripts with HTTP 429, so read the Internet Archive copy of 2026-03-07
      (web.archive.org/web/20260307153318/…). Byline "Written by Dean McClements, Updated by Aaron Lichtig";
      published 2020-09-29, updated 2024-08-13. Read the 0.02–0.05 in added to the tool radius.

  - id: harvey-tool-long-reach
    title: "Miniature End Mills - Square - Long Reach, Standard Flute / Long Flute"
    authors: []
    org: Harvey Tool
    year: null
    url: https://www.harveytool.com/products/miniature-end-mills---square---long-reach-standard-flute
    access: free
    terms: cited and summarised, never copied
    areas: [cnc]
    used_for: [research/process-profiles.md, research/process-profiles.yaml]
    verified: >-
      2026-10-31: opened the two product pages (standard flute here; long flute at
      …/miniature-end-mills---square---long-reach-long-flute); read the description bullets (length of cut 3 × D,
      and at least 5 × D for the long-flute tools). The size tables load with script and were not read.

# Formulas the rules rely on (not limits).
formulas:
  - id: sm-bend-allowance
    expr: "pi*(R + K*T)*A/180"
    gives: bend allowance, the arc length of the neutral sheet (mm)
    variables: {R: inside bend radius (mm), K: K-factor, T: thickness (mm), A: bend angle (deg)}
    source: solidworks-k-factor
    verified: 2026-10-31

rules:

  # ================================================================== FDM
  # Orientation and anisotropy: the numbers are in research/compliant-mechanisms.md §5–6 (dataset fdm-anisotropy-tds)
  # and are not repeated here. Across the layers, strength is 0.40–0.90 of in-plane and strain to failure 0.10–0.61.

  - id: fdm-orientation-z-strength-ratio-tds
    process: fdm
    feature: orientation
    quantity: strength across the layers (Z) as a fraction of in-plane (XY), PLA, PETG, ASA and CoPA data sheets
    min: 0.40
    max: 0.90
    units: ratio
    applies: 100 % infill tensile bars; the per-material rows are in compliant-mechanisms.md §5
    source: dataset:fdm-anisotropy-tds
    status: read
    verified: 2026-10-31
  - id: fdm-orientation-z-strain-ratio-tds
    process: fdm
    feature: orientation
    quantity: strain to failure across the layers (Z) as a fraction of in-plane (XY), same data sheets
    min: 0.10
    max: 0.61
    units: ratio
    applies: 100 % infill tensile bars; strain falls much more than strength, so flexing features lie in XY
    source: dataset:fdm-anisotropy-tds
    status: read
    verified: 2026-10-31

  - id: fdm-overhang-max-hubs
    process: fdm
    feature: overhang
    compare: overhang-max
    quantity: steepest overhang printed without support, from vertical
    max: 45
    units: deg
    applies: most materials; above it, add support and expect marks on the supported face
    source: hubs-fdm-design
    status: read
    verified: 2026-10-31
  - id: fdm-overhang-max-prusa
    process: fdm
    feature: overhang
    compare: overhang-max
    quantity: steepest overhang printed cleanly without support, from vertical
    min: 45
    max: 60
    units: deg
    applies: 0.4 mm nozzle, depending on settings; smaller nozzles (0.25 mm) may manage less than 45°
    source: prusa-modeling-for-3dp
    status: read
    verified: 2026-10-31
  - id: fdm-overhang-max-prusa-360-cooling
    process: fdm
    feature: overhang
    compare: overhang-max
    quantity: steepest overhang printed without support, from vertical
    max: 75
    units: deg
    applies: Prusa printers with the Nextruder and 360° part cooling (MK4S, CORE One family), per Prusa
    source: prusa-modeling-for-3dp
    status: read
    verified: 2026-10-31
  - id: fdm-overhang-max-xometry-eu
    process: fdm
    feature: overhang
    compare: overhang-max
    quantity: steepest overhang without support, from vertical
    max: 45
    units: deg
    applies: Xometry Europe's FDM service; chamfer or round the edge so it prints
    source: xometry-eu-fdm-design-tips
    status: read
    verified: 2026-10-31

  - id: fdm-bridge-max-hubs
    process: fdm
    feature: bridge
    compare: bridge-max
    quantity: longest bridge without visible sag or support marks
    max: 5
    units: mm
    applies: horizontal bridges and roofs; longer ones sag or need support, or split the part
    source: hubs-fdm-design
    status: read
    verified: 2026-10-31
  - id: fdm-bridge-max-xometry-eu
    process: fdm
    feature: bridge
    compare: bridge-max
    quantity: bridge length above which support or a design change may be needed
    max: 5
    units: mm
    applies: Xometry Europe's FDM service
    source: xometry-eu-fdm-design-tips
    status: read
    verified: 2026-10-31

  - id: fdm-wall-min-hubs
    process: fdm
    feature: wall
    compare: min-wall
    quantity: recommended minimum wall thickness
    min: 0.8
    units: mm
    applies: any FDM printer in the Protolabs Network
    source: hubs-3dp-geometry-limits
    status: read
    verified: 2026-10-31
  - id: fdm-wall-min-prusa
    process: fdm
    feature: wall
    compare: min-wall
    variant: one perimeter
    quantity: thinnest printable wall, one perimeter
    min: 0.45
    units: mm
    applies: 0.4 mm nozzle in PrusaSlicer (0.45 mm extrusion width); walls come in whole perimeters (2 = 0.9 mm,
      3 = 1.35 mm, 4 = 1.8 mm), and a wall thinner than one perimeter does not print
    source: prusa-modeling-for-3dp
    status: read
    verified: 2026-10-31
  - id: fdm-wall-min-xometry-eu
    process: fdm
    feature: wall
    compare: min-wall
    variant: supported–unsupported
    quantity: minimum wall thickness
    min: 0.75
    max: 1.0
    units: mm
    applies: Xometry Europe; 0.75 mm where the wall is supported, 1.0 mm unsupported; or three nozzle diameters
    source: xometry-eu-fdm-design-tips
    status: read
    verified: 2026-10-31
  - id: fdm-wall-min-nozzle-xometry-eu
    process: fdm
    feature: wall
    quantity: minimum wall thickness as a multiple of the nozzle
    min: "3*nozzle"
    units: mm
    applies: Xometry Europe's alternative to the absolute 0.75–1.0 mm
    source: xometry-eu-fdm-design-tips
    status: read
    verified: 2026-10-31
  - id: fdm-wall-min-xometry-us
    process: fdm
    feature: wall
    compare: min-wall
    variant: supporting wall
    quantity: minimum thickness of a supporting wall
    min: 1.2
    max: 1.5
    units: mm
    applies: Xometry (US) FDM service, industrial printers; the guide gives 0.047–0.06 in
    as_printed: 0.047–0.06 in
    source: xometry-fdm-mini-guide
    status: read
    verified: 2026-10-31

  - id: fdm-hole-min-xometry-us
    process: fdm
    feature: hole
    compare: min-hole
    quantity: smallest hole diameter that stays round
    min: 1.0
    units: mm
    applies: Xometry (US); holes print best with their axis vertical (in the XY plane); critical through holes may be
      drilled after printing
    as_printed: 0.04 in
    source: xometry-fdm-mini-guide
    status: read
    verified: 2026-10-31
  - id: fdm-hole-undersize-cnckitchen
    process: fdm
    feature: hole
    quantity: how much smaller a printed hole came out than designed
    value: 0.25
    units: mm
    applies: one measurement (Prusa CORE One L, PolySonic PLA, M3 insert holes); every printer and material differs,
      so print a test coupon. Protolabs Network also says vertical holes print undersize and to drill critical ones
    source: cnckitchen-heat-set-hole-size
    status: read
    verified: 2026-10-31

  - id: fdm-elephant-foot-compensation-prusa
    process: fdm
    feature: elephant-foot
    quantity: first-layer inset (elephant-foot compensation) in the slicer
    value: 0.2
    units: mm
    applies: 0.4 mm nozzle in PrusaSlicer; on by default in Prusa's own profiles
    source: prusa-elephant-foot
    status: read
    verified: 2026-10-31
  - id: fdm-elephant-foot-chamfer-hubs
    process: fdm
    feature: elephant-foot
    quantity: chamfer angle (or a radius) on edges touching the build plate, where fit or overall size matters
    value: 45
    units: deg
    applies: any FDM part whose bottom edges must assemble; also eases removal from the plate. Prusa prefers a chamfer
      to a fillet on edges facing the bed
    source: hubs-fdm-design
    status: read
    verified: 2026-10-31

  - id: fdm-corner-radius-hubs
    process: fdm
    feature: corner
    quantity: smallest outside corner or edge radius the nozzle leaves
    value: "nozzle"
    units: mm
    applies: corners in the layer plane are never sharp
    source: hubs-fdm-design
    status: read
    verified: 2026-10-31

  - id: fdm-pin-min-hubs
    process: fdm
    feature: pin
    compare: min-pin
    quantity: vertical pin diameter below which the pin is perimeters only and weakly joined
    min: 5
    units: mm
    applies: smaller pins need a fillet at the base, or a hole and a bought pin
    source: hubs-fdm-design
    status: read
    verified: 2026-10-31
  - id: fdm-pin-min-xometry-eu
    process: fdm
    feature: pin
    compare: min-pin
    quantity: minimum pin diameter (keep it short)
    min: 1.0
    units: mm
    applies: Xometry Europe; columns 2–3 mm minimum
    source: xometry-eu-fdm-design-tips
    status: read
    verified: 2026-10-31

  - id: fdm-clearance-snap-hubs
    process: fdm
    feature: clearance
    compare: clearance-fit
    quantity: nominal clearance between mating parts (snap fits)
    value: 0.5
    units: mm
    applies: Protolabs Network FDM
    source: hubs-snapfit-3dp
    status: read
    verified: 2026-10-31
  - id: fdm-clearance-moving-prusa
    process: fdm
    feature: clearance
    compare: clearance-fit
    quantity: starting clearance for parts that move (hinges) or snap
    min: 0.3
    units: mm
    applies: Original Prusa printers, which Prusa says are accurate to at least 0.2 mm; test-print and adjust
    source: prusa-modeling-for-3dp
    status: read
    verified: 2026-10-31
  - id: fdm-clearance-sliding-xometry-eu
    process: fdm
    feature: clearance
    compare: clearance-fit
    quantity: clearance for a sliding fit
    min: 0.2
    max: 0.3
    units: mm
    applies: Xometry Europe; print mating faces vertical. The same page gives 0.5 mm "for an interference fit", which
      reads as a slip in the source (a clearance cannot make an interference fit), so it is not used here
    source: xometry-eu-fdm-design-tips
    status: read
    verified: 2026-10-31

  - id: fdm-tolerance-desktop-hubs
    process: fdm
    feature: tolerance
    compare: tolerance
    quantity: expected tolerance (±) on a dimension L
    value: "max(0.005*L, 0.5)"
    units: mm
    applies: desktop (prototyping) FDM; ±0.5 % with a lower limit of ±0.5 mm
    source: hubs-3dp-dimensional-accuracy
    status: read
    verified: 2026-10-31
  - id: fdm-tolerance-industrial-hubs
    process: fdm
    feature: tolerance
    compare: tolerance
    quantity: expected tolerance (±) on a dimension L
    value: "max(0.0015*L, 0.2)"
    units: mm
    applies: industrial FDM; ±0.15 % with a lower limit of ±0.2 mm
    source: hubs-3dp-dimensional-accuracy
    status: read
    verified: 2026-10-31
  - id: fdm-tolerance-xometry-eu
    process: fdm
    feature: tolerance
    compare: tolerance
    quantity: general tolerance (±) on a dimension L
    value: "max(0.005*L, 0.5)"
    units: mm
    applies: >-
      Xometry Europe's FDM service, standard and industrial machines (up to 900 × 600 × 900 mm); the specification
      table prints ±0.5 % (±0.5 mm), read here as 0.5 % with a 0.5 mm floor. The page states no floor and no
      "whichever is greater"; the floor is this file's reading
    source: xometry-eu-fdm-design-tips
    as_printed: ±0.5% (±0.5 mm)
    status: read
    verified: 2026-10-31
  - id: fdm-tolerance-xometry-us
    process: fdm
    feature: tolerance
    compare: tolerance
    quantity: tolerance (±) Xometry says its FDM service holds
    value: 0.127
    units: mm
    applies: Xometry (US) industrial FDM; ±0.005 in, with no size dependence stated
    as_printed: ±0.005 in
    source: xometry-fdm-mini-guide
    status: read
    verified: 2026-10-31
  - id: fdm-shrinkage-hubs
    process: fdm
    feature: shrinkage
    quantity: typical shrinkage
    min: 0.2
    max: 1.0
    units: percent
    applies: depends on the material; high-temperature materials warp more (add a bottom radius or a brim)
    source: hubs-3dp-dimensional-accuracy
    status: read
    verified: 2026-10-31

  - id: fdm-thread-printed-min-hubs
    process: fdm
    feature: thread
    quantity: smallest thread worth printing
    min: 5
    units: mm
    applies: printed threads in FDM; below M5 use an insert, a tapped hole or a self-tapping screw
    as_printed: M5
    source: hubs-3dp-threaded-fasteners
    status: read
    verified: 2026-10-31
  - id: fdm-thread-wall-min-hubs
    process: fdm
    feature: thread
    quantity: wall around a threaded hole or insert
    min: "D"
    units: mm
    applies: rule of thumb, D is the fastener's nominal diameter (an M5 needs 5 mm of wall)
    source: hubs-3dp-threaded-fasteners
    status: read
    verified: 2026-10-31
  - id: fdm-nut-pocket-clearance-hubs
    process: fdm
    feature: thread
    quantity: total offset around an embedded nut (0.1 mm per side) for a loose fit
    value: 0.2
    units: mm
    applies: a starting point; more for nuts above M12; iterate for the printer
    source: hubs-3dp-threaded-fasteners
    status: read
    verified: 2026-10-31
  - id: fdm-self-tap-engagement-hubs
    process: fdm
    feature: thread
    quantity: thread engagement to size a self-tapping screw's pilot hole for
    min: 75
    max: 80
    units: percent
    applies: when the screw maker gives no pilot size; not for parts taken apart often
    source: hubs-3dp-threaded-fasteners
    status: read
    verified: 2026-10-31

  - id: fdm-insert-hole-m3-nominal-cnckitchen
    process: fdm
    feature: insert
    quantity: nominal (as-built) hole diameter for CNC Kitchen's M3 heat-set insert
    value: 4.0
    units: mm
    applies: the hole as it comes out; drilled holes at 4.0 mm gave easy fitting and full strength, and pull-out
      falls sharply above 4.1–4.2 mm
    source: cnckitchen-heat-set-hole-size
    status: read
    verified: 2026-10-31
  - id: fdm-insert-hole-cad-offset-cnckitchen
    process: fdm
    feature: insert
    quantity: amount added to the nominal insert hole in CAD so it prints to size
    min: 0.2
    max: 0.3
    units: mm
    applies: small inserts; size so the insert pre-seats with slight resistance (M3 in PLA on one printer, 4.2 mm in
      CAD kept about 90 % of the highest pull-out force)
    source: cnckitchen-heat-set-hole-size
    status: read
    verified: 2026-10-31
  - id: fdm-insert-blind-depth-cnckitchen
    process: fdm
    feature: insert
    quantity: extra depth of a blind insert hole beyond the insert's length
    value: 1.0
    units: mm
    applies: blind holes; through holes need be no longer than the insert. Holes straight, not tapered; normally no
      chamfer
    source: cnckitchen-heat-set-tips
    status: read
    verified: 2026-10-31
  - id: fdm-insert-iron-temp-cnckitchen
    process: fdm
    feature: insert
    quantity: soldering-iron temperature above the printing temperature
    min: 10
    max: 20
    units: degC
    applies: melt in about 90 % of the way, press the rest flush with a tool; resin parts glue the insert instead
    source: cnckitchen-heat-set-tips
    status: read
    verified: 2026-10-31

  - id: fdm-emboss-text-xometry-eu
    process: fdm
    feature: text
    quantity: embossed text stroke width (height 0.5 mm)
    min: 0.8
    units: mm
    applies: Xometry Europe; text on top faces reads best
    source: xometry-eu-fdm-design-tips
    status: read
    verified: 2026-10-31
  - id: fdm-engrave-text-xometry-eu
    process: fdm
    feature: text
    quantity: engraved text stroke width (depth 0.5 mm)
    min: 1.0
    units: mm
    applies: Xometry Europe
    source: xometry-eu-fdm-design-tips
    status: read
    verified: 2026-10-31
  - id: fdm-rib-min-xometry-us
    process: fdm
    feature: rib
    quantity: minimum rib thickness
    min: 1.5
    units: mm
    applies: Xometry (US); several extrusions inside each rib
    as_printed: 0.06 in
    source: xometry-fdm-mini-guide
    status: read
    verified: 2026-10-31

  # ================================================================== SLA / MSLA

  - id: sla-wall-supported-min-hubs
    process: sla
    feature: wall
    compare: min-wall
    variant: supported
    quantity: minimum supported wall (joined to the part on at least two sides)
    min: 0.4
    units: mm
    applies: Protolabs Network SLA
    source: hubs-sla-design
    status: read
    verified: 2026-10-31
  - id: sla-wall-unsupported-min-hubs
    process: sla
    feature: wall
    compare: min-wall
    variant: unsupported
    quantity: minimum unsupported wall (joined on fewer than two sides), with a filleted base
    min: 0.6
    units: mm
    applies: Protolabs Network SLA
    source: hubs-sla-design
    status: read
    verified: 2026-10-31
  - id: sla-wall-min-hubs-table
    process: sla
    feature: wall
    compare: min-wall
    variant: cross-process table
    quantity: recommended minimum wall thickness
    min: 0.5
    units: mm
    applies: SLA/DLP in the cross-process table
    source: hubs-3dp-geometry-limits
    status: read
    verified: 2026-10-31
  - id: sla-overhang-unsupported-hubs
    process: sla
    feature: overhang
    quantity: unsupported overhang length (and at least 19° from level)
    max: 1.0
    units: mm
    applies: only when printing without supports, which Protolabs Network advises against
    source: hubs-sla-design
    status: read
    verified: 2026-10-31
  - id: sla-hole-min-hubs
    process: sla
    feature: hole
    compare: min-hole
    quantity: minimum hole diameter
    min: 0.5
    max: 0.8
    units: mm
    applies: the page's summary table says 0.5 mm; its text says holes under 0.8 mm may close. Use 0.8 mm to be safe
    source: hubs-sla-design
    status: read
    verified: 2026-10-31
  - id: sla-hollow-wall-min-hubs
    process: sla
    feature: hollow
    quantity: wall of a hollowed part
    min: 2.0
    units: mm
    applies: non-functional hollowed models
    source: hubs-sla-design
    status: read
    verified: 2026-10-31
  - id: sla-drain-hole-min-hubs
    process: sla
    feature: escape-hole
    compare: escape-hole
    quantity: drain-hole diameter, at least one per hollow section
    min: 3.5
    units: mm
    applies: hollow SLA parts; trapped resin causes cupping and cracks
    source: hubs-sla-design
    status: read
    verified: 2026-10-31
  - id: sla-clearance-moving-hubs
    process: sla
    feature: clearance
    compare: clearance-fit
    quantity: clearance between moving parts
    min: 0.5
    units: mm
    applies: Protolabs Network SLA; 0.2 mm for assembly connections, 0.1 mm for a push or snug fit
    source: hubs-sla-design
    status: read
    verified: 2026-10-31
  - id: sla-clearance-snap-hubs
    process: sla
    feature: clearance
    compare: clearance-fit
    quantity: nominal clearance between mating parts (snap fits)
    value: 0.3
    units: mm
    applies: Protolabs Network SLA
    source: hubs-snapfit-3dp
    status: read
    verified: 2026-10-31
  - id: sla-emboss-min-hubs
    process: sla
    feature: text
    quantity: embossed detail height
    min: 0.1
    units: mm
    applies: Protolabs Network SLA; engraved detail at least 0.4 mm wide and 0.4 mm deep
    source: hubs-sla-design
    status: read
    verified: 2026-10-31
  - id: sla-bridge-wide-max-hubs
    process: sla
    feature: bridge
    quantity: longest wide horizontal bridge
    max: 21
    units: mm
    applies: wide bridges peel harder than thin ones, so keep them shorter
    source: hubs-sla-design
    status: read
    verified: 2026-10-31
  - id: sla-tolerance-desktop-hubs
    process: sla
    feature: tolerance
    compare: tolerance
    quantity: expected tolerance (±) on a dimension L
    value: "max(0.005*L, 0.10)"
    units: mm
    applies: desktop SLA; ±0.5 % with a lower limit of ±0.10 mm
    source: hubs-3dp-dimensional-accuracy
    status: read
    verified: 2026-10-31
  - id: sla-tolerance-industrial-hubs
    process: sla
    feature: tolerance
    compare: tolerance
    quantity: expected tolerance (±) on a dimension L
    value: "max(0.0015*L, 0.01)"
    units: mm
    applies: industrial SLA; ±0.15 % with a lower limit of ±0.01 mm
    source: hubs-3dp-dimensional-accuracy
    status: read
    verified: 2026-10-31
  - id: sla-wall-min-formlabs-form2
    process: sla
    feature: wall
    compare: min-wall
    variant: Form 2 (laser)
    quantity: minimum wall, supported or unsupported (both the same)
    min: 0.4
    units: mm
    applies: Form 2 (laser), Clear resin at 100 µm
    source: formlabs-form2-design-specs
    status: read
    verified: 2026-10-31
  - id: sla-overhang-angle-formlabs-form2
    process: sla
    feature: overhang
    compare: overhang-angle-min
    variant: Form 2 (laser)
    quantity: unsupported overhang angle from level
    min: 19
    units: deg
    applies: Form 2 (laser), Clear resin at 100 µm; 35 × 10 × 3 mm test bar
    source: formlabs-form2-design-specs
    status: read
    verified: 2026-10-31
  - id: sla-overhang-length-formlabs-form2
    process: sla
    feature: overhang
    compare: overhang-length-max
    variant: Form 2 (laser)
    quantity: horizontal unsupported overhang length
    max: 3.0
    units: mm
    applies: Form 2 (laser), Clear resin at 100 µm
    source: formlabs-form2-design-specs
    status: read
    verified: 2026-10-31
  - id: sla-bridge-formlabs-form2
    process: sla
    feature: bridge
    compare: bridge-max
    variant: Form 2 (laser)
    quantity: horizontal span between supports
    max: 21
    units: mm
    applies: Form 2 (laser), Clear resin at 100 µm; beam 5 mm wide and 3 mm thick, wider beams shorter
    source: formlabs-form2-design-specs
    status: read
    verified: 2026-10-31
  - id: sla-emboss-formlabs-form2
    process: sla
    feature: detail
    compare: emboss-min
    variant: Form 2 (laser)
    quantity: embossed detail height and width
    min: 0.1
    units: mm
    applies: Form 2 (laser), Clear resin at 100 µm
    source: formlabs-form2-design-specs
    status: read
    verified: 2026-10-31
  - id: sla-engrave-formlabs-form2
    process: sla
    feature: detail
    compare: engrave-min
    variant: Form 2 (laser)
    quantity: engraved detail depth and width
    min: 0.4
    units: mm
    applies: Form 2 (laser), Clear resin at 100 µm
    source: formlabs-form2-design-specs
    status: read
    verified: 2026-10-31
  - id: sla-clearance-formlabs-form2
    process: sla
    feature: clearance
    compare: clearance-fit
    variant: Form 2 (laser)
    quantity: clearance between parts of one print (for example a gear pair)
    min: 0.5
