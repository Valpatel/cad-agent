# Standards that govern the same ground. Paid: cited by number and title only; their content was not read and no
# rule above takes a value from them.
standards:
  - id: iso-2768-1
    title: "ISO 2768-1:1989 General tolerances - Part 1: Tolerances for linear and angular dimensions without individual tolerance indications"
    org: ISO
    year: 1989
    url: https://www.iso.org/standard/7748.html
