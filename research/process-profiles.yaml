# Manufacturing-process profiles: design rules by process, each cited to the person, company or standard behind it
# (Valpatel/cad-agent#99). The page that explains them is research/process-profiles.md.
#
# Who reads this: agents choosing limits for a part, and the checks and calculators (cadagent.manufacturing.process,
# .dfm, .sheet_metal and .fit_coupons, #99) that need a process's minimum wall, hole-to-bend distance or draft instead
# of hard-coding one printer's numbers.
#
# "We are highlighting experts, not taking credit for their tips." Every rule names its source; sources are
# summarised and cited, never copied. Paid standards are cited by number and title only.
#
# Sources use the field names of the reference registry proposed in #119 (research/references.yaml there), so each
# entry can move into that registry unchanged. Where #119 already has a source, the id here is the same.
#
# Rules
#   id         unique, kebab-case: <process>-<feature>-<qualifier>-<source short name>
#   process    a key of `processes`
#   feature    what on the part the rule is about (wall, hole, bend-radius, draft, …)
#   compare    optional: rules from different sources or processes that limit the same quantity, in the same units,
#              share this key, so a page or a check can set them side by side (tools/process_profile_figures.py draws
#              them)
#   variant    optional: a short qualifier when one source gives the same quantity more than once (supported)
#   quantity   what is limited, in words
#   min / max / value
#              at least one. A number, or an expression in `variables` (for example "2*T + R"), using + - * / ( ),
#              numbers, min() / max() and one "a if T <= x else b" for a rule that steps with thickness. min is
#              "at least", max is "at most", min and max together a range, value a typical or nominal figure.
#   window     optional, with both min and max: true when they are the two ends of an allowed window for the feature
#              itself (at least min and at most max), not one limit that varies between them by size, material or
#              support. Charts draw a window as an open bar
#   units      one of `units`; for an expression, the units of its result
#   applies    when the rule applies (material, thickness, machine, orientation)
#   datum      optional: where a distance is measured from, when the source says (or "not stated")
#   source     a source id below, or dataset:<id> for numbers kept on another research page (see `datasets`)
#   as_printed optional: the value in the source's own units when it was converted (1 in = 25.4 mm)
#   status     read: seen in the source's own text (or its rendered figure, where `applies` says so) on the date in
#              `verified`; u: not verified (never enforce)
#   verified   ISO date the value was read
#   note       optional: caveats, and where sources disagree
#
# Standards (at the end) are paid documents that govern the same ground. They are cited by number and title only and
# no rule takes a value from them.
schema: 1
updated: 2026-10-31

units:
  mm: millimetres
  deg: degrees
  percent: per cent
  ratio: a dimensionless ratio
  degC: degrees Celsius
  count: a whole number of things

variables:
  T: sheet thickness (mm)
  R: inside bend radius (mm)
  wall: nominal wall thickness of the part next to the feature (mm)
  D: nominal diameter of the hole, pin, boss, thread or tool (mm)
  L: the nominal dimension a tolerance applies to (mm)
  depth: depth of the pocket, cavity or hole (mm)
  width: width of the pocket, cavity or slot (mm)
  H: height of a rib or boss (mm)
  nozzle: FDM nozzle diameter (mm)
  rib: base thickness of the rib (mm)
  texture: depth of the mould texture (mm)
  area: area of the mating feature (mm²)

processes:
  fdm: FDM / FFF material extrusion (desktop and industrial)
  sla: vat photopolymerisation, laser SLA and masked / LCD (MSLA) printers
  sls: selective laser sintering of polymer powder (mostly PA 12)
  mjf: HP Multi Jet Fusion (PA 12, PA 11, PP)
  injection-moulding: plastic injection moulding
  sheet-metal: laser- or punch-cut sheet, press-brake bent
  cnc: CNC milling and turning

# Data that already lives on another research page. Rules here point at it instead of copying it.
datasets:
  - id: fdm-anisotropy-tds
    what: >-
      In-plane (XY) against across-the-layers (Z) modulus, strength and strain to failure for 13 filaments from the
      makers' data sheets, with the derived allowable strain per direction
    where: research/compliant-mechanisms.md
    section: "§5 FDM anisotropy and §6 printed allowable strain"
    cites: >-
      Bambu Lab and Polymaker technical data sheets, each linked in that page's §10 (keys BBL-* and PM-*; the #119
      registry ids are bambu-*-tds and polymaker-*-tds)
  - id: sendcutsend-bend-table
    what: >-
      One shop's bend tooling, per stock SKU: inside radius, K-factor, minimum flange and relief depth. A check should
      read the chosen shop's table before any generic rule (see `shop_tables` below)
    where: research/process-profiles.yaml
    section: shop_tables
    cites: sendcutsend-specs

