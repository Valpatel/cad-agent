# cad-agent reference registry (Valpatel/cad-agent#118).
#
# One entry per outside source that a cad-agent rule, check or note relies on. Rules cite an entry as
# [ref:<id>] and name the people or organisation in the text, so the experts keep the credit.
# Copyrighted guides are summarised and cited, never copied. Paid standards are cited by number and title only.
#
# Fields
#   id        stable kebab-case key
#   title     as the source prints it
#   authors   named people, only where the source names them (byline, licence holder, credits); else []
#   org       publisher or company
#   year      as printed on the source; null when it prints none (file metadata dates are not used)
#   url       where it was read
#   access    free | free-registration | paid | print
#   terms     how cad-agent may use it
#   areas     design areas it supports
#   used_for  repo paths that rely on it, or "proposed" (with the rule it would support)
#   verified  date, and what was actually opened and read
#
# Anything that could not be opened is under `unverified:` at the end, with the reason. Nothing there may be
# cited as [ref:<id>] until someone reads it and moves it up.
schema: 1

sources:

