# cad-agent reference registry (Valpatel/cad-agent#118).
#
# One entry per outside source that a cad-agent rule, check, number or note relies on. "We are highlighting experts,
# not taking credit for their tips": code cites an entry by its id, and pages name the people or organisation in the
# text, so the experts keep the credit. Sources are summarised and cited, never copied or redistributed: no PDF of a
# source is kept in this repo (tests/review/test_references.py fails on any tracked PDF). Paid standards are cited by
# number and title only, paid papers by author, title and equation.
#
# Read it with cadagent.review.references (lookup, citation, check), or from a shell:
#   python -m cadagent.review.references covestro        # one citation
#   python -m cadagent.review.references --check         # the registry and every place the code cites it
#
# Fields of a source
#   id        stable kebab-case key
#   title     as the source prints it
#   authors   named people, only where the source names them (byline, licence holder, credits); else []
#   org       publisher, company or journal (volume, issue, article); a source needs authors or an org
#   year      as printed on the source; null only for an undated web page (its `verified` date is then the access
#             date). File metadata dates are not used
#   url       https link to where it was read (a DOI link for a paper), and/or
#   isbn      for a book (access: print needs one); every source has a url or an isbn
#   access    free | free-registration | paid | print
#   terms     how cad-agent may use it: always "cited", and "never copied", "not redistributed" or "by number and
#             title only"
#   areas     design areas it supports
#   aliases   optional: shorter keys a module uses for the same document (the module's text keeps the page or table)
#   used_for  repo paths that rely on it, or "proposed: ..." (with the rule it would support). check() requires
#             every file that cites the entry to be listed here
#   verified  ISO date, and what was actually opened and read (or, for a book, what was checked)
#
# `unverified:` lists sources named but not yet read or not yet found online, with `why`. Nothing may be cited from
# there in new work; code that already cites one is a known gap to close. `uncited:` lists keys code uses that are
# not outside sources (general knowledge, a module's own judgement, another cad-agent module), so a missing citation
# is a visible choice, not an accident.
#
# Merged on 2026-11-01 from the first sweep (#119, 2026-10-31), the `sources` and `standards` blocks of
# research/process-profiles.yaml (#162, #163) and the sources cadagent.formulas, .mechanical.inserts,
# .mechanical.printed_joints and .simulation.fea cite by key.
