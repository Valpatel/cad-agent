# cad-agent reference registry (Valpatel/cad-agent#118).
#
# One entry per outside source that a cad-agent rule, check or note relies on. Rules cite an entry as
# [ref:<id>] and name the people or organisation in the text. Copyrighted guides are summarised and cited,
