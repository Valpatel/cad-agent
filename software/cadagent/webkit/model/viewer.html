<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Model Viewer</title>
<script src="../ui/theme.js"></script>
<link rel="stylesheet" href="../ui/hud.css">
<style>.guide-controls{padding:12px}.guide-controls select{max-width:100%;min-height:44px}.guide-controls button{min-height:44px}.guide-controls label{display:block;margin:8px 0}.guide-text{white-space:pre-wrap;line-height:1.5}@media(max-width:600px){#app{height:55vh!important}#panel{position:fixed;top:55vh;bottom:0;left:0;right:0;width:auto;height:auto;max-height:none;overflow:auto;box-sizing:border-box}}</style>
<script type="importmap">{"imports": {"three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/addons/"}}</script>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <header id="topbar"><span class="glyph"></span><h1 id="title">Model</h1><span class="hud-tag">3D view</span><span class="spacer"></span>
    <a class="hud-tag" id="back" href="../../../site/">Project site</a>
    <button class="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle color theme" hidden><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11Z"/></svg></button></header>
  <main id="stage-overlay"><div class="hud-hint">DRAG · ORBIT // SCROLL · ZOOM // RIGHT-DRAG · PAN</div></main>
  <aside id="panel"></aside>
</div>
<script type="module">
  import { createViewer } from './viewer.js';
  const q = new URLSearchParams(location.search);
  const manifestUrl = q.get('manifest') ?? '../../../exports/view/view.json';
  if (q.has('back')) {
    const value = q.get('back');
    try {
      if (!value || /[\\\x00-\x20]/.test(value) || /^(?:[a-z][a-z0-9+.-]*:|\/)/i.test(value)) throw new Error('Back link must be relative');
      const back = new URL(value, location.href);
      if (back.origin !== location.origin || back.username || back.password) throw new Error('Invalid back link');
      document.getElementById('back').href = back.href;
      document.getElementById('back').textContent = 'Build guide';
    } catch { document.getElementById('back').removeAttribute('href'); }
  }
  const lifetime = new AbortController();
  window.addEventListener('pagehide', () => lifetime.abort(), {once:true});
  const panel = document.getElementById('panel'), status = document.createElement('p');
  status.className = 'hud-note'; status.setAttribute('role','status'); status.textContent = 'Loading model…'; panel.append(status);
  const onProgress = text => { status.textContent = text; };
  const args = { app: document.getElementById('app'), panel, title: document.getElementById('title'), signal: lifetime.signal, onProgress };
  async function load() {
    if (q.has('guide')) {
      const { mountGuide } = await import('../assembly/guide.js');
      const expectedHash = q.has('sha256') ? q.get('sha256') : undefined;
      if (expectedHash !== undefined && !/^[0-9a-f]{64}$/.test(expectedHash)) throw new Error('Invalid guide SHA-256');
      const guide = await mountGuide({ ...args, expectedHash, guideUrl: new URL(q.get('guide'), location.href).href });
      window.__guide = guide; return guide.viewer;
    }
    return createViewer({ ...args, manifestUrl });
  }
  async function start() {
    document.body.dataset.ready = '0';
    try {
      const v = await load();
      if (q.has('explode')) v.setExplode(+q.get('explode'));
      if (q.has('section')) v.setSection(+q.get('section'));
      if (q.has('view')) [...document.querySelectorAll('.hud-btn')].find((b) => b.textContent === q.get('view').toUpperCase())?.click();
      if (q.get('panel') === '0') panel.style.display = 'none';
      status.remove(); window.__viewer = v; document.body.dataset.ready = '1';
    } catch (error) {
      if (lifetime.signal.aborted) return;
      window.__guide?.dispose(); window.__viewer?.dispose();
      panel.replaceChildren(status); status.textContent = `Could not load model: ${error.message}.`;
      const retry = document.createElement('button'); retry.type = 'button'; retry.className = 'hud-btn'; retry.textContent = 'Retry model'; retry.onclick = () => { retry.remove(); start(); }; panel.append(retry);
    }
  }
  start();
</script>
</body>
</html>
