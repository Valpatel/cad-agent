<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="gallery-scada-server-base-active-title gallery-scada-server-base-active-desc"><title id="gallery-scada-server-base-active-title">SCADA server</title><desc id="gallery-scada-server-base-active-desc">SCADA server. Active, illustrative load 60%. Standalone illustrative gallery preview; not a running model.</desc><style>:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::before,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::after{animation-play-state:paused!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.twin-equipment-art *,.twin-equipment-art *::before,.twin-equipment-art *::after{animation:none!important;transition:none!important}}
.scada-component{display:inline-flex;position:relative;align-items:center;justify-content:center;width:210px;height:160px;max-width:100%;vertical-align:middle;isolation:isolate;color:#c4ebf1;--scada-accent:#62ffbc;--scada-activity-duration:2.4s}
.scada-component.scada-component-with-gauges{box-sizing:border-box;height:calc(136px + var(--scada-gauge-height,22px));padding-bottom:var(--scada-gauge-height,22px)}
.scada-component&gt;.scada-component-svg{display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
.scada-component .scada-led{fill:#557080;transition:fill .25s,filter .25s}
.scada-component .scada-scan{opacity:.2;animation:scada-scan 2.8s ease-in-out var(--scada-phase,0s) infinite;animation-play-state:paused}
.scada-component .scada-load-bar,.scada-component .scada-ups-charge{transition:width .5s ease}
.scada-component[data-scada-host-state=false][data-active=true] .scada-led{fill:#62ffbc;filter:drop-shadow(0 0 2px #62ffbc80)}
.scada-component[data-scada-host-state=false][data-active=true][data-running=true] :is(.scada-rotor,.scada-piston,.scada-wave,.scada-mixer,.scada-scraper,.scada-shaft,.scada-solar-cell,.scada-sensor-pulse,.scada-trace,.scada-scan,.scada-traffic,.scada-screen-pulse,.scada-electric){animation-play-state:running}
.scada-component[data-scada-host-state=false][data-running=false] *,.scada-component[data-scada-host-state=false][data-running=false] *::before,.scada-component[data-scada-host-state=false][data-running=false] *::after{animation-play-state:paused!important;transition:none!important}
html.motion-paused .scada-component *,html.motion-paused .scada-component *::before,html.motion-paused .scada-component *::after{animation-play-state:paused!important;transition:none!important}
@keyframes scada-scan{0%,100%{opacity:.16}35%,65%{opacity:.95}}
@media (prefers-reduced-motion:reduce){.scada-component *,.scada-component *::before,.scada-component *::after{animation:none!important;transition:none!important}
.scada-component[data-active=true] :is(.scada-scan,.scada-traffic,.scada-sensor-pulse){opacity:.65}}

.gallery-label{font-family:Arial,sans-serif;fill:#dcecf1}
.gallery-code{font-family:monospace;fill:#8fbac9}
.gallery-symbol.scada-component{display:block;width:auto;height:auto;padding:0;max-width:none;overflow:visible}
.gallery-symbol&gt;.twin-equipment-art{display:block;width:auto;height:auto;max-width:none}
.gallery-symbol&gt;svg,.gallery-symbol&gt;.twin-equipment-art&gt;svg{display:block;width:280px!important;height:194px!important;max-width:none!important;max-height:none!important;overflow:visible}
.gallery-condition svg{width:24px;height:24px}
