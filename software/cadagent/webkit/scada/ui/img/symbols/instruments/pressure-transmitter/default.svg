<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="gallery-pressure-transmitter-base-active-title gallery-pressure-transmitter-base-active-desc"><title id="gallery-pressure-transmitter-base-active-title">Pressure transmitter</title><desc id="gallery-pressure-transmitter-base-active-desc">Pressure transmitter. Active, illustrative value 42. Standalone illustrative gallery preview; not a running model.</desc><style>:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::before,
