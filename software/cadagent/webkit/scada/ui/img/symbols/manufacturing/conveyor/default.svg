@keyframes scada-industrial-spin{to{transform:rotate(360deg)}}
@keyframes scada-industrial-belt{to{stroke-dashoffset:-26}}
@keyframes scada-industrial-products{0%{transform:translateX(-3px)}100%{transform:translateX(5px)}}
@keyframes scada-industrial-fall{0%{transform:translateY(-3px);opacity:.35}40%,75%{opacity:1}100%{transform:translateY(4px);opacity:.2}}
