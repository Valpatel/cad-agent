.scada-component .scada-industrial-art{--scada-industrial-cycle:2.4s;--scada-industrial-material:.65;--scada-industrial-heat:.12}
.scada-component .scada-industrial-motion{animation-play-state:paused;transform-box:view-box}
.scada-component .scada-industrial-rotate{animation:scada-industrial-spin var(--scada-industrial-cycle) linear infinite paused}
.scada-component .scada-industrial-belt{animation:scada-industrial-belt var(--scada-industrial-cycle) linear infinite paused}
