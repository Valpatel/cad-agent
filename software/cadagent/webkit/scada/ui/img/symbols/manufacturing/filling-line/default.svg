<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="gallery-filling-line-base-active-title gallery-filling-line-base-active-desc"><title id="gallery-filling-line-base-active-title">Filling line</title><desc id="gallery-filling-line-base-active-desc">Filling line. Active, illustrative load 60%, illustrative speed 60%. Standalone illustrative gallery preview; not a running model.</desc><style>:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::before,
