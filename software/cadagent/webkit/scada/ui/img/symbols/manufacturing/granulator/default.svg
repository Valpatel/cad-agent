<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="gallery-granulator-base-active-title gallery-granulator-base-active-desc"><title id="gallery-granulator-base-active-title">Granulator</title><desc id="gallery-granulator-base-active-desc">Granulator. Active, illustrative load 60%, illustrative speed 60%. Standalone illustrative gallery preview; not a running model.</desc><style>:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::before,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::after{animation-play-state:paused!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.twin-equipment-art *,.twin-equipment-art *::before,.twin-equipment-art *::after{animation:none!important;transition:none!important}}
.scada-component .scada-industrial-art{--scada-industrial-cycle:2.4s;--scada-industrial-material:.65;--scada-industrial-heat:.12}
.scada-component .scada-industrial-motion{animation-play-state:paused;transform-box:view-box}
.scada-component .scada-industrial-rotate{animation:scada-industrial-spin var(--scada-industrial-cycle) linear infinite paused}
.scada-component .scada-industrial-fall{animation:scada-industrial-fall var(--scada-industrial-cycle) linear infinite paused}
.scada-component .scada-industrial-exhaust{animation:scada-industrial-exhaust 3.6s ease-in-out infinite paused}
.scada-component .scada-industrial-material{opacity:var(--scada-industrial-material)}
.scada-component :is(.scada-industrial-wear,.scada-industrial-crack,.scada-industrial-jam,.scada-industrial-spill,.scada-industrial-fuel-leak,.scada-industrial-overheat,.scada-industrial-element-fault,.scada-industrial-door-leak){display:none}
.scada-component[data-scada-host-state=false][data-active=true][data-running=true]:not([data-failed=true]):not([data-status=offline]) .scada-industrial-motion{animation-play-state:running}
.scada-component[data-running=true]:not([data-status=offline]) .scada-industrial-art :is(.scada-industrial-spill,.scada-industrial-fuel-leak,.scada-industrial-overheat) .scada-industrial-motion{animation-play-state:running}
@keyframes scada-industrial-spin{to{transform:rotate(360deg)}}
@keyframes scada-industrial-fall{0%{transform:translateY(-3px);opacity:.35}40%,75%{opacity:1}100%{transform:translateY(4px);opacity:.2}}
@keyframes scada-industrial-exhaust{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-3px);opacity:.65}}
@media (prefers-reduced-motion:reduce){.scada-component .scada-industrial-motion{animation:none!important;transform:none!important}
.scada-component .scada-industrial-material{opacity:var(--scada-industrial-material)}
.scada-component .scada-industrial-overheat .scada-industrial-exhaust{opacity:.7}}
.scada-component{display:inline-flex;position:relative;align-items:center;justify-content:center;width:210px;height:160px;max-width:100%;vertical-align:middle;isolation:isolate;color:#c4ebf1;--scada-accent:#62ffbc;--scada-activity-duration:2.4s}
.scada-component.scada-component-with-gauges{box-sizing:border-box;height:calc(136px + var(--scada-gauge-height,22px));padding-bottom:var(--scada-gauge-height,22px)}
.scada-component&gt;.scada-component-svg{display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
.scada-component .scada-led{fill:#557080;transition:fill .25s,filter .25s}
.scada-component[data-scada-host-state=false][data-active=true] .scada-led{fill:#62ffbc;filter:drop-shadow(0 0 2px #62ffbc80)}
.scada-component[data-scada-host-state=false][data-running=false] *,.scada-component[data-scada-host-state=false][data-running=false] *::before,.scada-component[data-scada-host-state=false][data-running=false] *::after{animation-play-state:paused!important;transition:none!important}
html.motion-paused .scada-component *,html.motion-paused .scada-component *::before,html.motion-paused .scada-component *::after{animation-play-state:paused!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.scada-component *,.scada-component *::before,.scada-component *::after{animation:none!important;transition:none!important}}

.gallery-label{font-family:Arial,sans-serif;fill:#dcecf1}
.gallery-code{font-family:monospace;fill:#8fbac9}
.gallery-symbol.scada-component{display:block;width:auto;height:auto;padding:0;max-width:none;overflow:visible}
.gallery-symbol&gt;.twin-equipment-art{display:block;width:auto;height:auto;max-width:none}
.gallery-symbol&gt;svg,.gallery-symbol&gt;.twin-equipment-art&gt;svg{display:block;width:280px!important;height:194px!important;max-width:none!important;max-height:none!important;overflow:visible}
.gallery-condition svg{width:24px;height:24px}
