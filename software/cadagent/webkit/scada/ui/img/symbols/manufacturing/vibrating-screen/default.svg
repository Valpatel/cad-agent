<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="gallery-vibrating-screen-base-active-title gallery-vibrating-screen-base-active-desc"><title id="gallery-vibrating-screen-base-active-title">Vibrating screen</title><desc id="gallery-vibrating-screen-base-active-desc">Vibrating screen. Active, illustrative load 60%, illustrative speed 60%. Standalone illustrative gallery preview; not a running model.</desc><style>:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::before,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::after{animation-play-state:paused!important;transition:none!important}
