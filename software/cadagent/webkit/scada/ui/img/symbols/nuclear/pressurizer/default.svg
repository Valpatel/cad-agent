<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="gallery-pressurizer-base-active-title gallery-pressurizer-base-active-desc"><title id="gallery-pressurizer-base-active-title">Pressurizer</title><desc id="gallery-pressurizer-base-active-desc">Pressurizer. Active, illustrative level 55%, illustrative heat 45index, illustrative pressure 45index. Standalone illustrative gallery preview; not a running model.</desc><style>:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::before,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::after{animation-play-state:paused!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.twin-equipment-art *,.twin-equipment-art *::before,.twin-equipment-art *::after{animation:none!important;transition:none!important}}
.scada-component .scada-nuclear-art{--scada-nuclear-primary-duration:2.6s;--scada-nuclear-secondary-duration:2.6s;--scada-nuclear-source-duration:3s;--scada-nuclear-heat-opacity:.3;--scada-nuclear-load-opacity:.6;--scada-nuclear-primary-opacity:.7;--scada-nuclear-secondary-opacity:.7}
.scada-component .scada-nuclear-motion{animation-play-state:paused;transform-box:view-box}
.scada-component .scada-nuclear-flow{animation:scada-nuclear-transport var(--scada-nuclear-primary-duration) linear infinite paused}
.scada-component .scada-nuclear-primary{stroke:#5fffe0;opacity:var(--scada-nuclear-primary-opacity)}
.scada-component .scada-nuclear-heat{opacity:var(--scada-nuclear-heat-opacity)}
.scada-component .scada-nuclear-residual{opacity:var(--scada-nuclear-heat-opacity);animation:scada-nuclear-residual 4s ease-in-out infinite paused}
.scada-component .scada-nuclear-surface{animation:scada-nuclear-surface 4.5s ease-in-out infinite paused}
.scada-component .scada-nuclear-indicator{fill:#456b7e}
.scada-component .scada-nuclear-readout{fill:#baf7e8;font:600 10px ui-monospace,SFMono-Regular,Consolas,monospace}
.scada-component .scada-nuclear-art[data-nuclear-heat=true] .scada-nuclear-residual{animation-play-state:running}
.scada-component .scada-nuclear-art[data-nuclear-monitor=true] .scada-nuclear-indicator{fill:#62ffbc;filter:drop-shadow(0 0 2px #62ffbc80)}
@keyframes scada-nuclear-transport{to{stroke-dashoffset:-33}}
@keyframes scada-nuclear-residual{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes scada-nuclear-surface{0%,100%{transform:translateX(-1px)}50%{transform:translateX(1px)}}
@media (prefers-reduced-motion:reduce){.scada-component .scada-nuclear-motion{animation:none!important}}
.scada-component .scada-nuclear-art[data-nuclear-heat=true] .scada-pressurizer-surface{animation-play-state:running}
.scada-component{display:inline-flex;position:relative;align-items:center;justify-content:center;width:210px;height:160px;max-width:100%;vertical-align:middle;isolation:isolate;color:#c4ebf1;--scada-accent:#62ffbc;--scada-activity-duration:2.4s}
.scada-component.scada-component-with-gauges{box-sizing:border-box;height:calc(136px + var(--scada-gauge-height,22px));padding-bottom:var(--scada-gauge-height,22px)}
.scada-component&gt;.scada-component-svg{display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
.scada-component[data-scada-host-state=false][data-running=false] *,.scada-component[data-scada-host-state=false][data-running=false] *::before,.scada-component[data-scada-host-state=false][data-running=false] *::after{animation-play-state:paused!important;transition:none!important}
html.motion-paused .scada-component *,html.motion-paused .scada-component *::before,html.motion-paused .scada-component *::after{animation-play-state:paused!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.scada-component *,.scada-component *::before,.scada-component *::after{animation:none!important;transition:none!important}}

.gallery-label{font-family:Arial,sans-serif;fill:#dcecf1}
.gallery-code{font-family:monospace;fill:#8fbac9}
.gallery-symbol.scada-component{display:block;width:auto;height:auto;padding:0;max-width:none;overflow:visible}
.gallery-symbol&gt;.twin-equipment-art{display:block;width:auto;height:auto;max-width:none}
.gallery-symbol&gt;svg,.gallery-symbol&gt;.twin-equipment-art&gt;svg{display:block;width:280px!important;height:182px!important;max-width:none!important;max-height:none!important;overflow:visible}
.gallery-condition svg{width:24px;height:24px}
