<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="gallery-alternator-generator-active-title gallery-alternator-generator-active-desc"><title id="gallery-alternator-generator-active-title">Synchronous alternator · Generator</title><desc id="gallery-alternator-generator-active-desc">Synchronous alternator (Generator). Active, illustrative load 60%, illustrative speed 60%, illustrative heat 45index, illustrative field 60%. Standalone illustrative gallery preview; not a running model.</desc><style>:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::before,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::after{animation-play-state:paused!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.twin-equipment-art *,.twin-equipment-art *::before,.twin-equipment-art *::after{animation:none!important;transition:none!important}}
.scada-component .scada-power-art{--scada-power-cycle:2.4s}
.scada-component .scada-power-motion{animation-play-state:paused;transform-box:view-box}
.scada-component .scada-power-rotor{animation:scada-power-spin var(--scada-power-cycle) linear infinite paused}
.scada-component .scada-power-blade-shimmer{animation:scada-power-shimmer calc(var(--scada-power-cycle) * .5) ease-in-out infinite paused}
.scada-component .scada-electrical-flow{animation:scada-power-electrons var(--scada-power-cycle) linear infinite paused;opacity:var(--scada-power-current-opacity,1)}
