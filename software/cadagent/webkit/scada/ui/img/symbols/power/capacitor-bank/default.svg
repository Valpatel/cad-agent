.scada-component .scada-power-art [data-stressed=false] .scada-power-protection-pulse{animation-play-state:paused!important;opacity:0!important}
@keyframes scada-power-electrons{to{stroke-dashoffset:-20}}
@keyframes scada-power-pulse{0%,100%{opacity:.55}50%{opacity:1}}
