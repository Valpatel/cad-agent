<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="gallery-fuel-cell-base-active-title gallery-fuel-cell-base-active-desc"><title id="gallery-fuel-cell-base-active-title">Fuel-cell generator</title><desc id="gallery-fuel-cell-base-active-desc">Fuel-cell generator. Active, illustrative load 60%, illustrative temperature 80°C. Standalone illustrative gallery preview; not a running model.</desc><style>:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::before,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::after{animation-play-state:paused!important;transition:none!important}
