<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="gallery-generator-base-active-title gallery-generator-base-active-desc"><title id="gallery-generator-base-active-title">Microturbine generator</title><desc id="gallery-generator-base-active-desc">Microturbine generator. Active, illustrative load 60%, illustrative speed 60%. Standalone illustrative gallery preview; not a running model.</desc><style>.twin-equipment-art{display:block;position:relative;flex:none;width:116px;max-width:90%;height:48px;pointer-events:none;isolation:isolate}
.twin-equipment-art&gt;svg{display:block;width:100%;height:100%;overflow:visible}
.twin-equipment-art-turbine{width:130px;height:62px}
.twin-equipment-art .twin-art-rotor{transform-box:view-box;animation:twin-art-spin var(--activity-speed,2.4s) linear infinite;animation-play-state:paused}
.twin-art-status-light{fill:#526474}
.twin-art-generator-meter{opacity:.35}
.twin-art-generator-electric{opacity:.6}
.twin-art-generator-current{stroke-dasharray:4 8;stroke-linecap:round;opacity:.2;animation:twin-art-stream 1.2s linear infinite;animation-play-state:paused}
.twin-art-generator-heat{opacity:0;animation:twin-art-generator-heat 2.8s ease-out infinite;animation-play-state:paused}
.twin-art-fault-effects,.twin-art-overload-effects,.twin-art-incident-fire{display:none}
.twin-art-fault-halo{animation:twin-art-fault-breathe 3.1s ease-in-out infinite}
.twin-art-fault-sparks{transform-box:view-box;transform-origin:112px 28px;animation:twin-art-sparks 2.5s ease-in-out infinite}
.twin-art-smoke{opacity:.55;animation:twin-art-smoke-drift 3.2s ease-out infinite}
.twin-art-smoke-two{animation-delay:-1.6s;stroke:#756880;stroke-width:3}
.twin-art-fracture{filter:drop-shadow(0 0 2px #ff2a6d70)}
.twin-art-overload-effects{opacity:.8;animation:twin-art-overload-breathe 2.5s ease-in-out infinite}
@keyframes twin-art-spin{to{transform:rotate(360deg)}}
@keyframes twin-art-stream{to{stroke-dashoffset:-34}}
@keyframes twin-art-generator-heat{0%,100%{transform:translateY(0);opacity:0}25%{opacity:.48}80%{transform:translateY(-3px);opacity:.12}}
@keyframes twin-art-fault-breathe{0%,100%{opacity:.55}50%{opacity:.9}}
@keyframes twin-art-sparks{0%,65%,100%{opacity:.25;transform:scale(.88)}25%,40%{opacity:.95;transform:scale(1.08)}}
@keyframes twin-art-smoke-drift{0%{opacity:.12;transform:translate(0,3px)}35%{opacity:.6}100%{opacity:.12;transform:translate(5px,-6px)}}
@keyframes twin-art-overload-breathe{0%,100%{opacity:.45}50%{opacity:1}}
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::before,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::after{animation-play-state:paused!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.twin-equipment-art *,.twin-equipment-art *::before,.twin-equipment-art *::after{animation:none!important;transition:none!important}}
.scada-component{display:inline-flex;position:relative;align-items:center;justify-content:center;width:210px;height:160px;max-width:100%;vertical-align:middle;isolation:isolate;color:#c4ebf1;--scada-accent:#62ffbc;--scada-activity-duration:2.4s}
.scada-component.scada-component-with-gauges{box-sizing:border-box;height:calc(136px + var(--scada-gauge-height,22px));padding-bottom:var(--scada-gauge-height,22px)}
.scada-component[data-scada-host-state=false]&gt;.twin-equipment-art{width:180px;max-width:100%;height:100%;max-height:100%;flex:none}
.scada-component[data-scada-host-state=false][data-active=true] :is(.twin-art-stream,.twin-art-filter-stream,.twin-art-charge-orbit,.twin-art-generator-current,.twin-art-generator-electric,.twin-art-generator-meter){opacity:1}
.scada-component[data-scada-host-state=false][data-active=true] :is(.twin-art-stream,.twin-art-filter-stream,.twin-art-generator-current){opacity:calc(.18 + var(--scada-load,60)*.0082)}
.scada-component[data-scada-host-state=false][data-active=true] .twin-art-status-light{fill:#62ffbc;filter:drop-shadow(0 0 3px #62ffbc)}
.scada-component[data-scada-host-state=false][data-active=true][data-running=true] :is(.twin-art-rotor,.twin-art-wave,.twin-art-mixer,.twin-art-bubble,.twin-art-stream,.twin-art-filter-stream,.twin-art-charge-orbit,.twin-art-flame-outer,.twin-art-flame-middle,.twin-art-flame-core,.twin-art-fire-halo,.twin-art-ember,.twin-art-generator-current,.twin-art-generator-heat){animation-play-state:running}
.scada-component[data-scada-host-state=false][data-running=false] *,.scada-component[data-scada-host-state=false][data-running=false] *::before,.scada-component[data-scada-host-state=false][data-running=false] *::after{animation-play-state:paused!important;transition:none!important}
html.motion-paused .scada-component *,html.motion-paused .scada-component *::before,html.motion-paused .scada-component *::after{animation-play-state:paused!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.scada-component *,.scada-component *::before,.scada-component *::after{animation:none!important;transition:none!important}}

.gallery-label{font-family:Arial,sans-serif;fill:#dcecf1}
.gallery-code{font-family:monospace;fill:#8fbac9}
.gallery-symbol.scada-component{display:block;width:auto;height:auto;padding:0;max-width:none;overflow:visible}
.gallery-symbol&gt;.twin-equipment-art{display:block;width:auto;height:auto;max-width:none}
.gallery-symbol&gt;svg,.gallery-symbol&gt;.twin-equipment-art&gt;svg{display:block;width:280px!important;height:194px!important;max-width:none!important;max-height:none!important;overflow:visible}
.gallery-condition svg{width:24px;height:24px}
