<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="gallery-clarifier-base-active-title gallery-clarifier-base-active-desc"><title id="gallery-clarifier-base-active-title">Circular clarifier</title><desc id="gallery-clarifier-base-active-desc">Circular clarifier. Active, illustrative level 55%. Standalone illustrative gallery preview; not a running model.</desc><style>:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::before,
