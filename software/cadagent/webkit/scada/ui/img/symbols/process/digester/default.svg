<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="gallery-digester-base-active-title gallery-digester-base-active-desc"><title id="gallery-digester-base-active-title">Anaerobic digester</title><desc id="gallery-digester-base-active-desc">Anaerobic digester. Active, illustrative level 55%. Standalone illustrative gallery preview; not a running model.</desc><style>.twin-equipment-art{display:block;position:relative;flex:none;width:116px;max-width:90%;height:48px;pointer-events:none;isolation:isolate}
.twin-equipment-art&gt;svg{display:block;width:100%;height:100%;overflow:visible}
.twin-equipment-art-digester{width:130px;height:86px}
.twin-art-wave{transform-box:view-box;animation:twin-art-wave-drift 5s linear infinite;animation-play-state:paused}
.twin-art-wave-back{animation-duration:7s;animation-direction:reverse}
.twin-art-mixer{transform-box:fill-box;transform-origin:center;animation:twin-art-mix 1.4s ease-in-out infinite;animation-play-state:paused}
.twin-art-bubble{opacity:0;animation:twin-art-bubble-rise var(--bubble-duration,4s) linear var(--bubble-delay,0s) infinite;animation-play-state:paused}
.twin-art-needle{transform-box:fill-box;transform-origin:left bottom}
.twin-art-pressure-effects{opacity:0;transition:opacity .7s;pointer-events:none}
.twin-art-pressure-ring,.twin-art-pressure-wave{stroke:#ffbc67}
.twin-art-pressure-glow{opacity:.25}
@keyframes twin-art-wave-drift{from{transform:translateX(0)}to{transform:translateX(-80px)}}
@keyframes twin-art-mix{0%,100%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
@keyframes twin-art-bubble-rise{0%{transform:translateY(0) translateX(0);opacity:0}12%{opacity:.72}70%{opacity:.48}100%{transform:translateY(-62px) translateX(5px);opacity:0}}
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::before,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::after{animation-play-state:paused!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.twin-equipment-art *,.twin-equipment-art *::before,.twin-equipment-art *::after{animation:none!important;transition:none!important}
.twin-equipment-art .twin-art-vessel{animation:none!important;transform:none!important}}
.scada-component{display:inline-flex;position:relative;align-items:center;justify-content:center;width:210px;height:160px;max-width:100%;vertical-align:middle;isolation:isolate;color:#c4ebf1;--scada-accent:#62ffbc;--scada-activity-duration:2.4s}
.scada-component.scada-component-with-gauges{box-sizing:border-box;height:calc(136px + var(--scada-gauge-height,22px));padding-bottom:var(--scada-gauge-height,22px)}
.scada-component[data-scada-host-state=false]&gt;.twin-equipment-art{width:180px;max-width:100%;height:100%;max-height:100%;flex:none}
.scada-component[data-scada-host-state=false][data-scada-type=digester] .twin-art-wave{translate:0 var(--scada-level-offset)}
.scada-component[data-scada-host-state=false][data-active=true][data-running=true] :is(.twin-art-rotor,.twin-art-wave,.twin-art-mixer,.twin-art-bubble,.twin-art-stream,.twin-art-filter-stream,.twin-art-charge-orbit,.twin-art-flame-outer,.twin-art-flame-middle,.twin-art-flame-core,.twin-art-fire-halo,.twin-art-ember,.twin-art-generator-current,.twin-art-generator-heat){animation-play-state:running}
.scada-component[data-scada-host-state=false][data-running=false] *,.scada-component[data-scada-host-state=false][data-running=false] *::before,.scada-component[data-scada-host-state=false][data-running=false] *::after{animation-play-state:paused!important;transition:none!important}
html.motion-paused .scada-component *,html.motion-paused .scada-component *::before,html.motion-paused .scada-component *::after{animation-play-state:paused!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.scada-component *,.scada-component *::before,.scada-component *::after{animation:none!important;transition:none!important}
.scada-component[data-scada-host-state=false][data-active=true] .twin-art-bubble{opacity:.45}}

.gallery-label{font-family:Arial,sans-serif;fill:#dcecf1}
.gallery-code{font-family:monospace;fill:#8fbac9}
.gallery-symbol.scada-component{display:block;width:auto;height:auto;padding:0;max-width:none;overflow:visible}
.gallery-symbol&gt;.twin-equipment-art{display:block;width:auto;height:auto;max-width:none}
.gallery-symbol&gt;svg,.gallery-symbol&gt;.twin-equipment-art&gt;svg{display:block;width:280px!important;height:194px!important;max-width:none!important;max-height:none!important;overflow:visible}
.gallery-condition svg{width:24px;height:24px}
