<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="gallery-distillation-column-base-active-title gallery-distillation-column-base-active-desc"><title id="gallery-distillation-column-base-active-title">Distillation column</title><desc id="gallery-distillation-column-base-active-desc">Distillation column. Active, illustrative level 55%, illustrative load 60%, illustrative temperature 120°C. Standalone illustrative gallery preview; not a running model.</desc><style>:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::before,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::after{animation-play-state:paused!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.twin-equipment-art *,.twin-equipment-art *::before,.twin-equipment-art *::after{animation:none!important;transition:none!important}}
.scada-component .scada-process-flow{stroke:#6af5dc;stroke-linecap:round;stroke-dasharray:4 10;opacity:.2;animation:scada-process-flow 1.6s linear infinite;animation-play-state:paused}
.scada-component :is(.scada-process-vapor,.scada-process-cooling-plume,.scada-process-heat){opacity:.4;animation:scada-process-vapor 3s ease-in-out var(--process-phase,0s) infinite;animation-play-state:paused}
.scada-component .scada-process-heat{opacity:calc(.2 + var(--process-heat,.3)*.7);filter:brightness(calc(.65 + var(--process-heat,.3)*.8))}
