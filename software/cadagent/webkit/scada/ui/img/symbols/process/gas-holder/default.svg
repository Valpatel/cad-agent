<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="gallery-gas-holder-base-active-title gallery-gas-holder-base-active-desc"><title id="gallery-gas-holder-base-active-title">Gas holder</title><desc id="gallery-gas-holder-base-active-desc">Gas holder. Active, illustrative level 55%. Standalone illustrative gallery preview; not a running model.</desc><style>.twin-equipment-art{display:block;position:relative;flex:none;width:116px;max-width:90%;height:48px;pointer-events:none;isolation:isolate}
.twin-equipment-art&gt;svg{display:block;width:100%;height:100%;overflow:visible}
.twin-equipment-art-storage{width:113px;height:48px}
.twin-art-buffer-fill{transform-box:fill-box;transform-origin:center bottom;transform:scaleY(var(--buffer-fraction,0));transition:transform .85s ease}
.twin-art-fire{opacity:0;visibility:hidden;transition:opacity .35s}
.twin-art-fire-size{transform-box:view-box;transform-origin:90px 75px;transform:scale(var(--flame-scale,1));transition:transform 1s ease}
.twin-art-flame-outer,.twin-art-flame-middle,.twin-art-flame-core{transform-box:view-box;transform-origin:90px 75px;animation:twin-art-flame .8s ease-in-out infinite alternate;animation-play-state:paused}
.twin-art-flame-middle{animation-name:twin-art-flame-core;animation-duration:.55s;animation-delay:-.3s}
.twin-art-flame-core{animation-name:twin-art-flame-core;animation-duration:.38s;animation-delay:-.17s}
.twin-art-fire-halo{animation:twin-art-warmth 1.4s ease-in-out infinite alternate;animation-play-state:paused;transform-box:fill-box;transform-origin:center}
.twin-art-ember{animation:twin-art-ember 1.7s ease-out var(--ember-delay,0s) infinite;animation-play-state:paused;opacity:0}
.twin-art-fault-effects,.twin-art-overload-effects,.twin-art-incident-fire{display:none}
.twin-art-smoke{opacity:.55;animation:twin-art-smoke-drift 3.2s ease-out infinite}
.twin-art-smoke-two{animation-delay:-1.6s;stroke:#756880;stroke-width:3}
.twin-art-pressure-effects{opacity:0;transition:opacity .7s;pointer-events:none}
.twin-art-pressure-ring,.twin-art-pressure-wave{stroke:#ffbc67}
.twin-art-pressure-glow{opacity:.25}
.twin-art-buffer-damage,.twin-art-leak-effects,.twin-art-after-smoke{display:none}
.twin-art-buffer-scar{opacity:0}
.twin-art-leak-size{transform-box:view-box;transform-origin:132px 73px;transform:scale(calc(.26 + var(--leak-intensity,0) * .74));transition:transform 1s ease}
.twin-art-leak-jets{stroke:#caf9f6;stroke-width:1.7;stroke-dasharray:3 6;animation:twin-art-leak-jet .7s linear infinite;opacity:.76}
.twin-art-leak-jets path:nth-child(2){stroke-width:1;opacity:.65}
.twin-art-leak-jets path:nth-child(3){stroke-width:1.1;opacity:.45}
.twin-art-vapor{transform-box:view-box;transform-origin:143px 66px;opacity:0;animation:twin-art-vapor-rise 2.4s ease-out var(--vapor-delay,0s) infinite}
.twin-art-leak-flame-size{transform-box:view-box;transform-origin:148px 80px;transform:scale(calc(.48 + var(--leak-intensity,1) * .52));transition:transform 1s ease}
.twin-art-after-smoke .twin-art-smoke{transform-box:view-box;transform-origin:110px 40px;animation:twin-art-after-smoke 3.8s ease-out infinite}
.twin-art-after-smoke .twin-art-smoke-two{animation-delay:-1.9s;fill:#625c74;stroke:none}
.twin-art-burst-effects{display:none;pointer-events:none;transform-box:view-box;transform-origin:103px 58px;transform:scale(1.4)}
.twin-art-burst-flash,.twin-art-burst-ring,.twin-art-burst-rays,.twin-art-burst-debris{opacity:0;transform-box:view-box;transform-origin:103px 58px}
@keyframes twin-art-flame{0%{transform:scale(.94,1) rotate(-3deg)}30%{transform:scale(1.03,.93) rotate(2deg)}65%{transform:scale(.91,1.1) rotate(-1deg)}100%{transform:scale(1,1.04) rotate(3deg)}}
@keyframes twin-art-flame-core{0%{transform:scale(1,.88) rotate(3deg)}50%{transform:scale(.85,1.08) rotate(-4deg)}100%{transform:scale(1.08,.95) rotate(1deg)}}
@keyframes twin-art-warmth{from{opacity:.55;transform:scale(.93)}to{opacity:1;transform:scale(1.08)}}
@keyframes twin-art-ember{0%{transform:translate(0,6px);opacity:0}20%{opacity:.9}100%{transform:translate(8px,-23px);opacity:0}}
@keyframes twin-art-leak-jet{to{stroke-dashoffset:-18}}
@keyframes twin-art-vapor-rise{0%{transform:translate(-5px,8px) scale(.45);opacity:0}18%{opacity:.45}75%{opacity:.16}100%{transform:translate(9px,-20px) scale(1.16);opacity:0}}
@keyframes twin-art-after-smoke{0%{transform:translate(-2px,9px) scale(.65);opacity:.08}22%{opacity:.5}100%{transform:translate(9px,-10px) scale(1.15);opacity:0}}
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::before,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::after{animation-play-state:paused!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.twin-equipment-art *,.twin-equipment-art *::before,.twin-equipment-art *::after{animation:none!important;transition:none!important}
.twin-art-ember{opacity:0}
.twin-art-burst-effects{display:none!important}
.twin-equipment-art .twin-art-vessel{animation:none!important;transform:none!important}
.twin-art-after-smoke .twin-art-smoke{opacity:.25}}
.scada-component{display:inline-flex;position:relative;align-items:center;justify-content:center;width:210px;height:160px;max-width:100%;vertical-align:middle;isolation:isolate;color:#c4ebf1;--scada-accent:#62ffbc;--scada-activity-duration:2.4s}
.scada-component.scada-component-with-gauges{box-sizing:border-box;height:calc(136px + var(--scada-gauge-height,22px));padding-bottom:var(--scada-gauge-height,22px)}
.scada-component[data-scada-host-state=false]&gt;.twin-equipment-art{width:180px;max-width:100%;height:100%;max-height:100%;flex:none}
.scada-component[data-scada-host-state=false] .scada-charge-fill,.scada-component[data-scada-host-state=false][data-scada-type=gas-holder] .twin-art-buffer-fill{animation:scada-inventory 3.6s ease-in-out infinite;animation-play-state:paused}
.scada-component[data-scada-host-state=false][data-active=true][data-running=true] .scada-charge-fill,.scada-component[data-scada-host-state=false][data-scada-type=gas-holder][data-active=true][data-running=true] .twin-art-buffer-fill{animation-play-state:running}
.scada-component[data-scada-host-state=false][data-active=true] .twin-art-fire{opacity:1;visibility:visible}
.scada-component[data-scada-host-state=false][data-active=true][data-running=true] :is(.twin-art-rotor,.twin-art-wave,.twin-art-mixer,.twin-art-bubble,.twin-art-stream,.twin-art-filter-stream,.twin-art-charge-orbit,.twin-art-flame-outer,.twin-art-flame-middle,.twin-art-flame-core,.twin-art-fire-halo,.twin-art-ember,.twin-art-generator-current,.twin-art-generator-heat){animation-play-state:running}
.scada-component[data-scada-host-state=false][data-running=false] *,.scada-component[data-scada-host-state=false][data-running=false] *::before,.scada-component[data-scada-host-state=false][data-running=false] *::after{animation-play-state:paused!important;transition:none!important}
html.motion-paused .scada-component *,html.motion-paused .scada-component *::before,html.motion-paused .scada-component *::after{animation-play-state:paused!important;transition:none!important}
@keyframes scada-inventory{0%,100%{filter:brightness(.9)}50%{filter:brightness(1.2)}}
@media (prefers-reduced-motion:reduce){.scada-component *,.scada-component *::before,.scada-component *::after{animation:none!important;transition:none!important}}

.gallery-label{font-family:Arial,sans-serif;fill:#dcecf1}
.gallery-code{font-family:monospace;fill:#8fbac9}
.gallery-symbol.scada-component{display:block;width:auto;height:auto;padding:0;max-width:none;overflow:visible}
.gallery-symbol&gt;.twin-equipment-art{display:block;width:auto;height:auto;max-width:none}
.gallery-symbol&gt;svg,.gallery-symbol&gt;.twin-equipment-art&gt;svg{display:block;width:280px!important;height:194px!important;max-width:none!important;max-height:none!important;overflow:visible}
.gallery-condition svg{width:24px;height:24px}
