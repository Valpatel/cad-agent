<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="gallery-compressor-base-active-title gallery-compressor-base-active-desc"><title id="gallery-compressor-base-active-title">Reciprocating compressor</title><desc id="gallery-compressor-base-active-desc">Reciprocating compressor. Active, illustrative load 60%, illustrative speed 60%. Standalone illustrative gallery preview; not a running model.</desc><style>:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::before,
:is(.twin-root.is-paused,.twin-document-hidden,html.motion-paused) .twin-equipment-art *::after{animation-play-state:paused!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.twin-equipment-art *,.twin-equipment-art *::before,.twin-equipment-art *::after{animation:none!important;transition:none!important}}
.scada-component{display:inline-flex;position:relative;align-items:center;justify-content:center;width:210px;height:160px;max-width:100%;vertical-align:middle;isolation:isolate;color:#c4ebf1;--scada-accent:#62ffbc;--scada-activity-duration:2.4s}
.scada-component.scada-component-with-gauges{box-sizing:border-box;height:calc(136px + var(--scada-gauge-height,22px));padding-bottom:var(--scada-gauge-height,22px)}
.scada-component&gt;.scada-component-svg{display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
.scada-component .scada-flow{stroke:#68ffe1;stroke-dasharray:5 11;stroke-linecap:round;opacity:.15;animation:scada-flow 1.4s linear infinite;animation-play-state:paused}
.scada-component .scada-rotor{transform-box:view-box;animation:scada-spin var(--scada-activity-duration) linear infinite;animation-play-state:paused}
.scada-component .scada-piston{animation:scada-piston var(--scada-activity-duration) ease-in-out infinite;animation-play-state:paused}
.scada-component[data-scada-host-state=false][data-active=true][data-running=true] :is(.scada-rotor,.scada-piston,.scada-wave,.scada-mixer,.scada-scraper,.scada-shaft,.scada-solar-cell,.scada-sensor-pulse,.scada-trace,.scada-scan,.scada-traffic,.scada-screen-pulse,.scada-electric){animation-play-state:running}
.scada-component[data-scada-host-state=false][data-flow=true] .scada-flow{opacity:var(--scada-flow-opacity,.95)}
.scada-component[data-scada-host-state=false][data-flow=true][data-running=true] .scada-flow{animation-play-state:running}
.scada-component[data-scada-host-state=false][data-running=false] *,.scada-component[data-scada-host-state=false][data-running=false] *::before,.scada-component[data-scada-host-state=false][data-running=false] *::after{animation-play-state:paused!important;transition:none!important}
html.motion-paused .scada-component *,html.motion-paused .scada-component *::before,html.motion-paused .scada-component *::after{animation-play-state:paused!important;transition:none!important}
@keyframes scada-flow{to{stroke-dashoffset:-32}}
@keyframes scada-spin{to{transform:rotate(360deg)}}
@keyframes scada-piston{0%,100%{transform:translateX(-2px)}50%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.scada-component *,.scada-component *::before,.scada-component *::after{animation:none!important;transition:none!important}}

.gallery-label{font-family:Arial,sans-serif;fill:#dcecf1}
.gallery-code{font-family:monospace;fill:#8fbac9}
.gallery-symbol.scada-component{display:block;width:auto;height:auto;padding:0;max-width:none;overflow:visible}
.gallery-symbol&gt;.twin-equipment-art{display:block;width:auto;height:auto;max-width:none}
.gallery-symbol&gt;svg,.gallery-symbol&gt;.twin-equipment-art&gt;svg{display:block;width:280px!important;height:194px!important;max-width:none!important;max-height:none!important;overflow:visible}
.gallery-condition svg{width:24px;height:24px}
</style><defs><linearGradient id="gallery-compressor-base-active-card" x2="1" y2="1"><stop offset="0" stop-color="#102635"/><stop offset="1" stop-color="#0b1724"/></linearGradient></defs><rect x="0.5" y="0.5" width="479" height="359" rx="14" fill="url(#gallery-compressor-base-active-card)" stroke="#355665"/><text class="gallery-label" x="20" y="28" font-size="11" letter-spacing="1" style="fill:#7acfc9">PUMPS &amp; MACHINERY</text><text class="gallery-label" x="20" y="55" font-size="21" font-weight="600">Reciprocating compressor</text><g transform="translate(100 79)"><g class="scada-component scada-component-with-gauges gallery-symbol" data-scada-type="compressor" data-scada-instance="scada-gallery-compressor-base-active" data-scada-host-state="false" data-active="true" data-failed="false" data-running="true" data-status="normal" data-flow="true" data-damage="none" data-speed-zero="false" style="--scada-level:55;--scada-load:60;--scada-flow-opacity:0.95;--scada-gauge-height:30px;--scada-activity-duration:2.2s;--activity-speed:2.2s;--buffer-fraction:0.55;--scada-level-offset:0px;--flame-scale:0.87" aria-hidden="true"><svg class="scada-component-svg" viewBox="0 0 180 136" aria-hidden="true" focusable="false" x="0" y="0" width="280" height="194" preserveAspectRatio="xMidYMid meet"><defs>
