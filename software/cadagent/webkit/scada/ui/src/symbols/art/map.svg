<svg xmlns="http://www.w3.org/2000/svg" width="560" height="408" viewBox="0 0 560 408" role="img" aria-labelledby="title desc">
  <title id="title">Process artwork source map</title>
  <desc id="desc">The parent components.mjs renderer imports five artwork families: control, process, industrial, agriculture and twin. The arrows show these imports, not simulated material flow.</desc>
  <style>
    svg { --paper:#fffdf5; --ink:#173d3c; --near:#eef1e4; --line:#6f8a80; }
    @media (prefers-color-scheme:dark) { svg { --paper:#112025; --ink:#e7faf5; --near:#1d343c; --line:#89aea4; } }
    .paper { fill:var(--paper); } .source { fill:var(--near); stroke:var(--line); }
    .module { fill:var(--paper); stroke:var(--line); }
    .edge { fill:none; stroke:var(--line); stroke-width:2; }
    .arrow { fill:var(--line); }
    text { fill:var(--ink); font-family:system-ui,sans-serif; font-size:16px; }
    .name { font-size:17px; font-weight:600; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow" d="M0 0 8 4 0 8Z"/></marker></defs>
  <rect class="paper" width="560" height="408" rx="12"/>
  <rect class="source" x="18" y="163" width="190" height="80" rx="10"/>
  <text class="name" x="113" y="193" text-anchor="middle">components.mjs</text>
  <text x="113" y="219" text-anchor="middle">parent renderer</text>
  <path class="edge" d="M208 203H239M239 48V356"/>
  <text x="18" y="144">Artwork imports</text>
  <g class="edge" marker-end="url(#arrow)"><path d="M239 48H267"/><path d="M239 125H267"/><path d="M239 202H267"/><path d="M239 279H267"/><path d="M239 356H267"/></g>
  <g>
    <rect class="module" x="270" y="18" width="272" height="60" rx="8"/>
    <text class="name" x="286" y="43">control.mjs</text><text x="286" y="65">PLC, IO and networks</text>
    <rect class="module" x="270" y="95" width="272" height="60" rx="8"/>
    <text class="name" x="286" y="120">process.mjs</text><text x="286" y="142">Process and damage details</text>
    <rect class="module" x="270" y="172" width="272" height="60" rx="8"/>
    <text class="name" x="286" y="197">industrial.mjs</text><text x="286" y="219">Machinery and solids</text>
    <rect class="module" x="270" y="249" width="272" height="60" rx="8"/>
    <text class="name" x="286" y="274">agriculture.mjs</text><text x="286" y="296">Growing, water and climate</text>
    <rect class="module" x="270" y="326" width="272" height="60" rx="8"/>
    <text class="name" x="286" y="351">twin.mjs</text><text x="286" y="373">Shared Digester Twin art</text>
  </g>
</svg>
