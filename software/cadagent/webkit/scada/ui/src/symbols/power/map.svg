<svg xmlns="http://www.w3.org/2000/svg" width="560" height="396" viewBox="0 0 560 396" role="img" aria-labelledby="title desc">
  <title id="title">Power artwork source map</title>
  <desc id="desc">The parent components.mjs renderer imports energy.mjs, electrical.mjs, generators.mjs and nuclear.mjs. Energy, electrical and generator artwork also import shared geometry from primitives.mjs. Nuclear artwork is independent of that helper.</desc>
  <style>
    svg { --paper:#fffdf5; --ink:#173d3c; --near:#eef1e4; --line:#6f8a80; }
    @media (prefers-color-scheme:dark) { svg { --paper:#112025; --ink:#e7faf5; --near:#1d343c; --line:#89aea4; } }
    .paper { fill:var(--paper); } .source { fill:var(--near); stroke:var(--line); }
    .module { fill:var(--paper); stroke:var(--line); }
    .edge { fill:none; stroke:var(--line); stroke-width:2; }
    .arrow { fill:var(--line); }
    text { fill:var(--ink); font-family:system-ui,sans-serif; font-size:16px; }
    .name { font-size:17px; font-weight:600; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow" d="M0 0 8 4 0 8Z"/></marker></defs>
  <rect class="paper" width="560" height="396" rx="12"/>
  <rect class="source" x="170" y="18" width="220" height="70" rx="10"/>
  <text class="name" x="280" y="45" text-anchor="middle">components.mjs</text>
  <text x="280" y="70" text-anchor="middle">parent renderer</text>
  <path class="edge" d="M280 88V250"/>
  <text x="292" y="116">imports</text>
  <g class="edge" marker-end="url(#arrow)"><path d="M280 164H263"/><path d="M280 164H297"/><path d="M280 250H263"/><path d="M280 250H297"/></g>
  <g>
    <rect class="module" x="18" y="132" width="242" height="64" rx="8"/>
    <text class="name" x="34" y="158">energy.mjs</text><text x="34" y="181">Prime movers and energy</text>
    <rect class="module" x="300" y="132" width="242" height="64" rx="8"/>
    <text class="name" x="316" y="158">electrical.mjs</text><text x="316" y="181">Grid and conversion</text>
    <rect class="module" x="18" y="218" width="242" height="64" rx="8"/>
    <text class="name" x="34" y="244">generators.mjs</text><text x="34" y="267">Genset variants</text>
    <rect class="module" x="300" y="218" width="242" height="64" rx="8"/>
    <text class="name" x="316" y="244">nuclear.mjs</text><text x="316" y="267">Conceptual nuclear art</text>
  </g>
  <path class="edge" d="M18 310H542"/>
  <text class="name" x="18" y="339">primitives.mjs</text>
  <text x="18" y="365">Shared geometry imported by energy, electrical</text>
  <text x="18" y="387">and generator artwork.</text>
</svg>
