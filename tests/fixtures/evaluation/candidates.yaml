schema: cad-agent-candidate-catalog/1
purpose: Non-executable planning index. Existing v1 jobs remain authoritative; candidate prompts require frozen
  inputs and qualified graders before execution.
sources:
  cad-agent-v1:
    url: https://github.com/Valpatel/cad-agent/tree/ef2ad3fb/tests/fixtures/evaluation/jobs
    reuse: Existing runnable analytical jobs; preserve manifests and independent graders.
    license_note: Repository MIT; no new imported assets.
  cad-agent-quickstart:
    url: https://github.com/Valpatel/cad-agent/blob/ef2ad3fb/tools/quickstart_eval.py
    reuse: Borrow observed install/discovery evidence, not its environment setup.
    license_note: Repository MIT; existing collector isolation limits still apply.
  cad-agent-design:
    url: https://github.com/Valpatel/cad-agent/blob/ef2ad3fb/docs/practice/standard-evaluation.md
    reuse: Existing native-CAD plan, acceptance controls and evidence contract.
    license_note: Repository MIT; no new imported assets.
  cadgenbench:
    url: https://github.com/huggingface/cadgenbench
    reuse: Generation/editing task families and reopened STEP checks; not shape similarity as requirement compliance.
    license_note: Apache-2.0 code; verify each dataset asset before importing. Public inputs/private ground truth.
  cadtestbench:
    url: https://github.com/dimitrismallis/CADTestBench
    reuse: Independent requirement checks on BREP, abstract and detailed prompt variants.
    license_note: MIT code and dataset card declares MIT; retain attribution and verify chosen snapshot before import.
  benchcad:
    url: https://github.com/BenchCAD/BenchCAD-main
    reuse: CAD understanding/editing/vision task taxonomy.
    license_note: LICENSE distinguishes MIT code and CC-BY-4.0 data; no assets imported.
  text2cad-bench:
    url: https://huggingface.co/datasets/AICAD/Text2CAD-Bench
    reuse: Difficulty and prompt-specificity axes only.
    license_note: Data license not verified; link-only. Public prompts are partial and ground truth is withheld.
  cadworld:
    url: https://github.com/Zdong104/CADWORLD
    reuse: Broader GUI task categories including assembly, manufacturing, measurement and simulation.
    license_note: Repository-wide license not verified; link-only.
  pcbench:
    url: https://github.com/PCBench/PCBench
    reuse: PCB routing constraints and source metadata as candidate input design.
    license_note: MIT repository; original per-board licenses must be checked before any asset reuse.
  pcb-bench:
    url: https://github.com/digailab/PCB-Bench
    reuse: Board understanding and QA task family.
    license_note: Concrete dataset redistribution terms not verified; link-only.
  original:
    url: https://github.com/Valpatel/cad-agent/issues/657
    reuse: Original experience/task briefs written for this catalog; no external dataset copied.
    license_note: Repository MIT. Product/source inputs still need separate provenance before promotion.
