# The gate bench as a project: `cad-agent gates --build` builds it and runs every gate (tests/test_gates_cli.py).
# cad/parameters.json names a seeded defect ({"seed": null} for the clean bench).
cad:
  name: gate-bench
  title: Gate bench
  steps:
    - {name: build, run: cad/build.py}
  dossier: dossier/project.yaml
  gates:
    build: cad/build.py
    declarations: dossier/gate-declarations.yaml
    containment: {support: fail}
