# The gate bench's dossier: the YAML half of its declarations (the geometry half is registered in code)
title: Gate bench
requirements:
- id: R1
  text: Holds eight balls
  source:
    kind: derived
    quote: Holds eight balls
  verify_by: analysis
  checks:
  - gate:containment
- id: R2
  text: The arm lifts 40 deg without hitting anything
  source:
    kind: derived
    quote: The arm lifts 40 deg without hitting anything
  verify_by: analysis
  checks:
  - gate:motion
- id: R3
  text: Every part is held
  source:
    kind: derived
    quote: Every part is held
  verify_by: analysis
  checks:
  - gate:connectivity
sections:
- sections/*.yaml
interfaces:
- id: I-hopper
  between:
  - base
  - hopper
  kind: contact
  datum: seat
- id: I-lid
  between:
  - hopper
