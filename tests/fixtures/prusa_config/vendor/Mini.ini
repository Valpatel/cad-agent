# A tiny PrusaSlicer vendor bundle for tests (the real one is PrusaResearch.ini).

[vendor]
name = Mini

[printer:*common*]
bed_shape = 0x0,250x0,250x210,0x210
binary_gcode = 1
nozzle_diameter = 0.4
printer_notes = PRINTER_VENDOR_PRUSA3D

[printer:Test MK4S]
inherits = *common*
printer_model = MK4S
renamed_from = "Old Test MK4S"

[print:*common*]
perimeters = 3
fill_density = 15%
layer_height = 0.2
spiral_vase = 0

[print:*mk4s*]
fill_density = 20%
gcode_label_objects = firmware

[print:0.20mm TEST]
inherits = *common*; *mk4s*
perimeters = 2
compatible_printers_condition = printer_model=="MK4S"

[filament:*PLA*]
filament_type = PLA
filament_density = 1.24

[filament:Test PLA]
inherits = *PLA*
filament_cost =
cooling= 1
start_filament_gcode = "M572 S{if nozzle_diameter[0]==0.4}0.05{endif} ; 100% [comment]\nM900"

[filament:Loop A]
inherits = Loop B

[filament:Loop B]
inherits = Loop A

[filament:Orphan]
inherits = Missing Parent
